name: Deploy Peptide Planner v19 time-box hotfix

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v19_timebox_hotfix_release_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified v19 and apply time-box-only hotfix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          EXPECTED_V9 = 'bcebcd78b5a63a518e5114cea56e787800ab0d71fbd4b835b2e9b3ee5ee389d3'
          EXPECTED_V15 = '59543b450c89db382c2be4da8a31df98528b9893d8bfb6f38c8077e9bce8a536'
          EXPECTED_V18 = '50e2fd4c3902b935144adb58fad943cdb6fd886c28e4a56a42f414ed835987cb'
          EXPECTED_V19 = 'f544d8a6a345be415cc33ea7ddb922b9e40efac0d2865866fa90791d05a71eb6'

          HOTFIX = r'''
          <style id="v19-cycle-time-box-only-hotfix">
          /* Requested only: keep Cycle setup > Time inside its mobile grid cell
             and make its box dimensions match Break. */
          @media(max-width:760px){
            body.mobile-app #planner .cycle-config-grid>div:nth-child(2){
              min-width:0!important;
              max-width:100%!important;
              overflow:hidden!important;
            }
            body.mobile-app #planner .cycle-config-grid>div:nth-child(2)>input[type="time"][data-cycle-config-field="injectionTime"]{
              -webkit-appearance:none!important;
              appearance:none!important;
              display:block!important;
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              inline-size:100%!important;
              min-inline-size:0!important;
              max-inline-size:100%!important;
              height:46px!important;
              min-height:46px!important;
              max-height:46px!important;
              block-size:46px!important;
              padding:0 11px!important;
              line-height:1.2!important;
              box-sizing:border-box!important;
              overflow:hidden!important;
            }
            body.mobile-app #planner .cycle-config-grid>div:nth-child(2)>input[type="time"][data-cycle-config-field="injectionTime"]::-webkit-date-and-time-value{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              padding:0!important;
              margin:0!important;
            }
          }
          </style>
          '''.strip()

          def split_lines(text):
              return text.splitlines(keepends=True)

          def apply_patch(source, patch):
              src = split_lines(source)
              pl = split_lines(patch)
              out = []
              si = 0
              i = 0
              while i < len(pl) and not pl[i].startswith('@@ '):
                  i += 1
              while i < len(pl):
                  header = pl[i].rstrip('\n')
                  m = re.match(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', header)
                  if not m:
                      raise RuntimeError('Invalid deployment patch header: ' + header)
                  old_start = int(m.group(1))
                  old_count = 1 if m.group(2) is None else int(m.group(2))
                  target = old_start if old_count == 0 else old_start - 1
                  if target < si:
                      raise RuntimeError('Overlapping deployment patch')
                  while si < target:
                      out.append(src[si]); si += 1
                  i += 1
                  consumed = 0
                  while i < len(pl) and not pl[i].startswith('@@ '):
                      line = pl[i]
                      mark = line[:1]
                      body = line[1:]
                      if mark == ' ':
                          if si >= len(src) or src[si] != body:
                              raise RuntimeError('Deployment context mismatch')
                          out.append(src[si]); si += 1; consumed += 1
                      elif mark == '-':
                          if si >= len(src) or src[si] != body:
                              raise RuntimeError('Deployment source mismatch')
                          si += 1; consumed += 1
                      elif mark == '+':
                          out.append(body)
                      elif mark == '\\':
                          pass
                      elif line.strip() != '':
                          raise RuntimeError('Invalid deployment patch line')
                      i += 1
                  if consumed != old_count:
                      raise RuntimeError(f'Deployment patch count mismatch: {consumed} != {old_count}')
              out.extend(src[si:])
              return ''.join(out)

          def inflate(paths):
              payload = ''.join(Path(p).read_text().strip() for p in paths)
              return zlib.decompress(base64.b64decode(payload)).decode('utf-8')

          base = Path('Peptide_Planner_KB_Mobile_v184.html').read_text()
          chain = [
              [f'.deploy/v189_patch_part_{n:02d}.b64' for n in range(1,5)],
              ['.deploy/v190_delta_from_v189live.b64'],
              ['.deploy/v191_delta_from_v190live.b64'],
              ['.deploy/v193_delta_from_v191live.b64'],
              ['.deploy/v194_delta_from_v193live.b64'],
              [f'.deploy/v195_delta_part_{n:02d}.b64' for n in range(1,5)],
              ['.deploy/v1_delta_from_v195live.b64'],
              ['.deploy/v2_delta_from_v1live.b64'],
              ['.deploy/v3_delta_from_v2live.b64'],
              ['.deploy/v4_delta_from_v3live.b64'],
              ['.deploy/v5_delta_from_v4live.b64'],
              ['.deploy/v6_delta_from_v5live.b64'],
              ['.deploy/v7_delta_from_v6live.b64'],
              ['.deploy/v8_delta_from_v7live.b64'],
              [f'.deploy/v9_delta_part_{n:02d}.b64' for n in range(1,5)],
          ]
          current = base
          for paths in chain:
              current = apply_patch(current, inflate(paths))
          actual_v9 = hashlib.sha256(current.encode()).hexdigest()
          if actual_v9 != EXPECTED_V9:
              raise SystemExit(f'v9 checksum mismatch: {actual_v9}')

          v15 = apply_patch(current, inflate([
              '.deploy/v15_patch_part_01.b64',
              '.deploy/v15_patch_part_02.b64',
              '.deploy/v15_patch_part_03a.b64',
              '.deploy/v15_patch_part_03b.b64',
              '.deploy/v15_patch_part_04.b64',
              '.deploy/v15_patch_part_05.b64',
              '.deploy/v15_patch_part_06.b64',
          ]))
          actual_v15 = hashlib.sha256(v15.encode()).hexdigest()
          if actual_v15 != EXPECTED_V15:
              raise SystemExit(f'v15 checksum mismatch: {actual_v15}')

          v18 = apply_patch(v15, inflate(['.deploy/v18_delta_from_v15.b64']))
          actual_v18 = hashlib.sha256(v18.encode()).hexdigest()
          if actual_v18 != EXPECTED_V18:
              raise SystemExit(f'v18 checksum mismatch: {actual_v18}')

          v19 = apply_patch(v18, inflate(['.deploy/v19_delta_from_v18.b64']))
          actual_v19 = hashlib.sha256(v19.encode()).hexdigest()
          if actual_v19 != EXPECTED_V19:
              raise SystemExit(f'v19 checksum mismatch: {actual_v19}')

          if v19.count('</head>') != 1:
              raise SystemExit('Unexpected </head> count in v19')
          hotfixed = v19.replace('</head>', HOTFIX + '\n</head>', 1)
          required = [
              '<title>Peptide Planner v19</title>',
              'const APP_VERSION="v19";',
              'id="v18-treatment-mobile-layout-fix"',
              'id="v19-cycle-time-box-only-hotfix"',
              'data-cycle-config-field="injectionTime"',
              'height:46px!important;',
              'overflow:hidden!important;',
              '::-webkit-date-and-time-value',
              'id="plannerAccessGate"',
              'from("planner_state")',
          ]
          missing = [item for item in required if item not in hotfixed]
          if missing:
              raise SystemExit('Hotfix validation failed: ' + ', '.join(missing))
          if 'Enable schedule' in hotfixed:
              raise SystemExit('Hotfix unexpectedly contains Enable schedule')

          Path('dist').mkdir(exist_ok=True)
          Path('dist/index.html').write_text(hotfixed)
          print('Verified v19 base and applied time-box-only hotfix.')
          PY

      - name: Validate JavaScript and mobile time-box geometry
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          inline = '\n'.join(s for s in scripts if s.strip() and 'application/ld+json' not in s[:100])
          Path('/tmp/v19-hotfix-inline.js').write_text(inline)
          styles = '\n'.join(re.findall(r'<style[^>]*>.*?</style>', html, flags=re.I|re.S))
          fixture = f'''<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">{styles}</head><body class="mobile-app">
          <div id="planner"><div class="cycle-config-grid">
            <div><label>Start date</label><input type="date" data-cycle-config-field="startDate" value="2026-08-31"></div>
            <div><label>Time</label><input type="time" data-cycle-config-field="injectionTime" value="22:00"></div>
            <div><label>Active</label><input type="number" data-cycle-config-field="activeWeeks" value="12"></div>
            <div><label>Break</label><input type="number" data-cycle-config-field="breakWeeks" value="4"></div>
            <div><label>Schedule</label><select data-cycle-config-field="scheduleMode"><option>Choose weekdays</option></select></div>
            <div><label>Interval</label><input type="number" data-cycle-config-field="intervalDays" value="7"></div>
            <div><label>Weekdays</label></div>
          </div></div>
          <div id="test-result"></div>
          <script>
          (()=>{{const b=e=>e.getBoundingClientRect(),q=s=>document.querySelector(s),time=q('[data-cycle-config-field=injectionTime]'),brk=q('[data-cycle-config-field=breakWeeks]'),cell=time.parentElement,t=b(time),r=b(brk),c=b(cell);const same=(a,b)=>Math.abs(a-b)<1;const ok=document.documentElement.scrollWidth<=innerWidth&&same(t.width,r.width)&&same(t.height,r.height)&&Math.round(t.height)===46&&t.left>=c.left-.5&&t.right<=c.right+.5;document.getElementById('test-result').setAttribute('data-test-result',ok?'pass':'fail');}})();
          </script></body></html>'''
          Path('/tmp/v19-timebox-fixture.html').write_text(fixture)
          PY
          node --check /tmp/v19-hotfix-inline.js
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on this runner.' >&2
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --dump-dom file:///tmp/v19-timebox-fixture.html > /tmp/v19-timebox-390.html
          grep -q 'data-test-result="pass"' /tmp/v19-timebox-390.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=320,700 --dump-dom file:///tmp/v19-timebox-fixture.html > /tmp/v19-timebox-320.html
          grep -q 'data-test-result="pass"' /tmp/v19-timebox-320.html
          echo 'Mobile Time/Break geometry passed at 390px and 320px widths.'

      - name: Confirm this is still the newest main commit
        id: freshness
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          echo "workflow_commit=$GITHUB_SHA"
          echo "current_main=$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo 'Skipping stale deployment so an older build cannot replace production.'
          fi

      - name: Deploy v19 time-box hotfix to Cloudflare Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
