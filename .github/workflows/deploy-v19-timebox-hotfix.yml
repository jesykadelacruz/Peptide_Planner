name: Deploy Peptide Planner v19 time-box hotfix

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v19_timebox_hotfix_release_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture exact live v19 and apply time-box-only hotfix
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL --retry 5 --retry-delay 2 'https://peptide-planner.pages.dev/' -o /tmp/current-v19.html
          python - <<'PY'
          from pathlib import Path
          import hashlib

          EXPECTED_V19 = 'f544d8a6a345be415cc33ea7ddb922b9e40efac0d2865866fa90791d05a71eb6'
          src = Path('/tmp/current-v19.html').read_bytes()
          actual = hashlib.sha256(src).hexdigest()
          if actual != EXPECTED_V19:
              raise SystemExit(f'Live v19 checksum mismatch; refusing to deploy: {actual}')
          html = src.decode('utf-8')
          if html.count('</head>') != 1:
              raise SystemExit('Unexpected </head> count in live v19')

          hotfix = r'''
          <style id="v19-cycle-time-box-only-hotfix">
          /* Requested only: keep Cycle setup > Time inside its mobile grid cell
             and make its visible box dimensions match Break. */
          @media(max-width:760px){
            body.mobile-app #planner .cycle-config-grid>div:nth-child(2){
              min-width:0!important;
              max-width:100%!important;
              overflow:hidden!important;
            }
            body.mobile-app #planner .cycle-config-grid>div:nth-child(2)>input[type="time"][data-cycle-config-field="injectionTime"]{
              -webkit-appearance:none!important;
              appearance:none!important;
              display:block!important;
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              inline-size:100%!important;
              min-inline-size:0!important;
              max-inline-size:100%!important;
              height:46px!important;
              min-height:46px!important;
              max-height:46px!important;
              block-size:46px!important;
              padding:0 11px!important;
              line-height:1.2!important;
              box-sizing:border-box!important;
              overflow:hidden!important;
            }
            body.mobile-app #planner .cycle-config-grid>div:nth-child(2)>input[type="time"][data-cycle-config-field="injectionTime"]::-webkit-date-and-time-value{
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              padding:0!important;
              margin:0!important;
            }
          }
          </style>
          '''.strip()

          out = html.replace('</head>', hotfix + '\n</head>', 1)
          required = [
              '<title>Peptide Planner v19</title>',
              'const APP_VERSION="v19";',
              'id="v18-treatment-mobile-layout-fix"',
              'id="v19-cycle-time-box-only-hotfix"',
              'data-cycle-config-field="injectionTime"',
              'height:46px!important;',
              '::-webkit-date-and-time-value',
              'id="plannerAccessGate"',
              'from("planner_state")',
          ]
          missing = [x for x in required if x not in out]
          if missing:
              raise SystemExit('Hotfix validation failed: ' + ', '.join(missing))
          if 'Enable schedule' in out:
              raise SystemExit('Unexpected legacy Enable schedule text detected')
          Path('dist/index.html').write_text(out, encoding='utf-8')
          print('Live v19 checksum verified and Time-only CSS hotfix applied.')
          PY

      - name: Validate JavaScript and mobile Time/Break geometry
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          inline = '\n'.join(s for s in scripts if s.strip() and 'application/ld+json' not in s[:100])
          Path('/tmp/v19-hotfix-inline.js').write_text(inline)
          styles = '\n'.join(re.findall(r'<style[^>]*>.*?</style>', html, flags=re.I|re.S))
          fixture = f'''<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">{styles}</head><body class="mobile-app">
          <div id="planner"><div class="cycle-config-grid">
            <div><label>Start date</label><input type="date" data-cycle-config-field="startDate" value="2026-08-31"></div>
            <div><label>Time</label><input type="time" data-cycle-config-field="injectionTime" value="22:00"></div>
            <div><label>Active</label><input type="number" data-cycle-config-field="activeWeeks" value="12"></div>
            <div><label>Break</label><input type="number" data-cycle-config-field="breakWeeks" value="4"></div>
            <div><label>Schedule</label><select data-cycle-config-field="scheduleMode"><option>Choose weekdays</option></select></div>
            <div><label>Interval</label><input type="number" data-cycle-config-field="intervalDays" value="7"></div>
            <div><label>Weekdays</label></div>
          </div></div><div id="test-result"></div>
          <script>(()=>{{const b=e=>e.getBoundingClientRect(),q=s=>document.querySelector(s),time=q('[data-cycle-config-field=injectionTime]'),brk=q('[data-cycle-config-field=breakWeeks]'),cell=time.parentElement,t=b(time),r=b(brk),c=b(cell),same=(a,b)=>Math.abs(a-b)<1;const ok=document.documentElement.scrollWidth<=innerWidth&&same(t.width,r.width)&&same(t.height,r.height)&&Math.round(t.height)===46&&t.left>=c.left-.5&&t.right<=c.right+.5;document.getElementById('test-result').setAttribute('data-test-result',ok?'pass':'fail');}})();</script></body></html>'''
          Path('/tmp/v19-timebox-fixture.html').write_text(fixture)
          PY
          node --check /tmp/v19-hotfix-inline.js
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --dump-dom file:///tmp/v19-timebox-fixture.html > /tmp/timebox-390.html
          grep -q 'data-test-result="pass"' /tmp/timebox-390.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=320,700 --dump-dom file:///tmp/v19-timebox-fixture.html > /tmp/timebox-320.html
          grep -q 'data-test-result="pass"' /tmp/timebox-320.html
          echo 'Time/Break geometry passed at 390px and 320px.'

      - name: Confirm this is still the newest main commit
        id: freshness
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo 'Skipping stale deployment.'
          fi

      - name: Deploy v19 Time-box hotfix to Cloudflare Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
