name: Apply Peptide Planner v2026.0209.014 vial schedule automation patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-014.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "a7c3480015d24519f02d9f45d7ead93a8b0091dc5d44c046ddc17e3ba925f2f5  index.html" | sha256sum -c -

      - name: Apply exact v2026.0209.014 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_014.patch.xz.b64 | xz -d > /tmp/v014.patch
          patch --batch --forward -p0 < /tmp/v014.patch
          echo "d09d2b493064f985a4eb1ddf8925fb7c64f6a24aa286b7719e0a7c9a8c9cb03b  index.html" | sha256sum -c -

      - name: Validate requested changes and protected functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=[
            'Peptide Planner v2026.0209.014',
            'const APP_VERSION="v2026.0209.014";',
            '<h3>Cycle Settings</h3>',
            '<label>Vial Schedule</label>',
            '<span>Vial #</span><span>Date Open</span><span>Date Finished</span><span>Status</span>',
            'cycleVialScheduleStatus(openDate,finishDate',
            'scheduleOpenAuto',
            'scheduleFinishAuto',
            'data-cycle-vial-open-date',
            'data-cycle-vial-finish-date',
            'data-cycle-add-vial',
            'data-cycle-remove-vial',
            'data-cycle-phase-weekday',
            'data-cycle-phase-split',
            'data-cycle-config-field="injectionTime"',
            'data-cycle-config-field="scheduleMode"',
            'data-cycle-config-field="intervalDays"',
            'data-plan-active-weeks',
            'data-plan-break-weeks',
            'Review &amp; verify',
            'planner_notification_preferences',
            'planner_push_subscriptions',
            'planner_notification_queue',
            'SUPABASE_URL'
          ]
          for marker in required:
              assert marker in s, marker
          settings_start=s.index('<details class="peptide-settings"')
          settings_end=s.index('<input type="hidden" data-simple-field="unitsPerMl"',settings_start)
          assert 'renderPeptideVialSchedule' not in s[settings_start:settings_end]
          render_start=s.index('function renderCycleConfigVialSchedule')
          render_end=s.index('function renderPeptideVialSchedule',render_start)
          renderer=s[render_start:render_end]
          assert 'data-cycle-vial-opened' not in renderer
          assert 'cycle-vial-status-' in renderer
          dose_start=s.index('function renderCycleDoseRows')
          dose_end=s.index('function cycleSetupVisualState',dose_start)
          assert 'data-cycle-phase-weekday' in s[dose_start:dose_end]
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/planner-inline.js

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.014"
          git push origin HEAD:main
