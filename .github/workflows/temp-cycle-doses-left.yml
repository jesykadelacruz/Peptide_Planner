name: Temporary cycle doses-left release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-cycle-doses-left.yml

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare Peptide_Planner_v20261009.11 cycle doses-left release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard release baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s HEAD^)" = "Peptide_Planner_v20261009.10"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp-cycle-doses-left.yml"
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261009.10";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.10';" peptide-planner-sw.js
          ! grep -Fq 'function currentCycleDosesLeft(' index.html

      - name: Apply only requested changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import subprocess

          patch_b64 = ""
          patch_b64 = patch_b64.replace("3NpdGlvbi8uc2VxdW", "3NpdGlvbj8uc2VxdW")
          subprocess.run(
              ["git", "apply", "--whitespace=nowarn", "-"],
              input=base64.b64decode(patch_b64),
              check=True,
          )
          PY

      - name: Validate syntax, scope, and calculations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<title>Peptide_Planner_v20261009.11</title>' index.html
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261009.11";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.11';" peptide-planner-sw.js
          grep -Fq 'body.mobile-app #planner .cycle-config-card[data-cycle-config="1"] .cycle-config-grid > div:nth-child(2) > input[data-cycle-config-field="injectionTime"]' index.html
          ! grep -Fq 'transform:translateY(5px)!important' index.html
          grep -Fq 'function currentCycleDosesLeft(' index.html
          grep -Fq 'plan.noCycle?currentVialDosesLeft(plan,new Date()):currentCycleDosesLeft(plan,new Date())' index.html
          grep -Fq '${plan.noCycle?"Dose left in vial":"Doses left in cycle"}' index.html
          node --check peptide-planner-sw.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match=>match[1]).filter(code=>code.trim());
          scripts.forEach(code=>new Function(code));
          const start=html.indexOf('function currentCycleDosesLeft(');
          assert(start>=0);
          const open=html.indexOf('{',start);
          let depth=0,end=-1;
          for(let i=open;i<html.length;i+=1){
            if(html[i]==='{')depth+=1;
            else if(html[i]==='}'&&--depth===0){end=i+1;break;}
          }
          assert(end>start);
          const source=html.slice(start,end);
          function runCase({days,parts=1,done=[],recorded=[],sequence=1}){
            const periodStart=new Date(2026,0,1),activeEnd=new Date(2026,0,days);
            const completed=new Set(done),adminRecords=new Set(recorded);
            const context={Date,
              num:value=>{const number=Number(value);return Number.isFinite(number)?number:null;},
              isSeparateCycleStack:()=>false,planCycleNumber:()=>1,
              protocolPositionForDate:()=>({valid:true,sequence}),
              protocolPeriodForSequence:()=>({valid:true,start:periodStart,activeEnd}),
              addDays:(date,number)=>{const copy=new Date(date.getFullYear(),date.getMonth(),date.getDate());copy.setDate(copy.getDate()+number);return copy;},
              localDateISO:date=>[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-'),
              scheduleForDate:()=>({administration:true,doseMg:1,units:10,administrations:Array.from({length:parts},(_,i)=>({partKey:parts>1?'split-'+(i+1):'',doseMg:1/parts,units:10/parts}))}),
              injectionDone:(id,date,part)=>completed.has([id,date,part].join('|')),
              scheduledAdministrationRecorded:(id,date,part)=>adminRecords.has([id,date,part].join('|'))
            };
            vm.createContext(context);vm.runInContext(source,context);
            return JSON.parse(JSON.stringify(context.currentCycleDosesLeft({id:'plan-1',noCycle:false},new Date(2026,0,3))));
          }
          const firstFive=Array.from({length:5},(_,i)=>['plan-1','2026-01-'+String(i+1).padStart(2,'0'),''].join('|'));
          assert.deepStrictEqual(runCase({days:65,done:firstFive}),{valid:true,doses:60,total:65,completed:5,cycleNumber:1});
          assert.deepStrictEqual(runCase({days:10,parts:2,done:['plan-1|2026-01-01|split-1','plan-1|2026-01-01|split-2'],recorded:['plan-1|2026-01-02|split-1'],sequence:2}),{valid:true,doses:17,total:20,completed:3,cycleNumber:2});
          console.log('Inline syntax and cycle dose-count tests passed.');
          NODE

      - name: Build and verify Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          zip -q -j Peptide_Planner_v20261009.11.zip release/_headers release/index.html release/manifest.webmanifest release/peptide-planner-sw.js
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = ['_headers', 'index.html', 'manifest.webmanifest', 'peptide-planner-sw.js']
          with ZipFile('Peptide_Planner_v20261009.11.zip') as archive:
              assert sorted(archive.namelist()) == sorted(expected), archive.namelist()
              assert archive.testzip() is None
              for name in expected:
                  assert archive.read(name) == Path(name).read_bytes(), name
          PY

      - name: Commit exact release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html peptide-planner-sw.js
          git rm .github/workflows/temp-cycle-doses-left.yml
          test -z "$(git diff --name-only HEAD^ -- _headers manifest.webmanifest)"
          test "$(git diff --cached --name-only HEAD^ | sort | tr '\n' ' ')" = "index.html peptide-planner-sw.js "
          git diff --cached --check
          git commit -m 'Peptide_Planner_v20261009.11'
          git push origin HEAD:main

      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.11
          path: |
            Peptide_Planner_v20261009.11.zip
            release/_headers
            release/index.html
            release/manifest.webmanifest
            release/peptide-planner-sw.js
          if-no-files-found: error
          retention-days: 7
