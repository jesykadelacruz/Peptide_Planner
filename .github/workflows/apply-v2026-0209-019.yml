name: Apply Peptide Planner v2026.0209.019 overview anchoring patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline
        run: |
          echo "c3be94f7647b98fcab550100df88ef3bf3017af9e426ca07d2d2992a442cc4ab  index.html" | sha256sum -c -
      - name: Apply exact patch
        run: |
          base64 -d .deploy/v2026_0209_019.patch.xz.b64 | xz -d > /tmp/v019.patch
          patch index.html < /tmp/v019.patch
      - name: Validate production file
        run: |
          echo "e522b1e0e4c224a02c2b360616e4fe9da4b0f5be44d939a6ac264bc68d802d1e  index.html" | sha256sum -c -
          grep -Fq '<title>Peptide Planner v2026.0209.019</title>' index.html
          grep -Fq 'const config=cycleConfigForSequence(plan,1);if(!config)return "Cycle schedule not set";' index.html
          grep -Fq '<span>Initial Cycle Start</span>' index.html
          grep -Fq '<span>Initial Cycle End</span>' index.html
          grep -Fq '<span>Schedule</span>' index.html
          grep -Fq '<span>Route</span>' index.html
          grep -Fq '<span>Dose (units)</span>' index.html
          grep -Fq '<span>Dose left in vial</span>' index.html
          grep -Fq '<span>Vials per cycle</span>' index.html
          grep -Fq '<span>Cycle count</span>' index.html
          grep -Fq '<span>Current cycle</span>' index.html
          grep -Fq '<th>Vial #</th><th>Dose (full dose)</th><th>Open</th><th>Finish</th><th>Status</th>' index.html
          grep -Fq 'grid-template-areas:' index.html
          grep -Fq '"vial status"' index.html
          grep -Fq '"open finish"' index.html
          grep -Fq 'data-cycle-phase-weekday' index.html
          grep -Fqi 'supabase' index.html
          grep -Fqi 'forgot password' index.html
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/app.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/app.js
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.019"
          git push
