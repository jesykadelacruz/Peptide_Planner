name: Apply Peptide Planner v2026.0209.014 vial layout fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-014-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current v014 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "d09d2b493064f985a4eb1ddf8925fb7c64f6a24aa286b7719e0a7c9a8c9cb03b  index.html" | sha256sum -c -

      - name: Apply exact layout fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_014_layout.patch.xz.b64 | xz -d > /tmp/v014-layout.patch
          patch --batch --forward -p0 < /tmp/v014-layout.patch
          echo "582c2a25c17e33b408086739c2eec44286b395eb621cf532a24a46142b374156  index.html" | sha256sum -c -

      - name: Validate final production source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'Peptide Planner v2026.0209.014' in s
          assert 'grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 180px;' in s
          assert '<h3>Cycle Settings</h3>' in s
          assert '<label>Vial Schedule</label>' in s
          assert '<span>Vial #</span><span>Date Open</span><span>Date Finished</span><span>Status</span>' in s
          assert 'data-cycle-phase-weekday' in s
          assert 'SUPABASE_URL' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/planner-inline.js

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize Peptide Planner v2026.0209.014 vial layout"
          git push origin HEAD:main
