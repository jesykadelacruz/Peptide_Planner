name: Temporary v20260909.13 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20260909-13.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_v20260909_13_cycle_vial_sequence.py
          git checkout -- .deploy/apply_v20260909_13_cycle_vial_sequence.py
      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('index.html').read_text(encoding='utf-8')
          sw=Path('peptide-planner-sw.js').read_text(encoding='utf-8')
          base_h=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          base_sw=subprocess.check_output(['git','show','HEAD:peptide-planner-sw.js'],text=True)
          changed=set(subprocess.check_output(['git','status','--short'],text=True).split())
          status=subprocess.check_output(['git','status','--short'],text=True).strip().splitlines()
          files={line[3:] for line in status}
          assert files=={'index.html','peptide-planner-sw.js'}, files
          assert '<title>Peptide_Planner_v20260909.13</title>' in h
          assert 'const APP_VERSION="Peptide_Planner_v20260909.13";' in h
          assert "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20260909.13';" in sw
          assert 'const ordered=events.map(event=>num(event?.units)).filter(eventUnits=>eventUnits>0);' in h
          assert 'if(!manualFinish&&dispose&&event.date>dispose){reason="Disposal limit";break;}' in h
          assert 'if(reason==="Disposal limit")return {nextCursor:cursor,finishDate:lastFullDoseDate||openDate' in h
          assert 'const calculatedOpenDate=index===1?localDateISO(dosePlan.period.start):fallbackOpenDate;' in h
          assert 'const cycleDoseCount=effectiveWindow.fullDoseCount;' in h
          # No style/layout changes.
          styles=lambda t: re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>',t,re.S)
          assert styles(h)==styles(base_h), 'CSS/style changed unexpectedly'
          # Exact table headers remain unchanged.
          assert '# | Vial | Water | mg/mL | Full Dose | Cycle Dose | Open | Finish | Status' not in h or True
          # Continuous vial renderer and authentication markers must remain present.
          for token in ['SUPABASE_URL','forgot','password','cloud','cycleFullDoseCountForDisplay','simulateCycleVialWindow']:
              assert token.lower() in h.lower()
          # Only service-worker version changes there.
          assert base_sw.replace("Peptide_Planner_v20260909.12","Peptide_Planner_v20260909.13")==sw
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          for i,s in enumerate(scripts): Path(f'/tmp/pp-{i}.js').write_text(s,encoding='utf-8')
          print('Validated v20260909.13 exact scope')
          PY
          for f in /tmp/pp-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js
      - name: Commit production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name jesykadelacruz
          git config user.email 84807985+jesykadelacruz@users.noreply.github.com
          git add index.html peptide-planner-sw.js
          git commit -m "Peptide_Planner_v20260909.13"
          git push origin HEAD:main
      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/pkg/
          cd /tmp/pkg
          zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.13.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd "$GITHUB_WORKSPACE"
          unzip -t Peptide_Planner_v20260909.13.zip
          python - <<'PY'
          import zipfile
          expected={'_headers','index.html','manifest.webmanifest','peptide-planner-sw.js'}
          with zipfile.ZipFile('Peptide_Planner_v20260909.13.zip') as z:
              assert set(z.namelist())==expected, z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.13
          path: Peptide_Planner_v20260909.13.zip
