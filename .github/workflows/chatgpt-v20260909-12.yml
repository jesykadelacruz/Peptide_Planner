name: Temporary v20260909.12 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20260909-12.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited naming patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_v20260909_12_naming.py
          git checkout -- .deploy/apply_v20260909_12_naming.py
      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "index.html peptide-planner-sw.js "
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('index.html').read_text(encoding='utf-8')
          sw=Path('peptide-planner-sw.js').read_text(encoding='utf-8')
          base_h=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          base_sw=subprocess.check_output(['git','show','HEAD:peptide-planner-sw.js'],text=True)
          assert '<title>Peptide_Planner_v20260909.12</title>' in h
          assert 'const APP_VERSION="Peptide_Planner_v20260909.12";' in h
          assert "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20260909.12';" in sw
          expected_h=base_h.replace('<title>Peptide Planner v2026.0909.11</title>','<title>Peptide_Planner_v20260909.12</title>',1).replace('const APP_VERSION="v2026.0909.11";','const APP_VERSION="Peptide_Planner_v20260909.12";',1)
          expected_sw=base_sw.replace("const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.04';","const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20260909.12';",1)
          assert h==expected_h, 'index.html changed outside exact naming replacements'
          assert sw==expected_sw, 'service worker changed outside exact version replacement'
          styles=lambda text: re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>',text,re.S)
          assert styles(h)==styles(base_h), 'CSS/style changed unexpectedly'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          for i,s in enumerate(scripts): Path(f'/tmp/pp-{i}.js').write_text(s,encoding='utf-8')
          print('Validated exact v20260909.12 naming-only scope')
          PY
          for f in /tmp/pp-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js
      - name: Commit production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name jesykadelacruz
          git config user.email 84807985+jesykadelacruz@users.noreply.github.com
          git add index.html peptide-planner-sw.js
          git commit -m "Peptide_Planner_v20260909.12"
          git push origin HEAD:main
      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/pkg/
          cd /tmp/pkg
          zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.12.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd "$GITHUB_WORKSPACE"
          unzip -t Peptide_Planner_v20260909.12.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.12.zip') as z:
              assert sorted(z.namelist())==sorted(expected),z.namelist()
          PY
          sha256sum Peptide_Planner_v20260909.12.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.12
          path: Peptide_Planner_v20260909.12.zip
          if-no-files-found: error
