name: Peptide Planner v20261009.04 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20261009-04.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact linked dose patch
        run: python .deploy/apply_v20261009_04_linked_dose.py
      - name: Validate requested scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          BASE=98af1514ff460cdff036b378b95d94ce44302cd2
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          old=subprocess.check_output(['git','show','98af1514ff460cdff036b378b95d94ce44302cd2:index.html'],text=True)
          new=Path('index.html').read_text()
          assert '<title>Peptide_Planner_v20261009.04</title>' in new
          assert 'const APP_VERSION="Peptide_Planner_v20261009.04";' in new
          assert Path('peptide-planner-sw.js').read_text().startswith("const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.04';")
          styles=lambda s: re.findall(r'<style[^>]*>(.*?)</style>',s,re.S)
          assert styles(old)==styles(new), 'CSS changed unexpectedly'
          def fn(src,name):
              m=re.search(r'function '+re.escape(name)+r'\([^\)]*\)\{',src); assert m,name
              i=m.start(); k=m.end(); depth=1
              while k<len(src) and depth:
                  if src[k]=='{': depth+=1
                  elif src[k]=='}': depth-=1
                  k+=1
              return src[i:k]
          for name in ['renderContinuousDoseSchedule','continuousVialScheduleComputation','cycleFullDoseCountForDisplay','cycleVialScheduleComputation','cycleVialPrepForDate']:
              assert fn(old,name)==fn(new,name), f'{name} changed unexpectedly'
          assert 'function syncCycleDoseScheduleLinkedEdit' in new
          assert 'source==="dose"' in new and 'source==="units"' in new and 'source==="split"' in new
          assert 'addEventListener("input"' in new
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',new,re.S)
          assert scripts
          for i,js in enumerate(scripts):
              p=Path(f'/tmp/pp-script-{i}.js'); p.write_text(js); subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--check','peptide-planner-sw.js'],check=True)
          PY
          git diff --check
      - name: Test linked Dose Units Split Units behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text()
          names=['simplePhaseSplitParts','distributeSplitUnits','syncPhaseFromDose','syncPhaseFromUnits','syncPhaseFromSplitUnits','syncCycleDoseScheduleLinkedEdit']
          def extract(name):
              m=re.search(r'function '+re.escape(name)+r'\([^\)]*\)\{',src); assert m,name
              i=m.start(); k=m.end(); depth=1
              while k<len(src) and depth:
                  if src[k]=='{': depth+=1
                  elif src[k]=='}': depth-=1
                  k+=1
              return src[i:k]
          code="""
          function num(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null;}
          function round(v,d=2){const p=10**d;return Math.round((v+Number.EPSILON)*p)/p;}
          function enteredPlanNumber(v){return num(v);}
          function cyclePhaseReferenceDate(){return null;}
          function phaseUnitsFromDose(plan,dose){const d=num(dose);if(d==null)return null;return round(d/plan.vialMg*plan.waterMl*plan.unitsPerMl,2);}
          function phaseDoseFromUnits(plan,units){const u=num(units);if(u==null)return null;return round(u*plan.vialMg/(plan.waterMl*plan.unitsPerMl),6);}
          function syncLegacyPlanFromCycleConfigs(){}
          """+'\n'.join(extract(n) for n in names)+"""
          const plan={vialMg:10,waterMl:2,unitsPerMl:100},config={},phase={doseMg:1,units:20,splitDose:true,splitParts:2,splitUnits:[10,10]};
          const dose={value:'1'},units={value:'20'},split1={value:'10'},split2={value:'10'};
          const row={querySelector(sel){if(sel.includes('doseMg'))return dose;if(sel.includes('phase-units'))return units;return null;},querySelectorAll(sel){return sel.includes('phase-split-unit')?[split1,split2]:[];}};
          dose.value='2';syncCycleDoseScheduleLinkedEdit(plan,config,phase,1,row,'dose',dose);
          if(phase.units!==40||phase.doseMg!=='2'||phase.splitUnits[0]!==20||phase.splitUnits[1]!==20)throw new Error('Dose -> Units/Split Units failed '+JSON.stringify(phase));
          units.value='30';syncCycleDoseScheduleLinkedEdit(plan,config,phase,1,row,'units',units);
          if(phase.units!==30||phase.doseMg!==1.5||phase.splitUnits[0]!==15||phase.splitUnits[1]!==15)throw new Error('Units -> Dose/Split Units failed '+JSON.stringify(phase));
          split1.value='10';split2.value='15';syncCycleDoseScheduleLinkedEdit(plan,config,phase,1,row,'split',split1);
          if(phase.units!==25||phase.doseMg!==1.25)throw new Error('Split Units -> Dose/Units failed '+JSON.stringify(phase));
          console.log('linked triad tests passed');
          """
          Path('/tmp/linked-dose-test.js').write_text(code)
          PY
          node /tmp/linked-dose-test.js
      - name: Remove temporary release files and validate final tree
        run: |
          set -euo pipefail
          git rm .deploy/apply_v20261009_04_linked_dose.py .github/workflows/chatgpt-v20261009-04.yml
          changed="$(git diff --name-only 98af1514ff460cdff036b378b95d94ce44302cd2 -- | sort)"
          expected=$'index.html\npeptide-planner-sw.js'
          test "$changed" = "$expected"
          git diff --check
      - name: Commit production release
        run: |
          git config user.name 'jesykadelacruz'
          git config user.email '84807985+jesykadelacruz@users.noreply.github.com'
          git add index.html peptide-planner-sw.js
          git commit -m 'Peptide_Planner_v20261009.04'
          git push origin HEAD:main
      - name: Build Cloudflare production ZIP
        run: |
          mkdir -p release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          cd release
          zip -9 ../Peptide_Planner_v20261009.04.zip _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd ..
          unzip -t Peptide_Planner_v20261009.04.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('Peptide_Planner_v20261009.04.zip')
          assert sorted(z.namelist())==sorted(['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']),z.namelist()
          print('Cloudflare ZIP root validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.04
          path: Peptide_Planner_v20261009.04.zip
          if-no-files-found: error