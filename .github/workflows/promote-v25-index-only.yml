name: Promote Peptide Planner v25 index only

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v25_repo_promote_trigger.txt'

permissions:
  contents: write

concurrency:
  group: peptide-planner-v25-index-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact validated v25 without deploying Cloudflare
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/deploy-cloudflare-pages.yml').read_text().splitlines()
          start = next(i for i,line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(source[start:end])) + '\n'
          Path('/tmp/reconstruct_v25.py').write_text(script)
          PY
          python /tmp/reconstruct_v25.py
          test -f dist/index.html
          test "$(sha256sum dist/index.html | awk '{print $1}')" = "0d15503cb5193e1fc96f6e58e4be880c84540cb99117e4ed62d97a6a8d4c3e17"

      - name: Promote direct v25 index to main
        run: |
          set -euo pipefail
          cp dist/index.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html already matches exact v25.'
            exit 0
          fi
          git commit -m 'Promote Peptide Planner v25 direct production index'
          git push origin HEAD:main
