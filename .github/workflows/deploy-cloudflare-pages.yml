name: Deploy Peptide Planner to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .deploy/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Peptide Planner v189
        run: |
          rm -rf dist
          mkdir -p dist
          cp Peptide_Planner_KB_Mobile_v184.html dist/index.html
          cat .deploy/v189_patch_part_*.b64 > .deploy/v189_patch.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v189_patch.b64').read_text()
          Path('/tmp/v189.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          patch --silent dist/index.html < /tmp/v189.patch

      - name: Verify v189 and cloud account features
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('dist/index.html')
          data = path.read_bytes()
          html = data.decode('utf-8')
          expected_sha256 = '54dd1bbdbf44d401b024e593e0ae3f01e1f71983d480c983b5950bc6546ee4eb'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'v189 build checksum mismatch: {actual_sha256}')

          required = [
              '<title>Peptide Treatment Planner Mobile v189</title>',
              'APP_VERSION="v189"',
              'id="cloudAccountBar"',
              'id="cloudSignIn"',
              'id="cloudSignUp"',
              'id="cloudSyncNow"',
              'id="cloudSignOut"',
              'signInWithPassword',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
              'setTimeout(()=>showCloudAuth("signin"),180)',
              'initCloudServices();',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Built planner is missing required features: ' + ', '.join(missing))
          print(f'Validated Peptide Planner v189: {len(data):,} bytes')
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
