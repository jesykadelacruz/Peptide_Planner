name: Deploy Peptide Planner v27 to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v27_release_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate direct v27 production index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          expected = 'b033cec77b8437b5f570f17dbb5536c0913a326dc50f64d7323faf936c3c6cd5'
          html = Path('index.html').read_text()
          actual = hashlib.sha256(html.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'v27 checksum mismatch: {actual}')

          required = [
              '<title>Peptide Planner v27</title>',
              'const APP_VERSION="v27";',
              'id="production-css"',
              'signInWithPassword',
              'planner-signup-public',
              'planner-signup-admin-proof',
              'resetPasswordForEmail',
              'PASSWORD_RECOVERY',
              'updateUser({password})',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
              'planVerificationCompleteness',
              'planReadyForToday',
              'doseSourceIndicatorHtml',
              'doseEntryMode',
              'splitUnits',
              'syncPhaseFromSplitUnits',
              '<th>Payment proof</th>',
              'data-signup-proof-upload',
              'cloudAccess?.role!=="owner"',
              'owner&&hasProof?',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('v27 feature validation failed: ' + ', '.join(missing))

          if len(re.findall(r'<style\b', html, flags=re.I)) != 1:
              raise SystemExit('v27 CSS consolidation validation failed')
          if len(re.findall(r'</style>', html, flags=re.I)) != 1:
              raise SystemExit('v27 CSS closing-tag validation failed')
          if re.search(r'service_role|SUPABASE_SECRET_KEY', html, flags=re.I):
              raise SystemExit('Secret key marker found in client')

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          Path('/tmp/v27-inline.js').write_text('\n'.join(script for script in scripts if script.strip()))
          Path('dist').mkdir(exist_ok=True)
          Path('dist/index.html').write_text(html)
          Path('dist/_headers').write_text('/*\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n  Pragma: no-cache\n  Expires: 0\n')
          print('Official v27 checksum verified:', expected)
          PY
          node --check /tmp/v27-inline.js

      - name: Deploy v27 direct file to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
