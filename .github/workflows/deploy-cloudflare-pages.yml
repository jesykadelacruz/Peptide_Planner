name: Deploy Peptide Planner to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .deploy/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Peptide Planner v186
        run: |
          cat .deploy/v186_loader_part*.txt > .deploy/v186_loader.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v186_loader.b64').read_text()
          Path('.deploy/deploy_v186.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python .deploy/deploy_v186.py

      - name: Apply latest uploaded HTML and account prompt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('dist/index.html')
          html = path.read_text(encoding='utf-8')

          latest_update = '''<style id="v186-today-two-line-peptide-name">
          /* v186 — Today peptide/treatment names: maximum two lines */
          .today-injection-main strong{
            display:-webkit-box;
            -webkit-box-orient:vertical;
            -webkit-line-clamp:2;
            overflow:hidden;
            text-overflow:ellipsis;
            line-height:1.28;
            max-height:2.56em;
            overflow-wrap:anywhere;
            word-break:normal;
          }
          </style>
          '''
          latest_update = '\n'.join(line[10:] if line.startswith('          ') else line for line in latest_update.splitlines()) + '\n'

          if 'id="v186-today-two-line-peptide-name"' not in html:
              marker = '<style id="v186-cloud-sync">'
              if marker not in html:
                  raise SystemExit('Cloud-sync layer was not present in the built planner.')
              html = html.replace(marker, latest_update + marker, 1)

          old_session = 'try{const {data}=await cloudClient.auth.getSession();cloudUser=data?.session?.user||null;renderCloudAccount();if(cloudUser)await reconcileCloudState({silent:true})}catch(error){console.warn("Session restore failed",error)}'
          new_session = 'try{const {data}=await cloudClient.auth.getSession();cloudUser=data?.session?.user||null;renderCloudAccount();if(cloudUser){await reconcileCloudState({silent:true})}else{setTimeout(()=>showCloudAuth("signin"),180)}}catch(error){console.warn("Session restore failed",error);setTimeout(()=>showCloudAuth("signin"),180)}'
          if old_session in html:
              html = html.replace(old_session, new_session, 1)

          old_signed_out = 'if(event==="SIGNED_OUT"){cloudUser=null;renderCloudAccount();return}'
          new_signed_out = 'if(event==="SIGNED_OUT"){cloudUser=null;renderCloudAccount();showCloudAuth("signin");return}'
          if old_signed_out in html:
              html = html.replace(old_signed_out, new_signed_out, 1)

          html = html.replace('switchBtn.textContent=signup?"Sign in instead":"Create account instead"','switchBtn.textContent=signup?"Sign in":"Create account"',1)

          required = [
              'id="cloudAccountBar"',
              'id="cloudSignIn"',
              'id="cloudSignUp"',
              'id="cloudSyncNow"',
              'id="cloudSignOut"',
              'signInWithPassword',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
              'initCloudServices();',
              'setTimeout(()=>showCloudAuth("signin"),180)',
              'id="v186-today-two-line-peptide-name"',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Built planner is missing required live features: ' + ', '.join(missing))

          path.write_text(html, encoding='utf-8')
          print(f'Validated live planner: {len(html):,} characters')
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
