name: Deploy Peptide Planner to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .deploy/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify Peptide Planner v6
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp Peptide_Planner_KB_Mobile_v184.html dist/index.html

          cat .deploy/v189_patch_part_*.b64 > /tmp/v189.b64
          cat .deploy/v195_delta_part_*.b64 > /tmp/v195.b64

          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payloads = {
              '/tmp/v189.patch': Path('/tmp/v189.b64').read_text(),
              '/tmp/v190.patch': Path('.deploy/v190_delta_from_v189live.b64').read_text(),
              '/tmp/v191.patch': Path('.deploy/v191_delta_from_v190live.b64').read_text(),
              '/tmp/v193.patch': Path('.deploy/v193_delta_from_v191live.b64').read_text(),
              '/tmp/v194.patch': Path('.deploy/v194_delta_from_v193live.b64').read_text(),
              '/tmp/v195.patch': Path('/tmp/v195.b64').read_text(),
              '/tmp/v1.patch': Path('.deploy/v1_delta_from_v195live.b64').read_text(),
              '/tmp/v2.patch': Path('.deploy/v2_delta_from_v1live.b64').read_text(),
              '/tmp/v3.patch': Path('.deploy/v3_delta_from_v2live.b64').read_text(),
              '/tmp/v4.patch': Path('.deploy/v4_delta_from_v3live.b64').read_text(),
              '/tmp/v5.patch': Path('.deploy/v5_delta_from_v4live.b64').read_text(),
              '/tmp/v6.patch': Path('.deploy/v6_delta_from_v5live.b64').read_text(),
          }
          for target, payload in payloads.items():
              Path(target).write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2

          patch --silent dist/index.html < /tmp/v189.patch
          patch --silent dist/index.html < /tmp/v190.patch
          patch --silent dist/index.html < /tmp/v191.patch
          patch --silent dist/index.html < /tmp/v193.patch
          patch --silent dist/index.html < /tmp/v194.patch
          patch --silent dist/index.html < /tmp/v195.patch
          patch --silent dist/index.html < /tmp/v1.patch
          patch --silent dist/index.html < /tmp/v2.patch
          patch --silent dist/index.html < /tmp/v3.patch
          patch --silent dist/index.html < /tmp/v4.patch
          patch --silent dist/index.html < /tmp/v5.patch
          patch --silent dist/index.html < /tmp/v6.patch

          python - <<'PY2'
          from pathlib import Path
          import hashlib, re
          path = Path('dist/index.html')
          data = path.read_bytes()
          html = data.decode('utf-8')
          expected_sha256 = '0e9df12f0458e302be5aa5b55dc78709fd8149e1f1be11265e5601324f4f3e64'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'v6 build checksum mismatch: {actual_sha256}')
          required = [
              '<title>Peptide Treatment Planner Mobile v6</title>',
              'APP_VERSION="v6"',
              'id="v192-vials-buy-two-line-lock"',
              'id="v193-phase-layout-fix"',
              'id="v194-mobile-myplan-multi-column"',
              'id="v195-myplan-phase-compact-layout"',
              'id="v196-past-purchases-one-line"',
              'id="v197-today-done-vertical-center"',
              'id="v198-compact-add-treatment-collapsed"',
              'id="v199-add-treatment-row-alignment"',
              'id="v200-myplan-kb-benefits"',
              'id="v202-kb-record-alignment-only"',
              'id="v202-requested-fixes"',
              'id="v204-myplan-layout-only"',
              'id="v206-requested-only"',
              'id="v210-myplan-two-fixes-only"',
              'id="v211-myplan-uniform-field-height-only"',
              'id="quickTargetDisplay"',
              'Personal record',
              'Personal profile',
              'id="profileDob"',
              'measurementDateTimeLabel',
              'id="cloudAccountBar"',
              'id="cloudSignIn"',
              'id="cloudSignUp"',
              'id="cloudForgotPassword"',
              'id="cloudAuthConfirmPassword"',
              'resetPasswordForEmail',
              'PASSWORD_RECOVERY',
              'updateUser({password})',
              'signInWithPassword',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
              'initCloudServices();',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Built planner is missing required features: ' + ', '.join(missing))
          if 'data-simple-field="notes"' in html:
              raise SystemExit('v6 still contains the removed My Plan Notes field')
          inline_scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          if not inline_scripts:
              raise SystemExit('No inline application JavaScript found')
          for i, script in enumerate(inline_scripts):
              Path(f'/tmp/v6-inline-{i}.js').write_text(script)
          print(f'Validated Peptide Planner v6: {len(data):,} bytes; {len(inline_scripts)} inline script(s)')
          PY2
          for js in /tmp/v6-inline-*.js; do node --check "$js"; done

      - name: Confirm this is still the newest main commit
        id: freshness
        run: |
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          echo "workflow_commit=$GITHUB_SHA"
          echo "current_main=$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment so an older build cannot replace production."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
