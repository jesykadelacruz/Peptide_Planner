name: Deploy Peptide Planner v19 to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v19_release_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate official v19
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          EXPECTED_V9 = 'bcebcd78b5a63a518e5114cea56e787800ab0d71fbd4b835b2e9b3ee5ee389d3'
          EXPECTED_V15 = '59543b450c89db382c2be4da8a31df98528b9893d8bfb6f38c8077e9bce8a536'
          EXPECTED_V18 = '50e2fd4c3902b935144adb58fad943cdb6fd886c28e4a56a42f414ed835987cb'
          EXPECTED_V19 = 'f544d8a6a345be415cc33ea7ddb922b9e40efac0d2865866fa90791d05a71eb6'

          def split_lines(text):
              return text.splitlines(keepends=True)

          def apply_patch(source, patch):
              src = split_lines(source)
              pl = split_lines(patch)
              out = []
              si = 0
              i = 0
              while i < len(pl) and not pl[i].startswith('@@ '):
                  i += 1
              while i < len(pl):
                  header = pl[i].rstrip('\n')
                  m = re.match(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', header)
                  if not m:
                      raise RuntimeError('Invalid deployment patch header: ' + header)
                  old_start = int(m.group(1))
                  old_count = 1 if m.group(2) is None else int(m.group(2))
                  target = old_start if old_count == 0 else old_start - 1
                  if target < si:
                      raise RuntimeError('Overlapping deployment patch')
                  while si < target:
                      out.append(src[si]); si += 1
                  i += 1
                  consumed = 0
                  while i < len(pl) and not pl[i].startswith('@@ '):
                      line = pl[i]
                      mark = line[:1]
                      body = line[1:]
                      if mark == ' ':
                          if si >= len(src) or src[si] != body:
                              raise RuntimeError('Deployment context mismatch')
                          out.append(src[si]); si += 1; consumed += 1
                      elif mark == '-':
                          if si >= len(src) or src[si] != body:
                              raise RuntimeError('Deployment source mismatch')
                          si += 1; consumed += 1
                      elif mark == '+':
                          out.append(body)
                      elif mark == '\\':
                          pass
                      elif line.strip() != '':
                          raise RuntimeError('Invalid deployment patch line')
                      i += 1
                  if consumed != old_count:
                      raise RuntimeError(f'Deployment patch count mismatch: {consumed} != {old_count}')
              out.extend(src[si:])
              return ''.join(out)

          def inflate(paths):
              payload = ''.join(Path(p).read_text().strip() for p in paths)
              return zlib.decompress(base64.b64decode(payload)).decode('utf-8')

          base = Path('Peptide_Planner_KB_Mobile_v184.html').read_text()
          chain = [
              [f'.deploy/v189_patch_part_{n:02d}.b64' for n in range(1,5)],
              ['.deploy/v190_delta_from_v189live.b64'],
              ['.deploy/v191_delta_from_v190live.b64'],
              ['.deploy/v193_delta_from_v191live.b64'],
              ['.deploy/v194_delta_from_v193live.b64'],
              [f'.deploy/v195_delta_part_{n:02d}.b64' for n in range(1,5)],
              ['.deploy/v1_delta_from_v195live.b64'],
              ['.deploy/v2_delta_from_v1live.b64'],
              ['.deploy/v3_delta_from_v2live.b64'],
              ['.deploy/v4_delta_from_v3live.b64'],
              ['.deploy/v5_delta_from_v4live.b64'],
              ['.deploy/v6_delta_from_v5live.b64'],
              ['.deploy/v7_delta_from_v6live.b64'],
              ['.deploy/v8_delta_from_v7live.b64'],
              [f'.deploy/v9_delta_part_{n:02d}.b64' for n in range(1,5)],
          ]
          current = base
          for paths in chain:
              for p in paths:
                  if not Path(p).is_file():
                      raise SystemExit('Missing deployment asset: ' + p)
              current = apply_patch(current, inflate(paths))

          actual_v9 = hashlib.sha256(current.encode()).hexdigest()
          if actual_v9 != EXPECTED_V9:
              raise SystemExit(f'v9 checksum mismatch: {actual_v9}')

          v15_paths = [
              '.deploy/v15_patch_part_01.b64',
              '.deploy/v15_patch_part_02.b64',
              '.deploy/v15_patch_part_03a.b64',
              '.deploy/v15_patch_part_03b.b64',
              '.deploy/v15_patch_part_04.b64',
              '.deploy/v15_patch_part_05.b64',
              '.deploy/v15_patch_part_06.b64',
          ]
          for p in v15_paths:
              if not Path(p).is_file():
                  raise SystemExit('Missing v15 deployment asset: ' + p)
          v15 = apply_patch(current, inflate(v15_paths))
          actual_v15 = hashlib.sha256(v15.encode()).hexdigest()
          if actual_v15 != EXPECTED_V15:
              raise SystemExit(f'v15 checksum mismatch: {actual_v15}')

          v18_path = '.deploy/v18_delta_from_v15.b64'
          if not Path(v18_path).is_file():
              raise SystemExit('Missing v18 deployment asset: ' + v18_path)
          v18 = apply_patch(v15, inflate([v18_path]))
          actual_v18 = hashlib.sha256(v18.encode()).hexdigest()
          if actual_v18 != EXPECTED_V18:
              raise SystemExit(f'v18 checksum mismatch: {actual_v18}')

          v19_path = '.deploy/v19_delta_from_v18.b64'
          if not Path(v19_path).is_file():
              raise SystemExit('Missing v19 deployment asset: ' + v19_path)
          v19 = apply_patch(v18, inflate([v19_path]))
          actual_v19 = hashlib.sha256(v19.encode()).hexdigest()
          if actual_v19 != EXPECTED_V19:
              raise SystemExit(f'v19 checksum mismatch: {actual_v19}')

          required = [
              '<title>Peptide Planner v19</title>',
              'const APP_VERSION="v19";',
              'id="v18-treatment-mobile-layout-fix"',
              'grid-template-columns:repeat(2,minmax(0,1fr))!important;',
              'data-cycle-config-field="injectionTime"',
              'data-cycle-phase-field="startWeek"',
              'data-cycle-phase-field="endWeek"',
              'data-cycle-phase-field="intervalDays"',
              'data-cycle-phase-field="doseMg"',
              '.split-dose-times input[type="time"]',
              'id="v14-signup-payment-account-request"',
              'id="v17-admin-dashboard"',
              'id="v20-compact-users-autosave"',
              'id="plannerAccessGate"',
              'planner-access-admin',
              'planner_access_members',
              'signInWithPassword',
              'resetPasswordForEmail',
              'PASSWORD_RECOVERY',
              'updateUser({password})',
              'initCloudServices();',
              'https://srfuwxjwulvbalzoymcc.supabase.co',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
          ]
          missing = [item for item in required if item not in v19]
          if missing:
              raise SystemExit('v19 feature validation failed: ' + ', '.join(missing))
          if 'Enable schedule' in v19:
              raise SystemExit('v19 unexpectedly contains Enable schedule')

          Path('dist').mkdir(exist_ok=True)
          Path('dist/index.html').write_text(v19)
          print('Official v19 reconstructed and checksum verified:', actual_v19)
          PY

      - name: Validate JavaScript and responsive contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          inline = '\n'.join(s for s in scripts if s.strip() and 'application/ld+json' not in s[:100])
          Path('/tmp/v19-inline.js').write_text(inline)
          responsive = [
              'name="viewport"',
              '@media(max-width:760px)',
              '@media(max-width:640px)',
              'v26-mobile-cycle-layout-fix',
              'v15-mobile-dose-field-layout-fix',
              'v18-treatment-mobile-layout-fix',
              'grid-template-columns:repeat(2,minmax(0,1fr))',
              'requested-dose-table.mobile-card-table',
              '.split-dose-times input[type="time"]',
          ]
          missing = [x for x in responsive if x not in html]
          if missing:
              raise SystemExit('Responsive validation failed: ' + ', '.join(missing))
          print('Desktop/mobile responsive contracts verified')
          PY
          node --check /tmp/v19-inline.js

      - name: Test desktop and mobile cycle layout
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on this runner.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text()
          styles = '\n'.join(re.findall(r'<style[^>]*>.*?</style>', html, flags=re.I|re.S))
          weekdays = ''.join(f'<label class="weekday-check"><span>{d}</span><input type="checkbox"></label>' for d in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'])
          fixture = f'''<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">{styles}</head><body>
          <div id="planner">
            <details class="simple-plan-card" open>
              <summary class="simple-plan-toggle"><div class="simple-plan-toggle-head"><div class="simple-plan-toggle-main"><div class="protocol-title">GHK-Cu</div></div><div class="simple-plan-toggle-status"><span class="status-pill active">Actively using</span></div></div></summary>
              <div class="simple-plan-body"><details class="cycle-config-card" open><div class="cycle-config-body">
                <div class="cycle-config-grid">
                  <div><label>Start date</label><input type="date" data-cycle-config-field="startDate" value="2026-07-30"></div>
                  <div><label>Time</label><input type="time" data-cycle-config-field="injectionTime" value="22:00"></div>
                  <div><label>Active</label><input type="number" data-cycle-config-field="activeWeeks" value="12"></div>
                  <div><label>Break</label><input type="number" data-cycle-config-field="breakWeeks" value="4"></div>
                  <div><label>Schedule</label><select data-cycle-config-field="scheduleMode"><option>Choose weekdays</option></select></div>
                  <div><label>Interval</label><input type="number" data-cycle-config-field="intervalDays" value="7"></div>
                  <div class="span-2 cycle-weekday-field"><label>Weekdays</label><div class="weekdays">{weekdays}</div></div>
                </div>
                <div class="cycle-dose-block"><h4>Dose schedule</h4><div class="table-wrap"><table class="phase-table requested-dose-table mobile-card-table"><tbody><tr>
                  <td data-mobile-label="Start week"><input type="number" value="1"></td>
                  <td data-mobile-label="End week"><input type="number" value="2"></td>
                  <td data-mobile-label="Days"><input type="number"></td>
                  <td data-mobile-label="Dose (mg)"><input type="number" value="1.5"></td>
                  <td data-mobile-label="Units"><input type="text" value="4.5 units"></td>
                  <td data-mobile-label="Weekdays"><div class="phase-weekdays">{weekdays}</div></td>
                  <td data-mobile-label="Split dose"><div class="split-dose-control"><label><input type="checkbox" checked>Split</label><span class="split-dose-parts">into <input type="number" value="2"> parts</span><div class="split-dose-times"><label>1 <input type="time" value="08:00"></label><label>2 <input type="time" value="20:00"></label></div></div></td>
                  <td data-mobile-label="Action"><button class="btn small danger">Remove</button></td>
                </tr></tbody></table></div></div>
              </div></details></div>
            </details>
          </div>
          <div id="test-result"></div>
          <script>
          (()=>{{if(innerWidth<=760)document.body.classList.add('mobile-app');const b=e=>e.getBoundingClientRect(),q=s=>document.querySelector(s),kids=[...document.querySelector('.cycle-config-grid').children].map(b),controls=[...document.querySelectorAll('.cycle-config-grid input:not([type=checkbox]),.cycle-config-grid select')].map(b),cells=[...document.querySelectorAll('.requested-dose-table tbody tr>td')].slice(0,5).map(b),split=[...document.querySelectorAll('.split-dose-times input[type=time]')].map(b),sp=b(q('.split-dose-times')),status=b(q('.simple-plan-toggle-status')),title=b(q('.simple-plan-toggle-main'));let ok=document.documentElement.scrollWidth<=innerWidth;if(innerWidth<=760){{const same=(a,b)=>Math.abs(a-b)<1;ok=ok&&same(kids[0].y,kids[1].y)&&same(kids[2].y,kids[3].y)&&same(kids[4].y,kids[5].y)&&kids[2].y>kids[0].y&&kids[4].y>kids[2].y&&kids[6].y>kids[4].y;ok=ok&&new Set(controls.map(x=>Math.round(x.height))).size===1&&Math.round(controls[0].height)===46;ok=ok&&same(cells[0].y,cells[1].y)&&same(cells[1].y,cells[2].y)&&same(cells[3].y,cells[4].y)&&cells[3].y>cells[0].y;ok=ok&&split.length===2&&same(split[0].height,split[1].height)&&split[0].right<=split[1].left+1&&split.every(x=>x.x>=sp.x-.5&&x.right<=sp.right+.5);ok=ok&&status.left>=title.right-1;}}document.getElementById('test-result').setAttribute('data-test-result',ok?'pass':'fail');}})();
          </script></body></html>'''
          Path('/tmp/v19-layout-fixture.html').write_text(fixture)
          PY
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --dump-dom file:///tmp/v19-layout-fixture.html > /tmp/v19-desktop-dom.html
          grep -q 'data-test-result="pass"' /tmp/v19-desktop-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --dump-dom file:///tmp/v19-layout-fixture.html > /tmp/v19-mobile-dom.html
          grep -q 'data-test-result="pass"' /tmp/v19-mobile-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --screenshot=/tmp/v19-desktop.png file:///tmp/v19-layout-fixture.html >/dev/null 2>&1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --screenshot=/tmp/v19-mobile.png file:///tmp/v19-layout-fixture.html >/dev/null 2>&1
          test -s /tmp/v19-desktop.png
          test -s /tmp/v19-mobile.png
          echo 'Desktop 1440x1000 layout passed.'
          echo 'Mobile 390x844 layout passed.'

      - name: Build Cloudflare production ZIP
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          src = Path('dist/index.html')
          manifest = {
              'release': 'Peptide Planner Mobile v19',
              'production_entry': 'index.html',
              'sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'target': 'https://peptide-planner.pages.dev/'
          }
          Path('RELEASE_MANIFEST_v19.json').write_text(json.dumps(manifest, indent=2))
          out = Path('Peptide Planner Mobile v19 Cloudflare.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              z.write(src, 'index.html')
              z.write('RELEASE_MANIFEST_v19.json', 'RELEASE_MANIFEST_v19.json')
          with zipfile.ZipFile(out) as z:
              data = z.read('index.html')
          actual = hashlib.sha256(data).hexdigest()
          expected = 'f544d8a6a345be415cc33ea7ddb922b9e40efac0d2865866fa90791d05a71eb6'
          if actual != expected:
              raise SystemExit('Cloudflare ZIP checksum mismatch: ' + actual)
          print('Cloudflare ZIP verified:', out)
          PY

      - name: Upload production ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peptide Planner Mobile v19
          path: Peptide Planner Mobile v19 Cloudflare.zip
          if-no-files-found: error
          retention-days: 30

      - name: Confirm this is still the newest main commit
        id: freshness
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          echo "workflow_commit=$GITHUB_SHA"
          echo "current_main=$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo 'Skipping stale deployment so an older build cannot replace production.'
          fi

      - name: Deploy v19 to Cloudflare Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
