name: Deploy Peptide Planner to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .deploy/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Peptide Planner v189 base
        run: |
          rm -rf dist
          mkdir -p dist
          cp Peptide_Planner_KB_Mobile_v184.html dist/index.html
          cat .deploy/v189_patch_part_*.b64 > .deploy/v189_patch.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v189_patch.b64').read_text()
          Path('/tmp/v189.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          patch --silent dist/index.html < /tmp/v189.patch

      - name: Apply v190 update
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v190_delta_from_v189live.b64').read_text()
          Path('/tmp/v190.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          patch --silent dist/index.html < /tmp/v190.patch

      - name: Verify v190 base checksum
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('dist/index.html').read_bytes()
          expected = '993f0df765bd62385a14150b5c3fb02207fdb7235aafb49438d14994ce621847'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'v190 base checksum mismatch: {actual}')
          PY

      - name: Apply uploaded v191 update
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v191_delta_from_v190live.b64').read_text()
          Path('/tmp/v191.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          patch --silent dist/index.html < /tmp/v191.patch

      - name: Verify v191 and account sync features
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('dist/index.html')
          data = path.read_bytes()
          html = data.decode('utf-8')
          expected_sha256 = '88980cc6a2307c45289a005646f0acac118306f82d7beaf5e6fa1ea21eb06cb9'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'v191 build checksum mismatch: {actual_sha256}')

          required = [
              '<title>Peptide Treatment Planner Mobile v191</title>',
              'APP_VERSION="v191"',
              'id="v191-final-mobile-today-vials-lock"',
              'id="cloudAccountBar"',
              'id="cloudSignIn"',
              'id="cloudSignUp"',
              'id="cloudSyncNow"',
              'id="cloudSignOut"',
              'id="cloudAuthOverlay"',
              'signInWithPassword',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
              'setTimeout(()=>showCloudAuth("signin"),180)',
              'initCloudServices();',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Built planner is missing required features: ' + ', '.join(missing))

          inline_scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          if not inline_scripts:
              raise SystemExit('No inline application JavaScript found')
          for i, script in enumerate(inline_scripts):
              Path(f'/tmp/v191-inline-{i}.js').write_text(script)
          print(f'Validated Peptide Planner v191: {len(data):,} bytes; {len(inline_scripts)} inline script(s)')
          PY
          for js in /tmp/v191-inline-*.js; do node --check "$js"; done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
