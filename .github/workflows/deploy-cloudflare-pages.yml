name: Deploy Peptide Planner to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .deploy/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Peptide Planner v189 base
        run: |
          rm -rf dist
          mkdir -p dist
          cp Peptide_Planner_KB_Mobile_v184.html dist/index.html
          cat .deploy/v189_patch_part_*.b64 > .deploy/v189_patch.b64
          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v189_patch.b64').read_text()
          Path('/tmp/v189.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2
          patch --silent dist/index.html < /tmp/v189.patch

      - name: Apply v190 update
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v190_delta_from_v189live.b64').read_text()
          Path('/tmp/v190.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2
          patch --silent dist/index.html < /tmp/v190.patch

      - name: Apply v191 update
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v191_delta_from_v190live.b64').read_text()
          Path('/tmp/v191.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2
          patch --silent dist/index.html < /tmp/v191.patch

      - name: Verify v191 base checksum
        run: |
          python - <<'PY2'
          from pathlib import Path
          import hashlib
          data = Path('dist/index.html').read_bytes()
          expected = '88980cc6a2307c45289a005646f0acac118306f82d7beaf5e6fa1ea21eb06cb9'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'v191 base checksum mismatch: {actual}')
          PY2

      - name: Apply v193 update
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v193_delta_from_v191live.b64').read_text()
          Path('/tmp/v193.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2
          patch --silent dist/index.html < /tmp/v193.patch

      - name: Apply v194 update
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payload = Path('.deploy/v194_delta_from_v193live.b64').read_text()
          Path('/tmp/v194.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2
          patch --silent dist/index.html < /tmp/v194.patch

      - name: Verify v194 base checksum
        run: |
          python - <<'PY2'
          from pathlib import Path
          import hashlib
          data = Path('dist/index.html').read_bytes()
          expected = 'af881149378d47b93196523675ead461d4922318e968ca2dbec7fd369aea4a50'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'v194 base checksum mismatch: {actual}')
          PY2

      - name: Apply v195 update
        run: |
          cat .deploy/v195_delta_part_*.b64 > /tmp/v195_delta.b64
          python - <<'PY2'
          from pathlib import Path
          import base64, zlib
          payload = Path('/tmp/v195_delta.b64').read_text()
          Path('/tmp/v195.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY2
          patch --silent dist/index.html < /tmp/v195.patch

      - name: Verify v195 password recovery and account sync
        run: |
          python - <<'PY2'
          from pathlib import Path
          import hashlib, re
          path = Path('dist/index.html')
          data = path.read_bytes()
          html = data.decode('utf-8')
          expected_sha256 = '81b632f670247bf2091d8e51572904d57b93cf961b6b8bfe419ae9519f4d85e8'
          actual_sha256 = hashlib.sha256(data).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'v195 build checksum mismatch: {actual_sha256}')
          required = [
              '<title>Peptide Treatment Planner Mobile v195</title>',
              'APP_VERSION="v195"',
              'id="v195-myplan-phase-compact-layout"',
              'id="cloudAccountBar"',
              'id="cloudSignIn"',
              'id="cloudSignUp"',
              'id="cloudForgotPassword"',
              'id="cloudAuthConfirmPassword"',
              'resetPasswordForEmail',
              'PASSWORD_RECOVERY',
              'updateUser({password})',
              'signInWithPassword',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
              'initCloudServices();',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Built planner is missing required features: ' + ', '.join(missing))
          inline_scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          if not inline_scripts:
              raise SystemExit('No inline application JavaScript found')
          for i, script in enumerate(inline_scripts):
              Path(f'/tmp/v195-inline-{i}.js').write_text(script)
          print(f'Validated Peptide Planner v195: {len(data):,} bytes; {len(inline_scripts)} inline script(s)')
          PY2
          for js in /tmp/v195-inline-*.js; do node --check "$js"; done

      - name: Confirm this is still the newest main commit
        id: freshness
        run: |
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          echo "workflow_commit=$GITHUB_SHA"
          echo "current_main=$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment so an older build cannot replace production."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
