name: Deploy Peptide Planner to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .deploy/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Peptide Planner v186
        run: |
          cat .deploy/v186_loader_part*.txt > .deploy/v186_loader.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path(".deploy/v186_loader.b64").read_text()
          Path(".deploy/deploy_v186.py").write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python .deploy/deploy_v186.py

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=peptide-planner --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
