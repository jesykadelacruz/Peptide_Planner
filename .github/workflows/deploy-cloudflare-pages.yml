name: Deploy Peptide Planner v16 to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v16_release_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate official v16
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          EXPECTED_V9 = 'bcebcd78b5a63a518e5114cea56e787800ab0d71fbd4b835b2e9b3ee5ee389d3'
          EXPECTED_V15 = '59543b450c89db382c2be4da8a31df98528b9893d8bfb6f38c8077e9bce8a536'
          EXPECTED_V16 = '98268e7b686495d8bee6cd2a5c00bc676540b2f1c1e94d74fae30660619b303b'

          def split_lines(text):
              return text.splitlines(keepends=True)

          def apply_patch(source, patch):
              src = split_lines(source)
              pl = split_lines(patch)
              out = []
              si = 0
              i = 0
              while i < len(pl) and not pl[i].startswith('@@ '):
                  i += 1
              while i < len(pl):
                  header = pl[i].rstrip('\n')
                  m = re.match(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', header)
                  if not m:
                      raise RuntimeError('Invalid deployment patch header: ' + header)
                  old_start = int(m.group(1))
                  old_count = 1 if m.group(2) is None else int(m.group(2))
                  target = old_start if old_count == 0 else old_start - 1
                  if target < si:
                      raise RuntimeError('Overlapping deployment patch')
                  while si < target:
                      out.append(src[si]); si += 1
                  i += 1
                  consumed = 0
                  while i < len(pl) and not pl[i].startswith('@@ '):
                      line = pl[i]
                      mark = line[:1]
                      body = line[1:]
                      if mark == ' ':
                          if si >= len(src) or src[si] != body:
                              raise RuntimeError('Deployment context mismatch')
                          out.append(src[si]); si += 1; consumed += 1
                      elif mark == '-':
                          if si >= len(src) or src[si] != body:
                              raise RuntimeError('Deployment source mismatch')
                          si += 1; consumed += 1
                      elif mark == '+':
                          out.append(body)
                      elif mark == '\\':
                          pass
                      elif line.strip() != '':
                          raise RuntimeError('Invalid deployment patch line')
                      i += 1
                  if consumed != old_count:
                      raise RuntimeError(f'Deployment patch count mismatch: {consumed} != {old_count}')
              out.extend(src[si:])
              return ''.join(out)

          def inflate(paths):
              payload = ''.join(Path(p).read_text().strip() for p in paths)
              return zlib.decompress(base64.b64decode(payload)).decode('utf-8')

          base = Path('Peptide_Planner_KB_Mobile_v184.html').read_text()
          chain = [
              [f'.deploy/v189_patch_part_{n:02d}.b64' for n in range(1,5)],
              ['.deploy/v190_delta_from_v189live.b64'],
              ['.deploy/v191_delta_from_v190live.b64'],
              ['.deploy/v193_delta_from_v191live.b64'],
              ['.deploy/v194_delta_from_v193live.b64'],
              [f'.deploy/v195_delta_part_{n:02d}.b64' for n in range(1,5)],
              ['.deploy/v1_delta_from_v195live.b64'],
              ['.deploy/v2_delta_from_v1live.b64'],
              ['.deploy/v3_delta_from_v2live.b64'],
              ['.deploy/v4_delta_from_v3live.b64'],
              ['.deploy/v5_delta_from_v4live.b64'],
              ['.deploy/v6_delta_from_v5live.b64'],
              ['.deploy/v7_delta_from_v6live.b64'],
              ['.deploy/v8_delta_from_v7live.b64'],
              [f'.deploy/v9_delta_part_{n:02d}.b64' for n in range(1,5)],
          ]
          current = base
          for paths in chain:
              for p in paths:
                  if not Path(p).is_file():
                      raise SystemExit('Missing deployment asset: ' + p)
              current = apply_patch(current, inflate(paths))

          v9_hash = hashlib.sha256(current.encode()).hexdigest()
          if v9_hash != EXPECTED_V9:
              raise SystemExit(f'v9 checksum mismatch: {v9_hash}')

          v15_paths = [
              '.deploy/v15_patch_part_01.b64',
              '.deploy/v15_patch_part_02.b64',
              '.deploy/v15_patch_part_03a.b64',
              '.deploy/v15_patch_part_03b.b64',
              '.deploy/v15_patch_part_04.b64',
              '.deploy/v15_patch_part_05.b64',
              '.deploy/v15_patch_part_06.b64',
          ]
          for p in v15_paths:
              if not Path(p).is_file():
                  raise SystemExit('Missing v15 deployment asset: ' + p)
          v15 = apply_patch(current, inflate(v15_paths))
          actual_v15 = hashlib.sha256(v15.encode()).hexdigest()
          if actual_v15 != EXPECTED_V15:
              raise SystemExit(f'v15 checksum mismatch: {actual_v15}')

          v16_path = '.deploy/v16_delta_from_v15.b64'
          if not Path(v16_path).is_file():
              raise SystemExit('Missing v16 deployment asset: ' + v16_path)
          v16 = apply_patch(v15, inflate([v16_path]))
          actual_v16 = hashlib.sha256(v16.encode()).hexdigest()
          if actual_v16 != EXPECTED_V16:
              raise SystemExit(f'v16 checksum mismatch: {actual_v16}')

          required = [
              '<title>Peptide Planner v16</title>',
              'const APP_VERSION="v16";',
              'id="v16-cycle-time-height-fix-only"',
              'height:45.2px!important;',
              'height:46px!important;',
              'id="v14-signup-payment-account-request"',
              'id="v17-admin-dashboard"',
              'id="v20-compact-users-autosave"',
              'id="v26-mobile-cycle-layout-fix"',
              'id="plannerAccessGate"',
              'planner-access-admin',
              'planner_access_members',
              'signInWithPassword',
              'resetPasswordForEmail',
              'PASSWORD_RECOVERY',
              'updateUser({password})',
              'initCloudServices();',
              'https://srfuwxjwulvbalzoymcc.supabase.co',
              'from("planner_state")',
              'from("planner_snapshots")',
              'from("knowledge_base_entries")',
          ]
          missing = [item for item in required if item not in v16]
          if missing:
              raise SystemExit('v16 feature validation failed: ' + ', '.join(missing))

          Path('dist').mkdir(exist_ok=True)
          Path('dist/index.html').write_text(v16)
          print('Official v16 reconstructed and checksum verified:', actual_v16)
          PY

      - name: Validate JavaScript and responsive contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          inline = '\n'.join(s for s in scripts if s.strip() and 'application/ld+json' not in s[:100])
          Path('/tmp/v16-inline.js').write_text(inline)
          responsive = [
              'name="viewport"',
              '@media(max-width:760px)',
              '@media(max-width:640px)',
              'v26-mobile-cycle-layout-fix',
              'v16-cycle-time-height-fix-only',
              'grid-template-columns:repeat(7,minmax(0,1fr))',
              'requested-dose-table.mobile-card-table',
          ]
          missing = [x for x in responsive if x not in html]
          if missing:
              raise SystemExit('Responsive validation failed: ' + ', '.join(missing))
          print('Desktop/mobile responsive contracts verified')
          PY
          node --check /tmp/v16-inline.js

      - name: Smoke-test desktop and mobile rendering
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on this runner.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          html = Path('dist/index.html').read_text()
          html = html.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '')
          probe = '<style id="TEST-ONLY-RENDER-PROBE">body.access-locked{overflow:auto!important}body.access-locked>.app,body.access-locked>#plannerApp{display:block!important;visibility:visible!important}#plannerAccessGate{display:none!important}</style>'
          html = html.replace('</head>', probe + '</head>', 1)
          Path('/tmp/v16-render-probe.html').write_text(html)
          PY
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/v16-desktop.png file:///tmp/v16-render-probe.html
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --user-agent='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1' --screenshot=/tmp/v16-mobile.png file:///tmp/v16-render-probe.html
          test -s /tmp/v16-desktop.png
          test -s /tmp/v16-mobile.png
          echo 'Desktop 1440x1000 render passed.'
          echo 'Mobile 390x844 render passed.'

      - name: Build Cloudflare production ZIP
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          src = Path('dist/index.html')
          out = Path('Peptide Planner Mobile v16.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              z.write(src, 'index.html')
          with zipfile.ZipFile(out) as z:
              data = z.read('index.html')
          actual = hashlib.sha256(data).hexdigest()
          expected = '98268e7b686495d8bee6cd2a5c00bc676540b2f1c1e94d74fae30660619b303b'
          if actual != expected:
              raise SystemExit('Cloudflare ZIP checksum mismatch: ' + actual)
          print('Cloudflare ZIP verified:', out)
          PY

      - name: Upload production ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peptide Planner Mobile v16
          path: Peptide Planner Mobile v16.zip
          if-no-files-found: error
          retention-days: 30

      - name: Confirm this is still the newest main commit
        id: freshness
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          echo "workflow_commit=$GITHUB_SHA"
          echo "current_main=$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo 'Skipping stale deployment so an older build cannot replace production.'
          fi

      - name: Deploy v16 to Cloudflare Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
