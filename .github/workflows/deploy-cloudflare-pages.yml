name: Validate Peptide Planner v9 Manual Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate v9 loader and access-control delta
        run: |
          set -euo pipefail
          cat .deploy/v9_delta_part_*.b64 > /tmp/v9_delta.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('/tmp/v9_delta.b64').read_text()
          patch = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          required = [
              'Peptide Treatment Planner Mobile v9',
              'APP_VERSION="v9"',
              'v9-invite-only-access-control',
              'plannerAccessGate',
              'adminAccessOverlay',
              'planner_access_members',
              'planner_claim_owner',
              'planner-access-admin',
              'PASSWORD_RECOVERY',
              'signInWithPassword',
          ]
          missing = [item for item in required if item not in patch]
          if missing:
              raise SystemExit('v9 access-control delta is missing: ' + ', '.join(missing))
          print('Validated v9 access-control delta')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
              'Peptide Planner v9',
              'EXPECTED_V9_SHA256="bcebcd78b5a63a518e5114cea56e787800ab0d71fbd4b835b2e9b3ee5ee389d3"',
              'v9_delta_part_',
              'plannerAccessGate',
              'adminAccessOverlay',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('v9 loader is missing: ' + ', '.join(missing))
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          for i, script in enumerate(scripts):
              Path(f'/tmp/v9-loader-{i}.js').write_text(script)
          print(f'Validated v9 loader markers; {len(scripts)} inline script(s)')
          PY
          for js in /tmp/v9-loader-*.js; do node --check "$js"; done

      - name: Deployment note
        run: |
          echo "v9 production is deployed from the tested Cloudflare production ZIP."
          echo "Automatic legacy delta-chain deployment is intentionally disabled because older compressed chain assets are unreliable."
