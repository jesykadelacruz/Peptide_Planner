name: Build Peptide Planner Cloudflare Upload ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'Peptide_Planner_KB_Mobile_v184.html'
      - '.deploy/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate v9 loader and access-control delta
        run: |
          set -euo pipefail
          cat .deploy/v9_delta_part_*.b64 > /tmp/v9_delta.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = Path('/tmp/v9_delta.b64').read_text()
          patch = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          required = [
              'Peptide Treatment Planner Mobile v9',
              'APP_VERSION="v9"',
              'v9-invite-only-access-control',
              'plannerAccessGate',
              'adminAccessOverlay',
              'planner_access_members',
              'planner_claim_owner',
              'planner-access-admin',
              'PASSWORD_RECOVERY',
              'signInWithPassword',
          ]
          missing = [item for item in required if item not in patch]
          if missing:
              raise SystemExit('v9 access-control delta is missing: ' + ', '.join(missing))
          print('Validated v9 access-control delta')
          PY

      - name: Validate production loader
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          required = [
              'Peptide Planner v9',
              'EXPECTED_V9_SHA256="bcebcd78b5a63a518e5114cea56e787800ab0d71fbd4b835b2e9b3ee5ee389d3"',
              'v9_delta_part_',
              'plannerAccessGate',
              'adminAccessOverlay',
              'ui_overrides_v10.css',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('v9 loader is missing: ' + ', '.join(missing))
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          for i, script in enumerate(scripts):
              Path(f'/tmp/v9-loader-{i}.js').write_text(script)
          print(f'Validated v9 loader markers; {len(scripts)} inline script(s)')
          PY
          for js in /tmp/v9-loader-*.js; do node --check "$js"; done

      - name: Build clean Cloudflare upload folder
        run: |
          set -euo pipefail
          rm -rf cloudflare_upload
          mkdir -p cloudflare_upload
          cp index.html cloudflare_upload/index.html
          cp Peptide_Planner_KB_Mobile_v184.html cloudflare_upload/Peptide_Planner_KB_Mobile_v184.html
          cp -R .deploy cloudflare_upload/.deploy
          test -f cloudflare_upload/index.html
          test -f cloudflare_upload/.deploy/ui_overrides_v10.css
          echo "Cloudflare package prepared."

      - name: Upload Cloudflare deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_Cloudflare_Update_v10
          path: cloudflare_upload/
          if-no-files-found: error
          retention-days: 30
