name: Apply Peptide Planner v2026.0209.017 Cycle Settings patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-017.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "c193e5856fd8cef3435555180bab88f87358a0ddb5c776c3839e99cd20c553fd"
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_017.patch.xz.b64 | xz -d > /tmp/v017.patch
          git apply --check /tmp/v017.patch
          git apply /tmp/v017.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "01beca0a7a31b4381ad204a64c8870ef7520cb98d97bbf71fdeb18e5380a77d9"
      - name: Validate protected and requested functions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Peptide Planner v2026.0209.017' index.html
          grep -q 'previousFinishDate=index>1' index.html
          grep -q 'grid-template-areas:' index.html
          grep -q 'Dose schedule' index.html
          grep -q 'data-cycle-phase-weekday' index.html
          grep -q 'SUPABASE_URL' index.html
          grep -q 'resetPasswordForEmail' index.html
          grep -q 'reconcileCloudState' index.html
          grep -q 'plannerNotificationEnable' index.html
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/index-longest.js').write_text(max(blocks,key=len))
          PY
          node --check /tmp/index-longest.js
      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy Peptide Planner v2026.0209.017'
          git push
