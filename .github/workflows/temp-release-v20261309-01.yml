name: Temporary Peptide Planner release v20261309.01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-release-v20261309-01.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify apply validate and release
        shell: bash
        run: |
          set -euo pipefail
          BASE='873b42f0b8c03f82e6a7550fc95d09cfd6261f71'
          RELEASE='Peptide_Planner_v20261309.01'
          PATCH_SHA='9af4453c6aacb90dd434d24b72bc34e9d11640d79faceaf3f207e113c933164f'
          EXPECTED_INDEX_BLOB='bcec59334039bfda08ac153a5a67845afa3eb529'
          EXPECTED_SW_BLOB='1da5e0954a306ad660497d1c03eddd13b2bc8f9b'

          git merge-base --is-ancestor "$BASE" HEAD
          git diff --quiet "$BASE" -- index.html peptide-planner-sw.js manifest.webmanifest _headers

          cat \
            .release/v20261309-01.part00 \
            .release/v20261309-01.part01 \
            .release/v20261309-01.part02 \
            .release/v20261309-01.part03 \
            .release/v20261309-01.p04-0 \
            .release/v20261309-01.p04-1 \
            .release/v20261309-01.p04-2 \
            .release/v20261309-01.p04-3 \
            .release/v20261309-01.p05-0 \
            .release/v20261309-01.p05-1 \
            .release/v20261309-01.p05-2 \
            .release/v20261309-01.p05-3 \
            | base64 -d > /tmp/release.patch

          test "$(sha256sum /tmp/release.patch | awk '{print $1}')" = "$PATCH_SHA"
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch

          rm -f \
            .release/v20261309-01.part00 \
            .release/v20261309-01.part01 \
            .release/v20261309-01.part02 \
            .release/v20261309-01.part03 \
            .release/v20261309-01.part04 \
            .release/v20261309-01.p04-0 \
            .release/v20261309-01.p04-1 \
            .release/v20261309-01.p04-2 \
            .release/v20261309-01.p04-3 \
            .release/v20261309-01.p05-0 \
            .release/v20261309-01.p05-1 \
            .release/v20261309-01.p05-2 \
            .release/v20261309-01.p05-3
          rm -f .github/workflows/temp-release-v20261309-01.yml

          grep -q '<title>Peptide_Planner_v20261309.01</title>' index.html
          grep -q 'const APP_VERSION="Peptide_Planner_v20261309.01";' index.html
          grep -q "PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261309.01'" peptide-planner-sw.js

          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check peptide-planner-sw.js
          git diff --check

          test "$(git hash-object index.html)" = "$EXPECTED_INDEX_BLOB"
          test "$(git hash-object peptide-planner-sw.js)" = "$EXPECTED_SW_BLOB"

          ACTUAL="$(git diff --name-only "$BASE" | sort)"
          EXPECTED="$(printf '%s\n' index.html peptide-planner-sw.js | sort)"
          test "$ACTUAL" = "$EXPECTED"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$RELEASE"
          git push origin HEAD:main
