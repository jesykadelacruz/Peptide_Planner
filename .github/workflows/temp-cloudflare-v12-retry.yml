name: Temporary Peptide Planner v12 production deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-cloudflare-v12-retry.yml

permissions:
  contents: write
  deployments: write

concurrency:
  group: peptide-planner-v12-production-retry
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Retry Peptide_Planner_v20261009.12 production deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact v12 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact release state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c8ab676a31e3e6fd209111b3adfc808be85b7df8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp-cloudflare-v12-retry.yml"
          grep -Fq '<title>Peptide_Planner_v20261009.12</title>' index.html
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261009.12";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.12';" peptide-planner-sw.js
          grep -Fq '/* v20261009.12 — requested mobile-only Treatments field height normalization. */' index.html

      - name: Build exact production directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          node --check peptide-planner-sw.js
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const scripts=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          scripts.forEach(source=>new Function(source));
          NODE
          zip -q -j Peptide_Planner_v20261009.12.zip release/_headers release/index.html release/manifest.webmanifest release/peptide-planner-sw.js

      - name: Deploy exact release to Cloudflare Pages
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          raw_log=/tmp/cloudflare-deploy-raw.log
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            printf '%s\n' 'CLOUDFLARE_API_TOKEN is not configured.' > "$raw_log"
            deploy_rc=41
          elif [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            printf '%s\n' 'CLOUDFLARE_ACCOUNT_ID is not configured.' > "$raw_log"
            deploy_rc=42
          else
            npx --yes wrangler@3 pages deploy release --project-name=peptide-planner --branch=main --commit-dirty=true > "$raw_log" 2>&1
            deploy_rc=$?
          fi
          set -e
          DEPLOY_RC="$deploy_rc" python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          raw = Path("/tmp/cloudflare-deploy-raw.log").read_text(errors="replace")
          for secret_name in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              secret = os.environ.get(secret_name, "")
              if secret:
                  raw = raw.replace(secret, "[REDACTED]")
          raw = re.sub(r"(?i)(token|authorization|bearer)(\s*[:=]\s*|\s+)[^\s]+", r"\1\2[REDACTED]", raw)
          lines = raw.splitlines()[-250:]
          presence = {
              name: bool(os.environ.get(name, ""))
              for name in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID")
          }
          summary = (
              f"exit_code={os.environ['DEPLOY_RC']}\n"
              f"api_token_configured={str(presence['CLOUDFLARE_API_TOKEN']).lower()}\n"
              f"account_id_configured={str(presence['CLOUDFLARE_ACCOUNT_ID']).lower()}\n"
              + "\n".join(lines)
              + "\n"
          )
          Path("cloudflare-deploy-diagnostic.txt").write_text(summary)
          PY
          printf 'exit_code=%s\n' "$deploy_rc" >> "$GITHUB_OUTPUT"

      - name: Upload release and sanitized deployment diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.12-production-attempt
          path: |
            Peptide_Planner_v20261009.12.zip
            cloudflare-deploy-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary deployment workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-cloudflare-v12-retry.yml
          git commit -m 'Remove temporary v12 production deployment workflow'
          git push origin HEAD:main

      - name: Require successful production deployment
        if: always()
        shell: bash
        run: |
          test "${{ steps.cloudflare.outputs.exit_code }}" = "0"
