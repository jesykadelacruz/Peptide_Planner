name: Release Peptide Planner v20261009.09
on:
  push:
    paths:
      - '.github/workflows/temp-mobile-corrections.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Apply exact mobile corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old_block = "/* v20261009.08 — requested mobile alignment and cycled vial value heights only. */\n@media(max-width:760px){\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(1),\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(2){\n    display:grid!important;\n    grid-template-rows:auto 40px!important;\n    align-self:end!important;\n  }\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-concentration .cycle-vial-dose-box,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-full-dose-field .cycle-vial-dose-box,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-cycle-dose-field .cycle-vial-dose-box{\n    height:40px!important;\n    min-height:40px!important;\n    max-height:40px!important;\n    block-size:40px!important;\n  }\n}"
          new_block = "/* v20261009.09 — requested mobile-only field alignment and font corrections. */\n@media(max-width:760px){\n  body.mobile-app #planner .peptide-settings-grid > .peptide-settings-dispose .dispose-by-control{\n    grid-template-columns:repeat(2,minmax(0,1fr))!important;\n    width:100%!important;\n  }\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(1),\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(2){\n    display:flex!important;\n    flex-direction:column!important;\n    align-self:stretch!important;\n  }\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(1) > label,\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(2) > label{\n    margin:0 0 4px!important;\n  }\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(1) > .date-control,\n  body.mobile-app #planner .cycle-config-card[data-cycle-config=\"1\"] .cycle-config-grid > div:nth-child(2) > input[data-cycle-config-field=\"injectionTime\"]{\n    margin-top:auto!important;\n  }\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-concentration .cycle-vial-dose-box,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-full-dose-field .cycle-vial-dose-box,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-cycle-dose-field .cycle-vial-dose-box{\n    height:40px!important;\n    min-height:40px!important;\n    max-height:40px!important;\n    block-size:40px!important;\n  }\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-vial > span,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-water > span,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-concentration > span,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-open-field > span,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-finish-field > span,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-vial input,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-water input,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-prep-concentration .cycle-vial-dose-box,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-open-field .date-display,\n  body.mobile-app #planner .cycle-vial-cycled-mobile-cards .cycle-vial-finish-field .date-display{\n    font-weight:400!important;\n  }\n}"
          assert text.count(old_block) == 1
          assert text.count("Peptide_Planner_v20261009.08") == 2
          text = text.replace(old_block, new_block)
          text = text.replace("Peptide_Planner_v20261009.08", "Peptide_Planner_v20261009.09")
          path.write_text(text, encoding="utf-8")
          sw = Path("peptide-planner-sw.js")
          sw_text = sw.read_text(encoding="utf-8")
          assert sw_text.count("Peptide_Planner_v20261009.08") == 1
          sw.write_text(sw_text.replace("Peptide_Planner_v20261009.08", "Peptide_Planner_v20261009.09"), encoding="utf-8")
          PY
      - name: Validate exact scope
        shell: bash
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html peptide-planner-sw.js "
          git diff --check
          node --check peptide-planner-sw.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          [...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].forEach(m=>new Function(m[1]));
          if(!s.includes('<title>Peptide_Planner_v20261009.09</title>'))throw new Error('title mismatch');
          if(!s.includes('const APP_VERSION="Peptide_Planner_v20261009.09";'))throw new Error('APP_VERSION mismatch');
          const required=[
            '.peptide-settings-dispose .dispose-by-control',
            '.cycle-config-card[data-cycle-config="1"]',
            '.cycle-vial-prep-vial > span',
            '.cycle-vial-prep-water > span',
            '.cycle-vial-prep-concentration > span',
            '.cycle-vial-open-field > span',
            '.cycle-vial-finish-field > span'
          ];
          required.forEach(x=>{if(!s.includes(x))throw new Error('missing '+x)});
          console.log('inline JavaScript and targeted CSS checks passed');
          NODE
          cmp --silent _headers <(git show HEAD^:_headers)
          cmp --silent manifest.webmanifest <(git show HEAD^:manifest.webmanifest)
      - name: Commit production release
        shell: bash
        run: |
          git rm .github/workflows/temp-mobile-corrections.yml
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html peptide-planner-sw.js
          git commit -m "Peptide_Planner_v20261009.09"
          git push origin HEAD:main
      - name: Build Cloudflare package
        shell: bash
        run: |
          mkdir -p release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          (cd release && zip -q ../Peptide_Planner_v20261009.09.zip _headers index.html manifest.webmanifest peptide-planner-sw.js)
          unzip -t Peptide_Planner_v20261009.09.zip
          test "$(unzip -Z1 Peptide_Planner_v20261009.09.zip | sort | tr '\n' ' ')" = "_headers index.html manifest.webmanifest peptide-planner-sw.js "
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.09
          path: |
            Peptide_Planner_v20261009.09.zip
            release/_headers
            release/index.html
            release/manifest.webmanifest
            release/peptide-planner-sw.js
                   if-no-files-found: error
