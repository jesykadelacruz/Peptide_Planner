name: Temporary date control alignment release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-date-control-heights-v20260909-04.yml'

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited date control fix
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/fix_date_control_heights_v20260909_04.py
          git checkout -- .deploy/fix_date_control_heights_v20260909_04.py

      - name: Validate exact visual scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short | awk '{print $2}')" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Peptide Planner v2026.0909.04</title>' in html
          assert 'const APP_VERSION="v2026.0909.04";' in html
          expected='''/* Keep enhanced date wrappers exactly the same height as their visible date fields. */\n#planner .cycle-config-card .date-control,\n#planner .cycle-vial-schedule-field [data-cycle-vial-row] .date-control{\n  height:36px!important;\n  min-height:36px!important;\n  max-height:36px!important;\n  block-size:36px!important;\n  box-sizing:border-box!important;\n}\n#planner .continuous-vial-schedule-field [data-continuous-vial-row] .date-control,\n#planner .continuous-vial-schedule-field [data-continuous-vial-row] .date-display{\n  height:40px!important;\n  min-height:40px!important;\n  max-height:40px!important;\n  block-size:40px!important;\n  box-sizing:border-box!important;\n}'''
          assert html.count(expected)==1
          assert '<th>#</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Cycle Dose</th><th>Open</th><th>Finish</th><th>Status</th>' in html
          assert '<th>Vial #</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Open</th><th>Finish</th><th>Status</th>' in html
          assert 'function enhanceDateInputs(root=document){' in html
          assert 'icon.className="date-picker-icon";' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts): Path(f'/tmp/peptide-inline-{i}.js').write_text(script,encoding='utf-8')
          diff=subprocess.check_output(['git','diff','--','index.html'],text=True)
          additions=[line for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++')]
          deletions=[line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          assert len(deletions)==0, deletions
          assert len(additions)==17, len(additions)
          print(f'Validated {len(additions)} CSS-only added lines and {len(scripts)} inline scripts')
          PY
          for f in /tmp/peptide-inline-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js

      - name: Commit date control fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Align treatment date control heights"
          git push origin HEAD:main

      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/peptide-package
          mkdir -p /tmp/peptide-package
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/peptide-package/
          python - <<'PY'
          from pathlib import Path
          expected={'_headers','index.html','manifest.webmanifest','peptide-planner-sw.js'}
          actual={p.name for p in Path('/tmp/peptide-package').iterdir() if p.is_file()}
          assert actual==expected,(actual,expected)
          PY
          (cd /tmp/peptide-package && zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.04_Date_Control_Fix.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js)
          unzip -t Peptide_Planner_v20260909.04_Date_Control_Fix.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.04_Date_Control_Fix.zip') as z:
              assert sorted(z.namelist())==sorted(expected),z.namelist()
          PY
          sha256sum Peptide_Planner_v20260909.04_Date_Control_Fix.zip

      - name: Upload Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.04_Date_Control_Fix
          path: Peptide_Planner_v20260909.04_Date_Control_Fix.zip
          if-no-files-found: error
