name: Apply v2026.0809.02 cross-device sync fix

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0809-02.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch cross-device sync only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def once(old,new):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'target count={s.count(old)}: {old[:70]}')
              s=s.replace(old,new,1)
          once('<title>Peptide Planner v2026.0809.01</title>','<title>Peptide Planner v2026.0809.02</title>')
          once('const APP_VERSION="v2026.0709.10";','const APP_VERSION="v2026.0809.02";')
          once('function markLocalChanged(){if(!cloudApplying)setCloudSyncMeta({localModifiedAt:new Date().toISOString()})}','function markLocalChanged(){if(!cloudApplying)setCloudSyncMeta({localModifiedAt:new Date().toISOString(),localDirty:true})}')
          marker='<!-- v2026.0809.02: Cross-device cloud sync no longer compares device clocks to decide which planner state is newer. Local edits are tracked with an explicit dirty flag; clean sessions always pull the current cloud state, pending local edits push only when the cloud has not changed since the last sync, and cross-device conflicts preserve a snapshot before applying the newer cloud state. APP_VERSION is advanced so mobile and desktop refresh the same runtime. -->\n'
          anchor='<title>Peptide Planner v2026.0809.02</title>\n'
          if marker not in s:
              s=s.replace(anchor,anchor+marker,1)
          new_push='''async function pushCloudState(reason="automatic"){
            if(!cloudClient||!cloudUser||cloudApplying||cloudAccess?.status!=="active")return false;
            clearTimeout(cloudSaveTimer);setCloudSyncStatus("Syncing…","syncing");
            const stamp=new Date().toISOString();
            try{
              const {data,error}=await cloudClient.from("planner_state").upsert({user_id:cloudUser.id,state:state,app_version:APP_VERSION,client_updated_at:stamp},{onConflict:"user_id"}).select("updated_at,client_updated_at").maybeSingle();
              if(error)throw error;
              const remoteStamp=data?.updated_at||data?.client_updated_at||stamp;
              setCloudSyncMeta({userId:cloudUser.id,lastSyncedAt:stamp,localModifiedAt:stamp,localDirty:false,lastRemoteUpdatedAt:remoteStamp});setCloudSyncStatus("Synced","synced");return true;
            }catch(error){console.error("Cloud sync failed",error);setCloudSyncStatus("Sync error","error");return false}
          }'''
          s,n=re.subn(r'async function pushCloudState\(reason="automatic"\)\{.*?\n\}(?=\nasync function snapshotLocalState)',new_push,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'push function count={n}')
          once('    setCloudSyncMeta({lastSyncedAt:remoteStamp||new Date().toISOString(),localModifiedAt:remoteStamp||new Date().toISOString()},cloudUser.id);','    const appliedStamp=remoteStamp||new Date().toISOString();\n    setCloudSyncMeta({lastSyncedAt:appliedStamp,localModifiedAt:appliedStamp,localDirty:false,lastRemoteUpdatedAt:appliedStamp},cloudUser.id);')
          new_reconcile='''async function reconcileCloudState({silent=false}={}){
            if(!cloudClient||!cloudUser||cloudAccess?.status!=="active")return;
            loadPlannerStateForUser(cloudUser.id);
            if(!silent)setCloudSyncStatus("Syncing…","syncing");
            try{
              const {data,error}=await cloudClient.from("planner_state").select("state,app_version,client_updated_at,updated_at").eq("user_id",cloudUser.id).maybeSingle();
              if(error)throw error;
              if(!data){
                if(hasMeaningfulPlannerData(state))await pushCloudState("first_user_upload");
                else setCloudSyncStatus("New planner","synced");
                return;
              }
              const remoteStamp=data.updated_at||data.client_updated_at||"";
              const meta=getCloudSyncMeta(cloudUser.id);
              const localDirty=meta.localDirty===true;
              if(localDirty&&hasMeaningfulPlannerData(state)){
                const remoteChangedSinceLastSync=!!meta.lastRemoteUpdatedAt&&isoMs(remoteStamp)>isoMs(meta.lastRemoteUpdatedAt)+1;
                if(remoteChangedSinceLastSync){
                  await snapshotLocalState("cross_device_conflict_backup");
                  applyCloudPlannerState(data.state,remoteStamp);
                  setCloudSyncStatus("Synced","synced");
                  return;
                }
                await pushCloudState("local_pending");
                return;
              }
              applyCloudPlannerState(data.state,remoteStamp);
              setCloudSyncStatus("Synced","synced");
            }catch(error){console.error("Cloud restore failed",error);setCloudSyncStatus("Sync error","error")}
          }'''
          s,n=re.subn(r'async function reconcileCloudState\(\{silent=false\}=\{\}\)\{.*?\n\}(?=\nasync function fetchKnowledgeBaseOverrides)',new_reconcile,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'reconcile function count={n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify JavaScript and sync invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>',s.index('<script src='))+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/planner-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/planner-inline.js
          grep -F '<title>Peptide Planner v2026.0809.02</title>' index.html
          grep -F 'const APP_VERSION="v2026.0809.02";' index.html
          grep -F 'localDirty:true' index.html
          grep -F 'lastRemoteUpdatedAt' index.html
          grep -F 'cross_device_conflict_backup' index.html
          if grep -F 'isoMs(localStamp)>isoMs(remoteStamp)+1000' index.html; then exit 1; fi
      - name: Commit index.html only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v2026.0809.02 fix cross-device cloud reconciliation'
          git push origin main
      - name: Export exact index
        run: cp index.html Peptide_Planner_v2026.0809.02.html
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v2026.0809.02_index
          path: Peptide_Planner_v2026.0809.02.html
