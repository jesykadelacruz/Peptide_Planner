name: Apply Peptide Planner v2026.0209.022 continuous-treatment and notification-removal patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-022.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard baseline and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "0fe9b05bebc46696678841f10819da5dd62fb72d5456a8cdb3c81bbfd31d8cc9"
          base64 -d .deploy/v2026_0209_022.current.patch.xz.b64 | xz -d > /tmp/v022.patch
          patch -p0 < /tmp/v022.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "c823700641a69d08d824d02a371734387fab4724506f2fbd3dbc955f20ad97c0"
          grep -q 'Peptide Planner v2026.0209.022' index.html
          grep -q 'function renderContinuousVialSchedule' index.html
          grep -q 'data-continuous-vial-open-date' index.html
          grep -q 'continuous:dose-schedule' index.html
          grep -q 'data-cycle-phase-weekday' index.html
          grep -q 'supabase.createClient' index.html
          grep -q 'PASSWORD_RECOVERY' index.html
          if grep -q 'plannerNotification\|planner_notification_queue\|planner_push_subscriptions\|Notification.requestPermission\|PUSH_VAPID' index.html; then
            echo 'Notification feature markers remain in index.html' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const scripts=[...s.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          const js=scripts.reduce((a,b)=>b.length>a.length?b:a,'');
          fs.writeFileSync('/tmp/planner-main.js',js);
          NODE
          node --check /tmp/planner-main.js
      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.022"
          git push origin HEAD:main
