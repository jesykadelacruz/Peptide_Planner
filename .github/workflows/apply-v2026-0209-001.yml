name: Apply Peptide Planner v2026.0209.001 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-001.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "afc095309308a997598ff0bb8e2515bb71ae97dcfd56d78cad13d96f6946695e"
      - name: Apply exact v2026.0209.001 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_001.patch.xz.b64 | xz -d > /tmp/v2026_0209_001.patch
          git apply --check /tmp/v2026_0209_001.patch
          git apply /tmp/v2026_0209_001.patch
      - name: Validate exact target and protected functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "888a49ab3aac522f00ce61f2abd3c4a37c6e20fe24b1aae14aafb330af108f97"
          grep -Fq '<title>Peptide Planner v2026.0209.001</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.0209.001"' index.html
          grep -Fq 'signInWithPassword' index.html
          grep -Fq 'resetPasswordForEmail' index.html
          grep -Fq 'PASSWORD_RECOVERY' index.html
          grep -Fq 'updateUser({password})' index.html
          grep -Fq 'planner-signup-public' index.html
          grep -Fq 'from("planner_state")' index.html
          grep -Fq 'from("planner_snapshots")' index.html
          grep -Fq 'from("knowledge_base_entries")' index.html
          grep -Fq 'srfuwxjwulvbalzoymcc.supabase.co' index.html
          grep -Fq '.hero{background:linear-gradient(135deg,#1f675b,#2f8f7f 58%,#67ad83)' index.html
          if grep -Fq '<button id="cloudAdminOpen"' index.html; then echo 'Top Admin Dashboard button still exists'; exit 1; fi
          grep -Fq 'id="adminTabButton"' index.html
          grep -Fq 'const accountEmail=document.getElementById("accountCurrentEmail");if(accountEmail)accountEmail.textContent=cloudUser?.email||"Not signed in";' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)))
          PY
          node --check /tmp/inline.js
      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote Peptide Planner v2026.0209.001 production index"
          git push origin HEAD:main
