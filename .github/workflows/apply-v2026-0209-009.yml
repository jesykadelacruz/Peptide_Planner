name: Apply Peptide Planner v2026.0209.009 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-009.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "6362982adf88366200f65c6faffd993becdb2638aec271c76e82187202a26b91  index.html" | sha256sum -c -

      - name: Apply exact v2026.0209.009 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_009.patch.xz.b64 | xz -d > /tmp/v009.patch
          patch --batch --forward -p0 < /tmp/v009.patch
          echo "d39d7e1ba7d8bc549ac2f7a83f9fb1d9bd435319464afaa01fc3dbf4d98846ed  index.html" | sha256sum -c -

      - name: Validate exact target and protected functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=[
            'Peptide Planner v2026.0209.009',
            'const APP_VERSION="v2026.0209.009";',
            'data-plan-active-weeks',
            'data-plan-break-weeks',
            'data-open-next-vial',
            '<span>Dose left in vial</span>',
            '<span>Vial per cycle</span>',
            'planner_notification_preferences',
            'planner_push_subscriptions',
            'planner_notification_queue',
            'Send test notification',
            'Reactivate',
            'data-dashboard-injection',
            'Review &amp; verify'
          ]
          for marker in required:
              assert marker in s, marker
          assert 'data-cycle-config-field="activeWeeks"' not in s
          assert 'data-cycle-config-field="breakWeeks"' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          inline=max(scripts,key=len)
          Path('/tmp/planner-inline.js').write_text(inline)
          PY
          node --check /tmp/planner-inline.js

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No production change to commit."
          else
            git commit -m "Deploy Peptide Planner v2026.0209.009"
            git push origin HEAD:main
          fi
