name: Temporary Peptide Planner release v20261209.01
on:
  push:
    paths:
      - '.github/workflows/temp-release-v20261209-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify, apply, validate and release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='63170c5945a8b9ef3c73876f52de1c28d044e246'
          RELEASE='Peptide_Planner_v20261209.01'
          HELPER='.github/workflows/temp-release-v20261209-01.yml'
          if [ "$(git rev-parse HEAD^)" != "$EXPECTED_BASE" ]; then
            echo "Unexpected baseline: $(git rev-parse HEAD^)" >&2
            exit 1
          fi
          printf '%s' '' | base64 -d | gzip -d > /tmp/release.patch
          echo 'fb815a0282d42650138d5528a815c22a819e4db4f05a3deabdf78f736f340833  /tmp/release.patch' | sha256sum -c -
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch
          rm -f "$HELPER"
          grep -q '<title>Peptide_Planner_v20261209.01</title>' index.html
          grep -q 'const APP_VERSION="Peptide_Planner_v20261209.01";' index.html
          grep -q "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261209.01';" peptide-planner-sw.js
          python - <<'PYJS'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          parts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I):
              tag=s[m.start():s.find('>',m.start())+1]
              if 'src=' not in tag.lower(): parts.append(m.group(1))
          Path('/tmp/inline-js-check.js').write_text('\n'.join(parts))
          PYJS
          node --check /tmp/inline-js-check.js
          node --check peptide-planner-sw.js
          git add index.html peptide-planner-sw.js "$HELPER"
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=("$HELPER" "index.html" "peptide-planner-sw.js")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${changed[*]}" != "${expected_sorted[*]}" ]; then
            printf 'Unexpected staged files:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE"
          git push origin HEAD:main
