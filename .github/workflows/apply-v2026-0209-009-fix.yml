name: Apply Peptide Planner v2026.0209.009 final vial-state fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-009-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current v009 baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "d39d7e1ba7d8bc549ac2f7a83f9fb1d9bd435319464afaa01fc3dbf4d98846ed  index.html" | sha256sum -c -

      - name: Apply final vial-state fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_009_fix.patch.xz.b64 | xz -d > /tmp/v009-fix.patch
          patch --batch --forward -p0 < /tmp/v009-fix.patch
          echo "b87e23554a3b7b49e0d78380423230003b8a994b17ce0c21c7e91c8e23869a8e  index.html" | sha256sum -c -
          grep -q 'const APP_VERSION="v2026.0209.009";' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'const latest=opened[opened.length-1],closed=new Set(["Finished","Discarded","On hold"]);' in s
          assert 'return closed.has(String(latest.record?.status||""))?null:latest;' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/planner-inline.js

      - name: Commit final v009 index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Finalize Peptide Planner v2026.0209.009 vial tracking"
          git push origin HEAD:main
