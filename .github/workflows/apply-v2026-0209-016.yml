name: Apply Peptide Planner v2026.0209.016 combined vial and Today alignment patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-016.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "0bb14f0e32551637e8fe540dde570d8fef897400bd35ffe04b6b74bf2f8ce513"

      - name: Decode and apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_016.patch.xz.b64 | xz -d > /tmp/v016.patch
          git apply --check /tmp/v016.patch
          git apply /tmp/v016.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "c193e5856fd8cef3435555180bab88f87358a0ddb5c776c3839e99cd20c553fd"

      - name: Verify requested and protected markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<title>Peptide Planner v2026.0209.016</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.0209.016"' index.html
          grep -Fq 'data-cycle-subsection="vial-schedule"' index.html
          grep -Fq 'data-cycle-subsection="dose-schedule"' index.html
          grep -Fq 'cycleConfigVialScheduleTargetCount' index.html
          grep -Fq 'currentScheduledVialRecord' index.html
          grep -Fq 'data-cycle-add-vial' index.html
          grep -Fq 'data-cycle-remove-vial' index.html
          grep -Fq 'grid-template-areas:"title check" "start check"' index.html
          grep -Fq 'data-cycle-phase-weekday' index.html
          grep -Fq 'SUPABASE_URL' index.html

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          paths=[]
          for i,script in enumerate(scripts):
              if script.strip():
                  p=pathlib.Path(f'/tmp/inline_{i}.js')
                  p.write_text(script,encoding='utf-8')
                  paths.append(str(p))
          pathlib.Path('/tmp/script_paths.txt').write_text('\n'.join(paths),encoding='utf-8')
          PY
          while IFS= read -r f; do [ -z "$f" ] || node --check "$f"; done < /tmp/script_paths.txt

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.016"
          git push origin main
