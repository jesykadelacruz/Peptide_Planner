name: Peptide Planner v20261009.03 release

on:
  push:
    paths:
      - '.github/workflows/chatgpt-v20261009-03-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited patch
        run: |
          cp index.html /tmp/index.before.html
          cp peptide-planner-sw.js /tmp/sw.before.js
          git apply --check .deploy/v20261009_03.patch
          git apply .deploy/v20261009_03.patch

      - name: Validate exact scope and syntax
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          before=Path('/tmp/index.before.html').read_text(encoding='utf-8')
          after=Path('index.html').read_text(encoding='utf-8')
          sw=Path('peptide-planner-sw.js').read_text(encoding='utf-8')
          assert '<title>Peptide_Planner_v20261009.03</title>' in after
          assert 'const APP_VERSION="Peptide_Planner_v20261009.03";' in after
          assert "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.03';" in sw
          assert '<title>Peptide_Planner_v20261009.02</title>' not in after
          assert 'const APP_VERSION="Peptide_Planner_v20261009.02";' not in after
          def styles(text):
              return re.findall(r'<style\b[^>]*>.*?</style>',text,flags=re.S|re.I)
          assert styles(before)==styles(after), 'CSS/style blocks changed unexpectedly'
          def function_block(text,name):
              start=text.index(f'function {name}(')
              brace=text.index('{',start); depth=0; quote=None; esc=False
              for i in range(brace,len(text)):
                  ch=text[i]
                  if quote:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                  else:
                      if ch in "'\"`": quote=ch
                      elif ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:return text[start:i+1]
              raise RuntimeError(name)
          for fn in ['cycleFullDoseCountForDisplay','continuousVialScheduleComputation']:
              assert function_block(before,fn)==function_block(after,fn), f'{fn} changed unexpectedly'
          assert 'function cycleVialRecordHasAuthoritativeOpen(record)' in after
          assert 'const rowRequired=cycleDoseCount>0;' in after
          assert 'const cycleNumber=Math.max(1,Math.floor(num(sequence)||1));\n  return {valid:true,mode:"cycle",cycleNumber,wholeVials:0,openings:[],lastDoses:[]};' in after
          scripts=re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>',after,flags=re.S|re.I)
          assert scripts, 'no inline scripts found'
          for i,script in enumerate(scripts):
              p=Path(f'/tmp/inline-{i}.js'); p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--check','peptide-planner-sw.js'],check=True)
          PY
          names="$(git diff --name-only | sort)"
          expected="$(printf 'index.html\npeptide-planner-sw.js')"
          test "$names" = "$expected"

      - name: Run cycled vial regression tests
        run: |
          python .deploy/test_v20261009_03.py
          python .deploy/test_v20261009_03_prep.py

      - name: Commit production release
        run: |
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html peptide-planner-sw.js
          git commit -m "Peptide_Planner_v20261009.03"
          git push origin main

      - name: Build exact Cloudflare package
        run: |
          rm -rf /tmp/cloudflare-v03
          mkdir -p /tmp/cloudflare-v03
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/cloudflare-v03/
          cd /tmp/cloudflare-v03
          zip -9 "/tmp/Peptide_Planner_v20261009.03.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          python - <<'PY'
          from zipfile import ZipFile
          p='/tmp/Peptide_Planner_v20261009.03.zip'
          with ZipFile(p) as z:
              names=z.namelist()
              expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
              assert sorted(names)==sorted(expected), names
              assert all('/' not in n for n in names), names
              bad=z.testzip(); assert bad is None, bad
          print('Cloudflare ZIP validated')
          PY

      - name: Upload Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.03
          path: /tmp/Peptide_Planner_v20261009.03.zip
          if-no-files-found: error
          retention-days: 90
