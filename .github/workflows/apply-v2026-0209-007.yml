name: Apply Peptide Planner v2026.0209.007 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-007.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "958b02775effd8928bbc2fe70c79b874c98970eb54e436c4909ed17bf538b73f"
      - name: Apply exact v2026.0209.007 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_007.patch.xz.b64 | xz -d > /tmp/v2026_0209_007.patch
          git apply --check /tmp/v2026_0209_007.patch
          git apply /tmp/v2026_0209_007.patch
      - name: Validate exact target and protected functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "cb177b75598d0cd01b2af5015a67b68378bb986bd95c1f8060c2212978a1b1f7"
          grep -Fq '<title>Peptide Planner v2026.0209.007</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.0209.007"' index.html
          grep -Fq '<span>Dose left in vial</span>' index.html
          ! grep -Fq '<span>Doses left in current vial</span>' index.html
          grep -Fq '<label>Concentration (mg/mL)</label>' index.html
          grep -Fq 'num(plan.vialMg)/num(plan.bacWaterMl)' index.html
          ! grep -Fq '<label>Volume (mL)</label>' index.html
          grep -Fq 'type="hidden" data-simple-field="finalMl"' index.html
          grep -Fq 'if(field==="bacWaterMl")plan.finalMl=control.value;' index.html
          grep -Fq 'signInWithPassword' index.html
          grep -Fq 'resetPasswordForEmail' index.html
          grep -Fq 'PASSWORD_RECOVERY' index.html
          grep -Fq 'updateUser({password})' index.html
          grep -Fq 'planner-signup-public' index.html
          grep -Fq 'from("planner_state")' index.html
          grep -Fq 'from("planner_snapshots")' index.html
          grep -Fq 'from("knowledge_base_entries")' index.html
          grep -Fq 'planner_notification_preferences' index.html
          grep -Fq 'planner_push_subscriptions' index.html
          grep -Fq 'planner_notification_queue' index.html
          grep -Fq 'waitForPlannerTestNotification' index.html
          grep -Fq 'data-admin-page-action="reactivate"' index.html
          grep -Fq '.filter(plan=>!!plan.confirmed)' index.html
          grep -Fq 'data-simple-field="confirmed"' index.html
          test "$(sha256sum peptide-planner-sw.js | awk '{print $1}')" = "26f9cbbe0f233a035ee6b6d1a8d9fa83229f2972255974eab35ef1d94469d1fc"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)))
          PY
          node --check /tmp/inline.js
          node --check peptide-planner-sw.js
      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote Peptide Planner v2026.0209.007 production index"
          git push origin HEAD:main
