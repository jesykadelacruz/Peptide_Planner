name: Peptide_Planner_v20260909.10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20260909-10.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact resolver fix
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_v20260909_10_active_vial_resolver.py
          git rm .deploy/apply_v20260909_10_active_vial_resolver.py .github/workflows/chatgpt-v20260909-10.yml
      - name: Validate exact scope
        shell: bash
        env:
          BASE_CLEAN: 9b09afac0882e3daecb4bd8b338b47b438eb3dc6
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff "$BASE_CLEAN" --name-only)" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, os
          h=Path('index.html').read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show',f"{os.environ['BASE_CLEAN']}:index.html"],text=True)
          assert '<title>Peptide Planner v2026.0909.04</title>' in h
          assert 'const APP_VERSION="v2026.0909.04";' in h
          assert h.count('record.startDate||record.scheduleResolvedOpenDate||record.needDate')==1
          assert h.count('if(record)record.scheduleResolvedOpenDate=openDate||"";')==1
          styles=lambda text: re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>',text,re.S)
          assert styles(h)==styles(base), 'CSS changed unexpectedly'
          def fn(text,start,end):
              a=text.index(start); b=text.index(end,a); return text[a:b]
          assert fn(h,'function continuousVialPrepForDate(','function continuousVialPrepForRecord(')==fn(base,'function continuousVialPrepForDate(','function continuousVialPrepForRecord(')
          assert fn(h,'function cycleFullDoseCountForDisplay(','function simulateCycleVialWindow(')==fn(base,'function cycleFullDoseCountForDisplay(','function simulateCycleVialWindow(')
          assert '<th>#</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Cycle Dose</th><th>Open</th><th>Finish</th><th>Status</th>' in h
          diff=subprocess.check_output(['git','diff',os.environ['BASE_CLEAN'],'--','index.html'],text=True)
          adds=[x for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++')]
          dels=[x for x in diff.splitlines() if x.startswith('-') and not x.startswith('---')]
          assert len(adds)==2, adds
          assert len(dels)==1, dels
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          for i,s in enumerate(scripts): Path(f'/tmp/peptide-{i}.js').write_text(s,encoding='utf-8')
          print('Validated active-vial resolver only')
          PY
          for f in /tmp/peptide-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js
      - name: Commit exact release name
        shell: bash
        run: |
          set -euo pipefail
          git config user.name jesykadelacruz
          git config user.email 84807985+jesykadelacruz@users.noreply.github.com
          git add -A
          git commit -m "Peptide_Planner_v20260909.10"
          git push origin HEAD:main
      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/pkg/
          cd /tmp/pkg
          zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.10.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd "$GITHUB_WORKSPACE"
          unzip -t Peptide_Planner_v20260909.10.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.10.zip') as z:
              assert sorted(z.namelist())==sorted(expected),z.namelist()
          PY
          sha256sum Peptide_Planner_v20260909.10.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.10
          path: Peptide_Planner_v20260909.10.zip
          if-no-files-found: error
