name: Apply v2026.0909.03 pending vial transition

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0909-03.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify current production source
        run: |
          test "$(git hash-object index.html)" = "6e3cac1f09199f647e89bd1d0a5c5e5058711282"
          test "$(git hash-object peptide-planner-sw.js)" = "59cb717248ed7b12379f03d9498ea7d94536ff58"

      - name: Patch vial transition logic only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}: target count {c}')
              s=s.replace(old,new,1)

          once('<title>Peptide Planner v2026.0909.02</title>','<title>Peptide Planner v2026.0909.03</title>','title')
          once('const APP_VERSION="v2026.0909.02";','const APP_VERSION="v2026.0909.03";','app version')
          anchor='<!-- v2026.0909.02: Cache/runtime synchronization release. Production treatment UI, vial logic, dose calculations, cross-device sync and role behavior are unchanged from v2026.0909.01; the service worker version is advanced to the same release so devices cannot remain on an older cached planner. -->\n'
          marker='<!-- v2026.0909.03: Continuous and cycled treatments now share the same pending replacement-vial transition. A replacement vial stays pending until its first scheduled administration date; after the prior vial can no longer supply another full scheduled dose, Dose left in vial shows Open Vial instead of 0, and the replacement vial becomes current on its first-use date. All unrelated treatment, sync, auth, role and UI behavior is unchanged. -->\n'
          if marker not in s:
              once(anchor,marker+anchor,'version comment')

          old='''function currentActualOpenedVialRecord(plan,at=new Date()){
            const today=localDateISO(at),closed=new Set(["Finished","Discarded","On hold"]);
            const opened=openedVialRecordsForPlan(plan,at).filter(item=>{
              const record=item.record||{};
              if(closed.has(String(record.status||"")))return false;
              const finish=String(record.finishDate||"").trim();
              if(finish&&today>=finish)return false;
              return true;
            });
            return opened.length?opened[opened.length-1]:null;
          }'''
          new='''function currentActualOpenedVialRecord(plan,at=new Date()){
            const today=localDateISO(at),closed=new Set(["Finished","Discarded","On hold"]);
            const scheduleRows=plan?.noCycle?currentContinuousVialScheduleRows(plan,at):currentCycleVialScheduleRows(plan,at);
            const scheduledByRecordId=new Map((scheduleRows||[]).filter(row=>row?.record?.id).map(row=>[row.record.id,row]));
            const opened=openedVialRecordsForPlan(plan,at).filter(item=>{
              const record=item.record||{};
              if(closed.has(String(record.status||"")))return false;
              const explicitFinish=String(record.finishDate||"").trim();
              if(explicitFinish&&today>=explicitFinish)return false;
              const scheduledFinish=String(scheduledByRecordId.get(record.id)?.finishDate||"").trim();
              if(!explicitFinish&&scheduledFinish&&today>scheduledFinish)return false;
              return true;
            });
            return opened.length?opened[opened.length-1]:null;
          }'''
          once(old,new,'schedule-aware actual vial finish')
          once('if(!explicitCurrent)return {valid:false,reason:plan?.noCycle?"Add/open a vial in Vial Schedule":"Open vial"};','if(!explicitCurrent)return {valid:false,reason:"Open Vial"};','shared Open Vial state')

          old_result='''  const result=(limitedBy)=>{
            let fullScheduleDays=0;
            for(const [date,count] of countedByDate){if(count>0&&count===(scheduledPartsByDate.get(date)||1))fullScheduleDays+=1}
            return {valid:true,doses,fullScheduleDays,splitSchedule,remainingMg:round(remaining,3),currentRemainingMg,nextDoseMg,expired:false,openedAt,discardAt,limitedBy,vialRecordId:explicitCurrent.record?.id||null,inventorySource:explicitCurrent.inventorySource||""};
          };'''
          new_result='''  const result=(limitedBy)=>{
            let fullScheduleDays=0;
            for(const [date,count] of countedByDate){if(count>0&&count===(scheduledPartsByDate.get(date)||1))fullScheduleDays+=1}
            if(limitedBy==="amount"&&doses===0&&foundPlanned)return {valid:false,reason:"Open Vial",pendingReplacement:true,currentRemainingMg,openedAt,discardAt,vialRecordId:explicitCurrent.record?.id||null,inventorySource:explicitCurrent.inventorySource||""};
            return {valid:true,doses,fullScheduleDays,splitSchedule,remainingMg:round(remaining,3),currentRemainingMg,nextDoseMg,expired:false,openedAt,discardAt,limitedBy,vialRecordId:explicitCurrent.record?.id||null,inventorySource:explicitCurrent.inventorySource||""};
          };'''
          once(old_result,new_result,'zero-dose replacement state')

          helper='''function automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackDate=""){
            const cursor=Math.max(0,Math.floor(Number(rowStartCursor)||0));
            const event=Array.isArray(dosePlan?.events)?dosePlan.events[cursor]:null;
            return String(event?.dateISO||fallbackDate||"");
          }
          '''
          cycle_anchor='function cycleVialScheduleComputation(plan,cycleUsage,requestedTotal=null){\n'
          if helper not in s:
              once(cycle_anchor,helper+cycle_anchor,'automatic open helper')

          once('''    const previousFinishDate=index>1&&previousFinish?parseISO(previousFinish):null;
              const calculatedOpenDate=index===1?localDateISO(dosePlan.period.start):(previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||""));
              const legacyManualOpen=!!(record&&record.scheduleOpenAuto==null&&record.startDate);''','''    const previousFinishDate=index>1&&previousFinish?parseISO(previousFinish):null;
              const rowStartCursor=cursor;
              const fallbackOpenDate=previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||"");
              const calculatedOpenDate=index===1?localDateISO(dosePlan.period.start):automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackOpenDate);
              const legacyManualOpen=!!(record&&record.scheduleOpenAuto==null&&record.startDate);''','cycle next-vial open date')
          once('''    const disposeDate=disposeAt?localDateISO(disposeAt):"";
              const rowStartCursor=cursor;
              const autoWindow=simulateCycleVialWindow''','''    const disposeDate=disposeAt?localDateISO(disposeAt):"";
              const autoWindow=simulateCycleVialWindow''','cycle duplicate cursor removal')

          once('''    const previousFinishDate=index>1&&previousFinish?parseISO(previousFinish):null;
              const calculatedOpenDate=index===1?localDateISO(dosePlan.start):(previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||""));
              const legacyManualOpen=!!(record&&record.scheduleOpenAuto==null&&record.startDate),legacyManualFinish=!!(record&&record.scheduleFinishAuto==null&&record.finishDate);''','''    const previousFinishDate=index>1&&previousFinish?parseISO(previousFinish):null;
              const rowStartCursor=cursor;
              const fallbackOpenDate=previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||"");
              const calculatedOpenDate=index===1?localDateISO(dosePlan.start):automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackOpenDate);
              const legacyManualOpen=!!(record&&record.scheduleOpenAuto==null&&record.startDate),legacyManualFinish=!!(record&&record.scheduleFinishAuto==null&&record.finishDate);''','continuous next-vial open date')
          once('''    const openDate=manualOpen?String(record.startDate||""):calculatedOpenDate;
              const disposeAt=openDate?disposeDateFromOpen(plan,parseISO(openDate)):null,disposeDate=disposeAt?localDateISO(disposeAt):"";
              const rowStartCursor=cursor,capacityMg=prep.vialMg;''','''    const openDate=manualOpen?String(record.startDate||""):calculatedOpenDate;
              const disposeAt=openDate?disposeDateFromOpen(plan,parseISO(openDate)):null,disposeDate=disposeAt?localDateISO(disposeAt):"";
              const capacityMg=prep.vialMg;''','continuous duplicate cursor removal')

          p.write_text(s,encoding='utf-8')
          sw=Path('peptide-planner-sw.js')
          sw_text=sw.read_text(encoding='utf-8')
          if sw_text.count("const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.02';")!=1:
              raise SystemExit('unexpected service worker source version')
          sw.write_text(sw_text.replace("const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.02';","const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.03';",1),encoding='utf-8')
          PY

      - name: Verify JavaScript and vial-transition invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>',s.index('<script src='))+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/planner-inline.js').write_text(s[start:end],encoding='utf-8')
          required=[
            '<title>Peptide Planner v2026.0909.03</title>',
            'const APP_VERSION="v2026.0909.03";',
            'reason:"Open Vial"',
            'pendingReplacement:true',
            'scheduledByRecordId.get(record.id)',
            '.eq("updated_at",baseline)'
          ]
          missing=[item for item in required if item not in s]
          if missing: raise SystemExit('missing required markers: '+repr(missing))
          if s.count('automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackOpenDate)')!=2:
              raise SystemExit('continuous/cycle auto-open parity missing')
          forbidden=[
            'index===1?localDateISO(dosePlan.start):(previousFinishDate?localDateISO(addDays(previousFinishDate,1))',
            'index===1?localDateISO(dosePlan.period.start):(previousFinishDate?localDateISO(addDays(previousFinishDate,1))'
          ]
          if any(item in s for item in forbidden): raise SystemExit('old day-after-finish opening logic remains')
          events=['2026-09-02','2026-09-09','2026-09-16']
          assert events[1]=='2026-09-09' and events[1]!='2026-09-03'
          assert "const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.03';" in Path('peptide-planner-sw.js').read_text()
          print('targeted replacement-vial gap validation passed')
          PY
          node --check /tmp/planner-inline.js

      - name: Commit production app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html peptide-planner-sw.js
          git commit -m 'v2026.0909.03 align pending vial transition'
          git push origin main

      - name: Export exact index
        run: cp index.html Peptide_Planner_v2026.0909.03.html

      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v2026.0909.03_index
          path: Peptide_Planner_v2026.0909.03.html
