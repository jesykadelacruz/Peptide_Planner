name: Release Peptide Planner v20261009.10
on:
  push:
    paths:
      - '.github/workflows/temp-time-alignment.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Apply mobile Time alignment only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          anchor = '''  body.mobile-app #planner .cycle-config-card[data-cycle-config="1"] .cycle-config-grid > div:nth-child(1) > .date-control,
          body.mobile-app #planner .cycle-config-card[data-cycle-config="1"] .cycle-config-grid > div:nth-child(2) > input[data-cycle-config-field="injectionTime"]{
            margin-top:auto!important;
          }'''
          addition = anchor + '''
          body.mobile-app #planner .cycle-config-card[data-cycle-config="1"] .cycle-config-grid > div:nth-child(2) > input[data-cycle-config-field="injectionTime"]{
            transform:translateY(5px)!important;
          }'''
          assert text.count(anchor) == 1
          assert text.count("Peptide_Planner_v20261009.09") == 2
          text = text.replace(anchor, addition)
          text = text.replace("Peptide_Planner_v20261009.09", "Peptide_Planner_v20261009.10")
          path.write_text(text, encoding="utf-8")
          sw = Path("peptide-planner-sw.js")
          sw_text = sw.read_text(encoding="utf-8")
          assert sw_text.count("Peptide_Planner_v20261009.09") == 1
          sw.write_text(sw_text.replace("Peptide_Planner_v20261009.09", "Peptide_Planner_v20261009.10"), encoding="utf-8")
          PY
      - name: Validate exact scope
        shell: bash
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html peptide-planner-sw.js "
          git diff --check
          node --check peptide-planner-sw.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          [...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].forEach(m=>new Function(m[1]));
          if(!s.includes('<title>Peptide_Planner_v20261009.10</title>'))throw new Error('title mismatch');
          if(!s.includes('const APP_VERSION="Peptide_Planner_v20261009.10";'))throw new Error('APP_VERSION mismatch');
          const rule='body.mobile-app #planner .cycle-config-card[data-cycle-config="1"] .cycle-config-grid > div:nth-child(2) > input[data-cycle-config-field="injectionTime"]{\n    transform:translateY(5px)!important;\n  }';
          if(!s.includes(rule))throw new Error('mobile Time alignment rule missing');
          console.log('mobile Time-only CSS and inline JavaScript checks passed');
          NODE
          cmp --silent _headers <(git show HEAD^:_headers)
          cmp --silent manifest.webmanifest <(git show HEAD^:manifest.webmanifest)
      - name: Commit production release
        shell: bash
        run: |
          git rm .github/workflows/temp-time-alignment.yml
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html peptide-planner-sw.js
          git commit -m "Peptide_Planner_v20261009.10"
          git push origin HEAD:main
      - name: Build Cloudflare package
        shell: bash
        run: |
          mkdir -p release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          (cd release && zip -q ../Peptide_Planner_v20261009.10.zip _headers index.html manifest.webmanifest peptide-planner-sw.js)
          unzip -t Peptide_Planner_v20261009.10.zip
          test "$(unzip -Z1 Peptide_Planner_v20261009.10.zip | sort | tr '\n' ' ')" = "_headers index.html manifest.webmanifest peptide-planner-sw.js "
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.10
          path: |
            Peptide_Planner_v20261009.10.zip
            release/_headers
            release/index.html
            release/manifest.webmanifest
            release/peptide-planner-sw.js
          if-no-files-found: error
