name: Patch Cycle Settings schedule options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cycle-schedule-options.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Cycle Settings schedule selector
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = 'function renderContinuousPlanPanel(plan){'
          helper = '''function cycleSchedulePresetValue(config){
  if(config?.scheduleMode==="interval"){
    const days=Math.max(1,Math.floor(num(config?.intervalDays)||0));
    if(days===2)return "every-other-day";
    if(days===7)return "weekly";
    return "manual-interval";
  }
  const days=[...new Set((config?.weekdays||[]).map(Number).filter(day=>day>=0&&day<=6))].sort((a,b)=>a-b);
  if(plannerArraysEqual(days,[0,1,2,3,4,5,6]))return "daily";
  if(plannerArraysEqual(days,[1,2,3,4,5]))return "weekdays";
  if(plannerArraysEqual(days,[1,3,5]))return "mwf";
  return "manual-weekdays";
}
function cycleSchedulePresetOptions(config){
  const selected=cycleSchedulePresetValue(config);
  return [["every-other-day","Every 2 days"],["weekly","Every 7 days"],["daily","Daily"],["weekdays","Weekdays"],["mwf","Mon / Wed / Fri"],["manual-interval","Custom interval"],["manual-weekdays","Choose weekdays"]].map(([value,label])=>`<option value="${value}" ${selected===value?"selected":""}>${label}</option>`).join("");
}
function applyCycleSchedulePreset(config,preset){
  if(!config)return;
  const phases=Array.isArray(config.phases)?config.phases:[];
  if(preset==="every-other-day"||preset==="weekly"||preset==="manual-interval"){
    const interval=preset==="every-other-day"?2:preset==="weekly"?7:Math.max(1,Math.floor(num(config.intervalDays)||7));
    config.scheduleMode="interval";config.intervalDays=interval;config.weekdays=[];
    phases.forEach(phase=>{phase.weekdays=[];phase.intervalDays=interval;});
    return;
  }
  const presetDays=preset==="daily"?[0,1,2,3,4,5,6]:preset==="weekdays"?[1,2,3,4,5]:preset==="mwf"?[1,3,5]:null;
  config.scheduleMode="weekdays";config.intervalDays="";
  if(presetDays){
    config.weekdays=clone(presetDays);
    phases.forEach(phase=>{phase.weekdays=clone(presetDays);phase.intervalDays="";});
  }else{
    const retained=[...new Set((config.weekdays||[]).map(Number).filter(day=>day>=0&&day<=6))].sort((a,b)=>a-b);
    config.weekdays=retained;
    phases.forEach(phase=>{phase.intervalDays="";if(!Array.isArray(phase.weekdays))phase.weekdays=clone(retained);});
  }
}

'''
          if helper not in s:
              if marker not in s:
                  raise SystemExit('renderContinuousPlanPanel marker not found')
              s = s.replace(marker, helper + marker, 1)

          old_cont = '''<div><label>Schedule</label><select data-cycle-config-field="scheduleMode" data-cycle-sequence="0"><option value="interval" ${plan.scheduleMode!=="weekdays"?"selected":""}>Every N days</option><option value="weekdays" ${plan.scheduleMode==="weekdays"?"selected":""}>Choose weekdays</option></select></div>
              <div><label>Interval</label><input type="number" min="1" step="1" data-cycle-config-field="intervalDays" data-cycle-sequence="0" value="${esc(plan.intervalDays??"")}" ${plan.scheduleMode==="weekdays"?"disabled":""}></div>'''
          new_cont = '''<div><label>Schedule</label><select data-cycle-schedule-preset data-cycle-sequence="0">${cycleSchedulePresetOptions(plan)}</select></div>
              <div><label>Interval</label><input type="number" min="1" step="1" data-cycle-config-field="intervalDays" data-cycle-sequence="0" value="${esc(plan.intervalDays??"")}" ${cycleSchedulePresetValue(plan)==="manual-interval"?"":"disabled"}></div>'''
          if old_cont not in s:
              raise SystemExit('continuous schedule block not found')
          s = s.replace(old_cont, new_cont, 1)

          old_cycle = '''<div><label>Schedule</label><select data-cycle-config-field="scheduleMode" data-cycle-sequence="${sequence}"><option value="interval" ${config.scheduleMode!=="weekdays"?"selected":""}>Every N days</option><option value="weekdays" ${config.scheduleMode==="weekdays"?"selected":""}>Choose weekdays</option></select></div>
            <div><label>Interval</label><input type="number" min="1" step="1" data-cycle-config-field="intervalDays" data-cycle-sequence="${sequence}" value="${esc(config.intervalDays??"")}" ${config.scheduleMode==="weekdays"?"disabled":""}></div>'''
          new_cycle = '''<div><label>Schedule</label><select data-cycle-schedule-preset data-cycle-sequence="${sequence}">${cycleSchedulePresetOptions(config)}</select></div>
            <div><label>Interval</label><input type="number" min="1" step="1" data-cycle-config-field="intervalDays" data-cycle-sequence="${sequence}" value="${esc(config.intervalDays??"")}" ${cycleSchedulePresetValue(config)==="manual-interval"?"":"disabled"}></div>'''
          if old_cycle not in s:
              raise SystemExit('cycled schedule block not found')
          s = s.replace(old_cycle, new_cycle, 1)

          old_handler = '''    card.querySelectorAll("[data-cycle-config-weekday]").forEach(control=>control.addEventListener("change",()=>{'''
          new_handler = '''    card.querySelectorAll("[data-cycle-schedule-preset]").forEach(control=>control.addEventListener("change",()=>{
      const rawSequence=Number(control.dataset.cycleSequence),sequence=plan.noCycle&&rawSequence===0?0:Math.max(1,rawSequence||1),config=cycleConfigForSequence(plan,sequence);if(!config)return;
      applyCycleSchedulePreset(config,control.value);
      if(sequence===1)syncLegacyPlanFromCycleConfigs(plan);recalculateConfiguredCycleStarts(plan);syncLegacyPlanFromCycleConfigs(plan);plan.confirmed=false;save();renderAll();
    }));
    card.querySelectorAll("[data-cycle-config-weekday]").forEach(control=>control.addEventListener("change",()=>{'''
          if new_handler not in s:
              if old_handler not in s:
                  raise SystemExit('cycle handler insertion point not found')
              s = s.replace(old_handler, new_handler, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'data-cycle-schedule-preset' index.html
          grep -q 'Every 2 days' index.html
          grep -q 'Every 7 days' index.html
          grep -q 'Mon / Wed / Fri' index.html
          grep -q 'Custom interval' index.html
          grep -q 'Choose weekdays' index.html

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-cycle-schedule-options.yml
          git config user.name 'ChatGPT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/patch-cycle-schedule-options.yml
          git commit -m 'Update Cycle Settings schedule options'
          git push
