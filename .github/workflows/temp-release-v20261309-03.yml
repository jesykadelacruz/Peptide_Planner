name: Temporary Release Peptide_Planner_v20261309.03

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Temporary release workflow for Peptide_Planner_v20261309.03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify, patch, validate and release
        shell: bash
        run: |
          set -euo pipefail
          BASE='e5941cd995771c6a6d9fd5fc10178d278e46455b'
          RELEASE='Peptide_Planner_v20261309.03'
          WORKFLOW='.github/workflows/temp-release-v20261309-03.yml'
          PAYLOAD='.release/release3_u0.patch'
          test "$(git rev-parse HEAD^^)" = "$BASE"
          test "$(git hash-object index.html)" = 'd41eecfb2858926d411f4c543cbdc7e6aab204b8'
          test "$(git hash-object peptide-planner-sw.js)" = '54b20f77ced33136984ccd14dc7ac7018f3406cf'
          test "$(git hash-object _headers)" = 'a0275ab160f15998a7698128b6e2ee7676a1a62d'
          git apply --unidiff-zero -p2 "$PAYLOAD"
          python - <<'PYCODE'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text('\n'.join(x for x in scripts if x.strip()))
          PYCODE
          node --check /tmp/planner-inline.js
          node --check peptide-planner-sw.js
          git diff --check
          test "$(git hash-object index.html)" = '0f4bcd9411c0823bac3c4bf175122b1d3f5cb313'
          test "$(git hash-object peptide-planner-sw.js)" = '950e2661cc2580234f37e2b77cad9ec9ec14b5d2'
          test "$(git hash-object _headers)" = '4523d690440b8ca021ca9b6f0a0460f8f34181cb'
          git rm "$WORKFLOW" "$PAYLOAD"
          git add index.html peptide-planner-sw.js _headers
          mapfile -t CHANGED < <(git diff --name-only "$BASE" -- | sort)
          printf '%s\n' 'Net changed files from Release 2.1 baseline:' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 3
          test "${CHANGED[0]}" = '_headers'
          test "${CHANGED[1]}" = 'index.html'
          test "${CHANGED[2]}" = 'peptide-planner-sw.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE"
          git push origin HEAD:main
