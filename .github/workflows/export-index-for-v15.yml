name: Export current index for v15 sync

on:
  push:
    paths:
      - '.github/workflows/export-index-for-v15.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Show current index identity
        run: |
          sha256sum index.html
          wc -c index.html
          grep -m1 -E '<title>Peptide Planner|APP_VERSION=' index.html || true
      - name: Upload current index
        uses: actions/upload-artifact@v4
        with:
          name: current-index-before-v15
          path: index.html
          if-no-files-found: error
          retention-days: 1
