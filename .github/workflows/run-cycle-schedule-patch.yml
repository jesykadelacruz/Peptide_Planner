name: Run Cycle Settings schedule patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-cycle-schedule-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated schedule patch
        run: |
          python - <<'PY'
          import re, base64
          from pathlib import Path
          wf = Path('.github/workflows/patch-cycle-schedule-options.yml').read_text(encoding='utf-8')
          m = re.search(r"b64decode\('([^']+)'\)", wf)
          if not m:
              raise SystemExit('Encoded patch payload not found')
          exec(base64.b64decode(m.group(1)))
          PY
      - name: Validate patched source
        run: |
          grep -q 'data-cycle-schedule-preset' index.html
          grep -q 'Every 2 days' index.html
          grep -q 'Every 7 days' index.html
          grep -q 'Daily' index.html
          grep -q 'Weekdays' index.html
          grep -q 'Mon / Wed / Fri' index.html
          grep -q 'Custom interval' index.html
          grep -q 'Choose weekdays' index.html
      - name: Commit safely
        run: |
          git config user.name 'ChatGPT Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Cycle Settings schedule options'
          git pull --rebase origin main
          git push origin main
