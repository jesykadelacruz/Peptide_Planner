name: Export v2026.0709.10 index

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0709-10.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify current build
        run: |
          grep -F '<title>Peptide Planner v2026.0709.10</title>' index.html
          grep -F 'phaseWeekdaysForWeek(plan,week)' index.html
          if grep -F '${vialIntegrity.warnings.length?' index.html; then exit 1; fi
          grep -F 'administrationMatchesScheduledStructure(plan,record)' index.html
      - name: Prepare standalone HTML
        run: cp index.html Peptide_Planner_v2026.0709.10.html
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v2026.0709.10_index
          path: Peptide_Planner_v2026.0709.10.html
