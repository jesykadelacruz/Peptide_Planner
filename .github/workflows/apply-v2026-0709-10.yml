name: Apply v2026.0709.10 targeted patch

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0709-10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html only
        run: echo '' | base64 -d | python
      - name: Verify targeted patch
        run: |
          grep -F '<title>Peptide Planner v2026.0709.10</title>' index.html
          grep -F 'phaseDays||plan.weekdays||[]' index.html
          if grep -F 'historical auto-completion record${obsolete.length===1?' index.html; then exit 1; fi
          grep -F 'administrationMatchesScheduledStructure(plan,record)' index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v2026.0709.10 show custom schedule days and hide legacy vial warning'
          git push origin main
      - name: Build deliverables
        run: |
          mkdir -p deliverables/cloudflare
          cp index.html deliverables/Peptide_Planner_v2026.0709.10.html
          cp index.html deliverables/cloudflare/index.html
          for f in _headers manifest.webmanifest peptide-planner-sw.js; do cp "$f" deliverables/cloudflare/; done
          cd deliverables/cloudflare
          zip -q ../Peptide_Planner_v2026.0709.10_Cloudflare.zip index.html _headers manifest.webmanifest peptide-planner-sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v2026.0709.10_deliverables
          path: |
            deliverables/Peptide_Planner_v2026.0709.10.html
            deliverables/Peptide_Planner_v2026.0709.10_Cloudflare.zip
