name: Apply Peptide Planner v2026.0709.10

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0709-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify current production source
        run: |
          test "$(git hash-object index.html)" = "440d10dbc9b6fb8257a9680333b182605006a341"
          test "$(git hash-object peptide-planner-sw.js)" = "b1ce1e1fb4fa2e4fce120d3b9d4a1804eabc1f78"

      - name: Apply overview and warning fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()

          old='<title>Peptide Planner v2026.0709.09</title>'
          new='''<title>Peptide Planner v2026.0709.10</title>
          <!-- v2026.0709.10: Custom weekday schedules in the Overview now use the active continuous dose-phase schedule first (for example Saturday or Tuesday / Thursday). The visible historical auto-completion Vial inventory check diagnostic is removed while obsolete records remain excluded from vial-consumption calculations. -->'''
          if text.count(old)!=1: raise SystemExit('Unexpected v09 title marker count')
          text=text.replace(old,new,1)

          old='const APP_VERSION="v2026.0709.09";'
          new='const APP_VERSION="v2026.0709.10";'
          if text.count(old)!=1: raise SystemExit('Unexpected APP_VERSION marker count')
          text=text.replace(old,new,1)

          old='''function overviewScheduleText(plan,at=new Date()){
            const fullDayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],formatDays=days=>{const clean=[...new Set((days||[]).map(Number).filter(day=>day>=0&&day<=6))].sort((a,b)=>a-b);if(plannerArraysEqual(clean,[0,1,2,3,4,5,6]))return "Daily";if(plannerArraysEqual(clean,[1,2,3,4,5]))return "Weekdays";return clean.length?clean.map(day=>fullDayNames[day]).join(" / "):"Days not set";};
            if(plan.noCycle){if(plan.scheduleMode==="interval")return num(plan.intervalDays)?`Every ${Number(plan.intervalDays)} days`:"Interval not set";return formatDays(plan.weekdays||[]);}
            const config=cycleConfigForSequence(plan,1);if(!config)return "Cycle schedule not set";
            const phaseDays=cyclePhaseWeekdays(config,1);if(phaseDays!==null)return formatDays(phaseDays);const phaseInterval=cyclePhaseInterval(config,1);if(phaseInterval)return `Every ${phaseInterval} day${phaseInterval===1?"":"s"}`;return cycleScheduleLabel(config);
          }'''.replace('          ','')
          new='''function overviewScheduleText(plan,at=new Date()){
            const fullDayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],formatDays=days=>{const clean=[...new Set((days||[]).map(Number).filter(day=>day>=0&&day<=6))].sort((a,b)=>a-b);if(plannerArraysEqual(clean,[0,1,2,3,4,5,6]))return "Daily";if(plannerArraysEqual(clean,[1,2,3,4,5]))return "Weekdays";return clean.length?clean.map(day=>fullDayNames[day]).join(" / "):"Days not set";};
            if(plan.noCycle){
              const start=parseISO(plan?.startDate),day=new Date(at.getFullYear(),at.getMonth(),at.getDate()),week=start&&day>=start?Math.max(1,Math.floor(dayDiff(start,day)/7)+1):1;
              const phaseDays=phaseWeekdaysForWeek(plan,week);if(phaseDays!==null)return formatDays(phaseDays);
              const phaseInterval=phaseIntervalDaysForWeek(plan,week);if(phaseInterval!=null)return `Every ${phaseInterval} day${phaseInterval===1?"":"s"}`;
              if(plan.scheduleMode==="interval")return num(plan.intervalDays)?`Every ${Number(plan.intervalDays)} days`:"Interval not set";
              return formatDays(plan.weekdays||[]);
            }
            const config=cycleConfigForSequence(plan,1);if(!config)return "Cycle schedule not set";
            const phaseDays=cyclePhaseWeekdays(config,1);if(phaseDays!==null)return formatDays(phaseDays);const phaseInterval=cyclePhaseInterval(config,1);if(phaseInterval)return `Every ${phaseInterval} day${phaseInterval===1?"":"s"}`;return cycleScheduleLabel(config);
          }'''.replace('          ','')
          if text.count(old)!=1: raise SystemExit('Unexpected overviewScheduleText marker count')
          text=text.replace(old,new,1)

          old='    const vialIntegrity=currentVialIntegrity(plan,new Date());\n'
          if text.count(old)!=1: raise SystemExit('Unexpected vialIntegrity variable marker count')
          text=text.replace(old,'',1)

          old='      ${vialIntegrity.warnings.length?`<div class="alert warn"><strong>Vial inventory check</strong><div style="margin-top:5px">${vialIntegrity.warnings.map(item=>esc(item)).join("<br>")}</div></div>`:""}\n'
          if text.count(old)!=1: raise SystemExit('Unexpected visible Vial inventory check marker count')
          text=text.replace(old,'',1)
          p.write_text(text)

          sw=Path('peptide-planner-sw.js')
          sw_text=sw.read_text()
          old="const PEPTIDE_PLANNER_SW_VERSION='v2026.0709.09';"
          new="const PEPTIDE_PLANNER_SW_VERSION='v2026.0709.10';"
          if sw_text.count(old)!=1: raise SystemExit('Unexpected service-worker version marker count')
          sw.write_text(sw_text.replace(old,new,1))
          PY

      - name: Validate patch
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'index.html\npeptide-planner-sw.js'
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          required=[
            '<title>Peptide Planner v2026.0709.10</title>',
            'const APP_VERSION="v2026.0709.10";',
            'const phaseDays=phaseWeekdaysForWeek(plan,week);if(phaseDays!==null)return formatDays(phaseDays);',
            'const phaseInterval=phaseIntervalDaysForWeek(plan,week);',
            'administrationMatchesScheduledStructure(plan,item.record)',
            'function cycleSchedulePresetOptions(config)',
            'SUPABASE_URL=',
            'auth.signInWithPassword',
            'auth.resetPasswordForEmail'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing markers: '+repr(missing))
          if '<strong>Vial inventory check</strong>' in text: raise SystemExit('Visible Vial inventory check still present')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/app.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/app.js

      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html peptide-planner-sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Peptide Planner v2026.0709.10"
          git push origin HEAD:main
