name: Peptide Planner v20261009.05 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20261009-05.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply linked split persistence fix
        run: python .deploy/apply_v20261009_05_linked_split.py
      - name: Validate requested scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          BASE='e5242aef06a67788b26124b9e045dec3ea123ddf'
          old=subprocess.check_output(['git','show',f'{BASE}:index.html'],text=True)
          new=Path('index.html').read_text()
          assert '<title>Peptide_Planner_v20261009.05</title>' in new
          assert 'const APP_VERSION="Peptide_Planner_v20261009.05";' in new
          assert Path('peptide-planner-sw.js').read_text().startswith("const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.05';")
          styles=lambda s: re.findall(r'<style[^>]*>(.*?)</style>',s,re.S)
          assert styles(old)==styles(new),'CSS changed unexpectedly'
          assert 'function syncCycleDoseScheduleLinkedEdit(plan,sequence,phaseIndex,row,source,control)' in new
          assert 'Object.assign(livePhase,updates)' in new
          assert 'updates.doseEntryMode="units";updates.splitUnits=raw;' in new
          assert 'plan.confirmed=false;save();' in new
          assert 'livePhase.splitUnits=splitUnits' in new
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',new,re.S)
          assert scripts
          for i,js in enumerate(scripts):
              p=Path(f'/tmp/pp-v05-script-{i}.js');p.write_text(js);subprocess.run(['node','--check',str(p)],check=True)
          subprocess.run(['node','--check','peptide-planner-sw.js'],check=True)
          PY
          git diff --check
      - name: Test Dose Units and custom split persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text()
          def fn(name):
              m=re.search(r'function '+re.escape(name)+r'\([^\)]*\)\{',src);assert m,name
              i=m.start();k=m.end();depth=1
              while k<len(src) and depth:
                  if src[k]=='{':depth+=1
                  elif src[k]=='}':depth-=1
                  k+=1
              return src[i:k]
          code=r'''
          function clone(v){return JSON.parse(JSON.stringify(v));}
          function num(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null;}
          function round(v,d=2){const p=10**d;return Math.round((Number(v)+Number.EPSILON)*p)/p;}
          function enteredPlanNumber(v){return num(v);}
          function simplePhaseSplitParts(phase){if(!phase?.splitDose)return 1;return Math.max(2,Math.min(10,Math.floor(num(phase.splitParts)||2)));}
          function distributeSplitUnits(totalUnits,parts){const total=num(totalUnits),count=Math.max(1,Math.floor(num(parts)||1));if(total==null||total<0)return Array.from({length:count},()=>"");const regular=round(total/count,2);let used=0;return Array.from({length:count},(_,index)=>{const value=index===count-1?round(total-used,2):regular;used=round(used+value,2);return value;});}
          function cycleConfigForSequence(plan,sequence){plan.cycleConfigs=clone(plan.cycleConfigs);return plan.cycleConfigs[sequence-1];}
          function cyclePhaseReferenceDate(plan,config,phase,sequence){cycleConfigForSequence(plan,sequence);return null;}
          function phaseUnitsFromDose(plan,dose,date,sequence){cycleConfigForSequence(plan,sequence);return round(Number(dose)*10,2);}
          function phaseDoseFromUnits(plan,units,date,sequence){cycleConfigForSequence(plan,sequence);return round(Number(units)/10,6);}
          function inferPhaseDoseEntryMode(plan,phase){cycleConfigForSequence(plan,1);return phase.doseEntryMode||'dose';}
          function syncLegacyPlanFromCycleConfigs(plan){plan.phases=clone(plan.cycleConfigs[0].phases);}
          '''+fn('syncCycleDoseScheduleLinkedEdit')+'\n'+fn('syncCyclePhaseCalculationsForSequence')+r'''
          const plan={cycleConfigs:[{phases:[{doseMg:1,units:10,splitDose:true,splitParts:2,splitUnits:[5,5],doseEntryMode:'dose'}]}]};
          const dose={value:'1'},units={value:'10'},split1={value:'5'},split2={value:'5'};
          const row={querySelector(sel){if(sel.includes('doseMg'))return dose;if(sel.includes('phase-units'))return units;return null;},querySelectorAll(sel){return sel.includes('phase-split-unit')?[split1,split2]:[];}};
          units.value='12';syncCycleDoseScheduleLinkedEdit(plan,1,0,row,'units',units);
          let p=plan.cycleConfigs[0].phases[0];
          if(p.units!==12||p.doseMg!==1.2||p.splitUnits[0]!==6||p.splitUnits[1]!==6||p.doseEntryMode!=='units')throw new Error('Units edit did not persist '+JSON.stringify(p));
          split1.value='3';split2.value='7';syncCycleDoseScheduleLinkedEdit(plan,1,0,row,'split',split2);
          p=plan.cycleConfigs[0].phases[0];
          if(p.units!==10||p.doseMg!==1||p.splitUnits[0]!==3||p.splitUnits[1]!==7||p.doseEntryMode!=='units')throw new Error('3/7 split did not persist '+JSON.stringify(p));
          syncCyclePhaseCalculationsForSequence(plan,1);p=plan.cycleConfigs[0].phases[0];
          if(p.units!==10||p.splitUnits[0]!==3||p.splitUnits[1]!==7)throw new Error('Custom split lost on sequence recalc '+JSON.stringify(p));
          dose.value='2';syncCycleDoseScheduleLinkedEdit(plan,1,0,row,'dose',dose);p=plan.cycleConfigs[0].phases[0];
          if(p.doseMg!=='2'||p.units!==20||p.splitUnits[0]!==10||p.splitUnits[1]!==10||p.doseEntryMode!=='dose')throw new Error('Dose edit linkage failed '+JSON.stringify(p));
          console.log('Dose/Units/custom split persistence tests passed');
          '''
          Path('/tmp/v05-linked-test.js').write_text(code)
          PY
          node /tmp/v05-linked-test.js
      - name: Remove temporary release files and validate final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .deploy/apply_v20261009_05_linked_split.py .github/workflows/chatgpt-v20261009-05.yml
          changed="$(git diff --name-only e5242aef06a67788b26124b9e045dec3ea123ddf -- | sort)"
          expected=$'index.html\npeptide-planner-sw.js'
          test "$changed" = "$expected"
          git diff --check
      - name: Commit production release
        run: |
          git config user.name 'jesykadelacruz'
          git config user.email '84807985+jesykadelacruz@users.noreply.github.com'
          git add index.html peptide-planner-sw.js
          git commit -m 'Peptide_Planner_v20261009.05'
          git push origin HEAD:main
      - name: Build Cloudflare production ZIP
        shell: bash
        run: |
          mkdir -p release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          cd release
          zip -9 ../Peptide_Planner_v20261009.05.zip _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd ..
          unzip -t Peptide_Planner_v20261009.05.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('Peptide_Planner_v20261009.05.zip')
          assert sorted(z.namelist())==sorted(['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']),z.namelist()
          print('Cloudflare ZIP root validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.05
          path: Peptide_Planner_v20261009.05.zip
          if-no-files-found: error
