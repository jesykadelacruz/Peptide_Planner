name: Apply Peptide Planner v2026.0209.010 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-010.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "b87e23554a3b7b49e0d78380423230003b8a994b17ce0c21c7e91c8e23869a8e  index.html" | sha256sum -c -

      - name: Apply exact v2026.0209.010 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_010.patch.xz.b64 | xz -d > /tmp/v010.patch
          patch --batch --forward -p0 < /tmp/v010.patch
          echo "5c2e3c100f0a9c2371339b3ea908c8eaf383cd29183c1db593c43c9e29d8d2b0  index.html" | sha256sum -c -

      - name: Validate exact target and protected functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=[
            'Peptide Planner v2026.0209.010',
            'const APP_VERSION="v2026.0209.010";',
            '<span>Dose (units)</span>',
            '<span>Dose left in vial</span>',
            '<span>Vials per cycle</span>',
            '<span>Cycle count</span>',
            '<span>Current cycle</span>',
            'data-open-next-vial',
            'data-plan-active-weeks',
            'data-plan-break-weeks',
            'planner_notification_preferences',
            'planner_push_subscriptions',
            'planner_notification_queue',
            'Send test notification',
            'Reactivate',
            'data-dashboard-injection',
            'Review &amp; verify'
          ]
          for marker in required:
              assert marker in s, marker
          assert '<span>Cycle usage</span>' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/planner-inline.js

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.010"
          git push origin HEAD:main
