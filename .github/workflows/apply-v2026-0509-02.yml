# exact production patch generated from the live index and the requested v2026.0509.01 download baseline
name: Apply and Deploy Peptide Planner v2026.0509.02

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0509-02.yml'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: peptide-planner-production
  cancel-in-progress: true

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v2026.0509.02 production patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '<title>Peptide Planner v2026.0509.02</title>' index.html; then
            echo 'v2026.0509.02 is already applied'
          else
            cat .deploy/v2026_0509_02_patch_part1.b64 .deploy/v2026_0509_02_patch_part2.b64 .deploy/v2026_0509_02_patch_part3.b64 .deploy/v2026_0509_02_patch_part4.b64 | base64 -d | gunzip > /tmp/v2026_0509_02.patch
            test "$(wc -c < /tmp/v2026_0509_02.patch)" -eq 23590
            git apply --check /tmp/v2026_0509_02.patch
            git apply /tmp/v2026_0509_02.patch
          fi

      - name: Validate production file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          h=Path('index.html').read_text()
          required=[
            '<title>Peptide Planner v2026.0509.02</title>',
            'const APP_VERSION="v2026.0509.02";',
            'data-cycle-config-field="endDate" data-cycle-sequence="0"',
            'function continuousCurrentCycleText',
            'function todayAdministrationMissed',
            'today-injection-missed',
            'signInWithPassword',
            'resetPasswordForEmail',
            'PASSWORD_RECOVERY',
            'planner_state',
            'planner_snapshots',
          ]
          missing=[m for m in required if m not in h]
          if missing:
              raise SystemExit('Feature validation failed: '+', '.join(missing))
          if re.search(r'service_role|SUPABASE_SECRET_KEY',h,re.I):
              raise SystemExit('Secret key marker found in client')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text(max(scripts,key=len))
          sha=hashlib.sha256(h.encode()).hexdigest()
          print('SHA256',sha)
          print('index.html bytes',len(h.encode()))
          if sha!='244f0fc589472173f7d712a77390247e25237beb92deab304eeb2ea03eba1417':
              raise SystemExit('Production output does not match tested v2026.0509.02 artifact')
          PY
          node --check /tmp/planner-inline.js

      - name: Commit synchronized production app
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index change to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Update Peptide Planner v2026.0509.02'
            git push
          fi

      - name: Build Cloudflare Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/index.html
          cat > dist/_headers <<'EOF'
          /*
            Cache-Control: no-store, no-cache, must-revalidate, max-age=0
            Pragma: no-cache
            Expires: 0
          EOF

      - name: Deploy v2026.0509.02 to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
