name: Apply Peptide Planner v2026.0509.07

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0509-07.yml'
      - '.deploy/v2026.0509.07.corrected.1.patch'
      - '.deploy/v2026.0509.07.corrected.2.patch'
      - '.deploy/v2026.0509.07.corrected.3.patch'
      - '.deploy/v2026.0509.07.corrected.4.patch'
      - '.deploy/v2026.0509.07.corrected.5.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact production patches
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='ca2a1dff0186034f73b3283cb89536c234b962ba1cabd2a17fe157e027334140'
          if grep -Fq '<title>Peptide Planner v2026.0509.07</title>' index.html; then
            echo 'v2026.0509.07 is already applied; skipping patches.'
          else
            ACTUAL_SOURCE="$(sha256sum index.html | awk '{print $1}')"
            echo "Expected source SHA256: $SOURCE_SHA"
            echo "Actual source SHA256:   $ACTUAL_SOURCE"
            test "$ACTUAL_SOURCE" = "$SOURCE_SHA"
            for patch in \
              .deploy/v2026.0509.07.corrected.1.patch \
              .deploy/v2026.0509.07.corrected.2.patch \
              .deploy/v2026.0509.07.corrected.3.patch \
              .deploy/v2026.0509.07.corrected.4.patch \
              .deploy/v2026.0509.07.corrected.5.patch; do
              git apply --check "$patch"
              git apply "$patch"
            done
          fi

      - name: Validate production file
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='af53577eb805c7b3893c74671e74385969670de3675e49c6bb6abacbdd94cd50'
          ACTUAL_SHA="$(sha256sum index.html | awk '{print $1}')"
          echo "Expected SHA256: $EXPECTED_SHA"
          echo "Actual SHA256:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          grep -Fq '<title>Peptide Planner v2026.0509.07</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.0509.07";' index.html
          grep -Fq 'continuousVialPrepForDate' index.html
          grep -Fq 'num(selected.finalMl||selected.bacWaterMl)' index.html
          grep -Fq 'num(record.finalMl||record.bacWaterMl)' index.html
          grep -Fq '<th>Vial #</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Open</th><th>Finish</th><th>Status</th>' index.html
          grep -Fq 'data-continuous-vial-field' index.html
          grep -Fq 'mg left' index.html
          grep -Fq 'CLOUD_SYNC_META_KEY' index.html
          grep -Fq 'SUPABASE_URL' index.html
          grep -Fq 'auth.signInWithPassword' index.html
          grep -Fq 'auth.resetPasswordForEmail' index.html
          grep -Fq 'signUp' index.html
          grep -Fq 'manifest.webmanifest' index.html
          grep -Fq 'peptide-planner-sw.js' index.html
          grep -Fq 'navigator.serviceWorker.register' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I))
          Path('/tmp/peptide-inline.js').write_text(scripts,encoding='utf-8')
          # Live Tirzepatide legacy-prep regression: finalMl 3.75 must win over stale bacWaterMl 30.
          vial=15.0; final_ml=3.75; actual_units=[75,75,75,75]; upm=100.0
          concentration=vial/final_ml
          used=sum((u/upm)*concentration for u in actual_units)
          remaining=vial-used
          assert concentration == 4.0 and used == 12.0 and remaining == 3.0
          PY
          node --check /tmp/peptide-inline.js

      - name: Commit synchronized production app
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No production file change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Peptide Planner v2026.0509.07'
          git push origin HEAD:main
