name: Apply Peptide Planner v2026.0409.03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0409-03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded v2026.0409.03 patch
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA256='876e898792bf656b652dd5866f32094447539e469b852f35b5ee65316605228f'
          TARGET_SHA256='c7ca7ee4f0ad925f51d19422a16cefc1e13bfa53516570da058d1b254897b1e9'
          TARGET_BYTES='2384280'
          PAYLOAD='.deploy/v2026_0409_03.patch.xz.b64'
          PAYLOAD_SHA256='410eb3eece4f56edb7358a6e2beeded83d59ca8834d8c231241828dfdaa4f971'
          PATCH_SHA256='1962d49d430b7a85e228b78b5566079138f27fb9b698e536ddd9195d0b28bba7'

          current="$(sha256sum index.html | awk '{print $1}')"
          if [ "$current" = "$TARGET_SHA256" ]; then
            echo 'index.html is already v2026.0409.03'
            exit 0
          fi
          if [ "$current" != "$BASE_SHA256" ]; then
            echo "Refusing to patch unexpected index.html baseline: $current"
            exit 1
          fi

          test "$(wc -c < "$PAYLOAD")" -eq 5376
          echo "$PAYLOAD_SHA256  $PAYLOAD" | sha256sum -c -
          base64 -d "$PAYLOAD" | xz -d > /tmp/v2026.0409.03.patch
          echo "$PATCH_SHA256  /tmp/v2026.0409.03.patch" | sha256sum -c -

          patch --dry-run -p1 < /tmp/v2026.0409.03.patch
          patch -p1 < /tmp/v2026.0409.03.patch

          test "$(sha256sum index.html | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(wc -c < index.html)" -eq "$TARGET_BYTES"
          grep -Fq '<title>Peptide Planner v2026.0409.03</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.0409.03";' index.html
          grep -Fq 'function showFirstTimeOrientation(stepIndex=0)' index.html
          grep -Fq 'onboardingIntroComplete:false' index.html
          grep -Fq 'Account → Help & Setup' index.html
          grep -Fq 'activateTab("safety")' index.html

          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,re.I)
          if len(scripts)!=1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/index-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit v2026.0409.03
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Peptide Planner v2026.0409.03'
          git push origin HEAD:main
