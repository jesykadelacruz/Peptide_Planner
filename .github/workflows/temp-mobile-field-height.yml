name: Temporary mobile field height release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-mobile-field-height.yml

permissions:
  contents: write
  deployments: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare Peptide_Planner_v20261009.12 mobile field height release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard release baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "61ace55b378a6d8cc6f43038fa7f8d0165cc51dd"
          test "$(git log -1 --pretty=%s HEAD^)" = "Peptide_Planner_v20261009.11"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp-mobile-field-height.yml"
          grep -Fq '<title>Peptide_Planner_v20261009.11</title>' index.html
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261009.11";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.11';" peptide-planner-sw.js

      - name: Apply only the requested mobile height change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import subprocess

          patch_b64 = ""
          subprocess.run(
              ["git", "apply", "--whitespace=nowarn", "-"],
              input=base64.b64decode(patch_b64),
              check=True,
          )
          PY

      - name: Validate exact scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          version = "Peptide_Planner_v20261009.12"
          html = Path("index.html").read_text()
          sw = Path("peptide-planner-sw.js").read_text()
          assert f"<title>{version}</title>" in html
          assert f'const APP_VERSION="{version}";' in html
          assert f"const PEPTIDE_PLANNER_SW_VERSION='{version}';" in sw

          marker = "/* v20261009.12 — requested mobile-only Treatments field height normalization. */"
          start = html.index(marker)
          end = html.index("</style>", start)
          block = html[start:end]
          assert "@media(max-width:760px)" in block
          selectors = [
              'body.mobile-app #planner input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"])',
              "body.mobile-app #planner select",
              "body.mobile-app #planner textarea",
              "body.mobile-app #planner .date-control",
              "body.mobile-app #planner .date-display",
              "body.mobile-app #planner .cycle-vial-dose-box",
          ]
          assert all(selector in block for selector in selectors)
          declaration_match = re.search(r"\{([^{}]+)\}\s*\}\s*$", block, re.S)
          assert declaration_match
          declarations = [item.strip() for item in declaration_match.group(1).split(";") if item.strip()]
          properties = [item.split(":", 1)[0] for item in declarations]
          assert set(properties) == {"height", "min-height", "max-height", "block-size"}
          assert len(properties) == 4
          assert all(item.endswith("40px!important") for item in declarations)
          assert html[end:].startswith("</style>\n</head>")
          assert ".mobile-app input,.mobile-app select,.mobile-app textarea{min-height:44px;border-radius:9px;padding:8px 10px;font-size:16px;line-height:1.3}" in html
          assert "white-space:nowrap!important;\n  text-overflow:ellipsis!important;" in html

          base = subprocess.check_output(["git", "show", "HEAD^:index.html"], text=True)
          expected = base.replace(
              "<title>Peptide_Planner_v20261009.11</title>",
              "<title>Peptide_Planner_v20261009.12</title>",
              1,
          ).replace(
              'const APP_VERSION="Peptide_Planner_v20261009.11";',
              'const APP_VERSION="Peptide_Planner_v20261009.12";',
              1,
          )
          insertion = "\n" + block.rstrip() + "\n"
          expected = expected.replace("</style>\n</head>", insertion + "</style>\n</head>", 1)
          assert html.rstrip("\n") == expected.rstrip("\n")

          base_sw = subprocess.check_output(["git", "show", "HEAD^:peptide-planner-sw.js"], text=True)
          expected_sw = base_sw.replace(
              "Peptide_Planner_v20261009.11",
              "Peptide_Planner_v20261009.12",
              1,
          )
          assert sw == expected_sw
          print("Exact mobile-only, height-only scope verified.")
          PY
          node --check peptide-planner-sw.js
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const scripts=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(match=>match[1]).filter(Boolean);
          if(!scripts.length)throw new Error("No inline application script found");
          scripts.forEach(source=>new Function(source));
          console.log("Inline application syntax verified.");
          NODE
          git diff --check
          test "$(git diff --name-only HEAD | sort | tr '\n' ' ')" = "index.html peptide-planner-sw.js "
          git diff --quiet HEAD^ -- _headers manifest.webmanifest

      - name: Build and verify release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js release/
          zip -q -j Peptide_Planner_v20261009.12.zip release/_headers release/index.html release/manifest.webmanifest release/peptide-planner-sw.js
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          expected = ["_headers", "index.html", "manifest.webmanifest", "peptide-planner-sw.js"]
          with ZipFile("Peptide_Planner_v20261009.12.zip") as archive:
              assert sorted(archive.namelist()) == sorted(expected)
              assert archive.testzip() is None
              for name in expected:
                  assert archive.read(name) == Path(name).read_bytes()
          print("Release ZIP integrity verified.")
          PY

      - name: Commit exact release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html peptide-planner-sw.js
          git rm .github/workflows/temp-mobile-field-height.yml
          test "$(git diff --cached --name-only HEAD^ | sort | tr '\n' ' ')" = "index.html peptide-planner-sw.js "
          git diff --cached --check
          git commit -m 'Peptide_Planner_v20261009.12'
          git push origin HEAD:main

      - name: Deploy exact release to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy release --project-name=peptide-planner --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.12
          path: |
            Peptide_Planner_v20261009.12.zip
            release/_headers
            release/index.html
            release/manifest.webmanifest
            release/peptide-planner-sw.js
          if-no-files-found: error
          retention-days: 7
