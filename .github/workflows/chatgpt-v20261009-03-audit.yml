name: Temporary v20261009.03 source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20261009-03-audit.yml']
permissions:
  contents: read
jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture exact current production source
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD > source-main-sha.txt
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Peptide_Planner_v20261009.02</title>' in h
          assert 'const APP_VERSION="Peptide_Planner_v20261009.02";' in h
          print('Captured exact current production source')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20261009.03_source_audit
          path: |
            index.html
            peptide-planner-sw.js
            manifest.webmanifest
            _headers
            source-main-sha.txt
          if-no-files-found: error
