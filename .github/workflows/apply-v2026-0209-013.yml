name: Apply Peptide Planner v2026.0209.013 cycle vial schedule patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-013.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "2af5e4fa0c1f44ff87889b1929c923c84115a56d0734f6c070118a7f9b0fca6f  index.html" | sha256sum -c -

      - name: Apply exact v2026.0209.013 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_013.patch.xz.b64 | xz -d > /tmp/v013.patch
          patch --batch --forward -p0 < /tmp/v013.patch
          echo "a7c3480015d24519f02d9f45d7ead93a8b0091dc5d44c046ddc17e3ba925f2f5  index.html" | sha256sum -c -

      - name: Validate requested change and protected functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=[
            'Peptide Planner v2026.0209.013',
            'const APP_VERSION="v2026.0209.013";',
            'Schedule of vials',
            'Vial #',
            'Date Opened',
            'Date Finished',
            'data-cycle-vial-finish-date',
            'data-cycle-add-vial',
            'data-cycle-remove-vial',
            'data-cycle-phase-weekday',
            'data-cycle-phase-split',
            'data-cycle-config-field="injectionTime"',
            'data-cycle-config-field="scheduleMode"',
            'data-cycle-config-field="intervalDays"',
            'planner_notification_preferences',
            'planner_push_subscriptions',
            'planner_notification_queue',
            'Review &amp; verify',
            'data-open-next-vial',
            'SUPABASE_URL',
            'signIn',
            'forgot'
          ]
          for marker in required:
              assert marker in s, marker
          start=s.index('function renderPlanCyclePanels(plan)')
          end=s.index('function renderSimplePlanner()',start)
          cycle_render=s[start:end]
          assert 'data-cycle-config-weekday=' not in cycle_render
          assert 'renderCycleConfigVialSchedule(plan,config,sequence)' in cycle_render
          assert '<th>Weekdays</th>' in cycle_render
          assert 'data-cycle-phase-weekday' not in cycle_render
          dose_start=s.index('function renderCycleDoseRows')
          dose_end=s.index('function cycleSetupVisualState',dose_start)
          dose_render=s[dose_start:dose_end]
          assert 'data-cycle-phase-weekday' in dose_render
          assert 'phase-weekdays' in dose_render
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/planner-inline.js').write_text(max(scripts,key=len))
          PY
          node --check /tmp/planner-inline.js

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.013"
          git push origin HEAD:main
