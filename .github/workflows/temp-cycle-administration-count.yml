name: Temporary cycle administration counting release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-cycle-administration-count.yml

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Retry Peptide_Planner_v20261009.13 cycle administration counting release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact retry state
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Guard exact production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "570fe94f588d2b2e6d926850d9c99455494cc9ca"
          test "$(git rev-parse HEAD^^)" = "bb0f5f3562dc2edf65b690d5c2532052163c8165"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp-cycle-administration-count.yml"
          test "$(git hash-object index.html)" = "7a889f29da3403ccceafc9bf362b4d713824edb4"
          test "$(git hash-object peptide-planner-sw.js)" = "e7fef1beb77ff198a89218d13edc5f643fc576a9"
          grep -Fq '<title>Peptide_Planner_v20261009.12</title>' index.html
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261009.12";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.12';" peptide-planner-sw.js

      - name: Apply scoped cycle administration patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/v13.patch
          test "$(sha256sum /tmp/v13.patch | cut -d' ' -f1)" = "385f163f41665f09adc4fa64519b43b5dd42a3d0f8b7559b33894ade019db291"
          git apply --whitespace=nowarn /tmp/v13.patch
          rm .github/workflows/temp-cycle-administration-count.yml

      - name: Validate production release
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<title>Peptide_Planner_v20261009.13</title>' index.html
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261009.13";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261009.13';" peptide-planner-sw.js
          grep -Fq 'const administrations=(scheduled.administrations&&scheduled.administrations.length)?scheduled.administrations' index.html
          grep -Fq 'nextUnassignedDate===previousFinish?previousFinish:fallbackOpenDate' index.html
          grep -Fq 'dispose&&event.date>=dispose' index.html
          node --check peptide-planner-sw.js
          python3 - <<'PY2'
          import re, subprocess
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,body in enumerate(scripts):
              if not body.strip():
                  continue
              path=Path(f'/tmp/inline_{i}.js')
              path.write_text(body)
              subprocess.run(['node','--check',str(path)],check=True)
          PY2
          git diff --check HEAD^^
          changed="$(git diff --name-only HEAD^^ -- | sort)"
          test "$changed" = $'index.html\npeptide-planner-sw.js'

      - name: Commit exact production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Peptide_Planner_v20261009.13'
          git push origin HEAD:main
