name: Temporary Peptide Planner release v20261309.02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-release-v20261309-02.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify apply validate and release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='7c0e77c5bc087bd6c6b3ffe0d2be0a6c3debf773'
          RELEASE='Peptide_Planner_v20261309.02'
          EXPECTED_PATCH_SHA='6a5a25f0d00f6c40068dc18fbaf4ad2606aee091372656b94c96bd96e5d72dcc'
          EXPECTED_INDEX_BASE_BLOB='bcec59334039bfda08ac153a5a67845afa3eb529'
          EXPECTED_INDEX_FINAL_BLOB='06650dbbc7eef1819ffa162f58f001f04baae811'
          EXPECTED_SW_BASE_BLOB='1da5e0954a306ad660497d1c03eddd13b2bc8f9b'
          EXPECTED_SW_FINAL_BLOB='d28112a9a8374428ecc80bc7caae19a85987862d'

          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git hash-object index.html)" = "$EXPECTED_INDEX_BASE_BLOB"
          test "$(git hash-object peptide-planner-sw.js)" = "$EXPECTED_SW_BASE_BLOB"

          cat .release/v20261309-02.part* | base64 -d > /tmp/release.patch
          echo "$EXPECTED_PATCH_SHA  /tmp/release.patch" | sha256sum -c -
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch

          rm -f .release/v20261309-02.part*
          rm -f .github/workflows/temp-release-v20261309-02.yml

          grep -Fq '<title>Peptide_Planner_v20261309.02</title>' index.html
          grep -Fq 'const APP_VERSION="Peptide_Planner_v20261309.02";' index.html
          grep -Fq "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261309.02';" peptide-planner-sw.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          Path('/tmp/inline-js-check.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/inline-js-check.js
          node --check peptide-planner-sw.js
          git diff --check "$EXPECTED_BASE"

          test "$(git hash-object index.html)" = "$EXPECTED_INDEX_FINAL_BLOB"
          test "$(git hash-object peptide-planner-sw.js)" = "$EXPECTED_SW_FINAL_BLOB"

          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'index.html'
          test "${changed[1]}" = 'peptide-planner-sw.js'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "$RELEASE"
          git push origin HEAD:main
