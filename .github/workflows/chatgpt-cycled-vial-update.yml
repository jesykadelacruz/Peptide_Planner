name: Temporary cycled vial schedule release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-cycled-vial-update.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited cycled vial schedule patch
        run: python3 .deploy/apply_cycled_vial_schedule.py

      - name: Validate syntax and exact scope
        run: |
          set -euo pipefail
          node --check /tmp/peptide-planner-inline.js
          node --check peptide-planner-sw.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          test -f _headers
          test -f manifest.webmanifest
          test -f peptide-planner-sw.js

      - name: Commit requested index change to main
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          test "$(git diff --cached --name-only | tr -d '\r')" = "index.html"
          git commit -m "Update cycled treatment vial schedule"
          git push origin main

      - name: Build exact Cloudflare package
        run: |
          set -euo pipefail
          ZIP="Peptide_Planner_Cloudflare_Cycled_Vial_Schedule_2026-09-09.zip"
          rm -f "$ZIP"
          zip -j "$ZIP" _headers index.html manifest.webmanifest peptide-planner-sw.js
          test "$(unzip -Z1 "$ZIP" | wc -l | tr -d ' ')" = "4"
          unzip -Z1 "$ZIP" | sort > /tmp/zip-files.txt
          printf '%s\n' _headers index.html manifest.webmanifest peptide-planner-sw.js | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/zip-files.txt
          unzip -t "$ZIP"

      - name: Upload Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cycled-vial-schedule-2026-09-09
          path: Peptide_Planner_Cloudflare_Cycled_Vial_Schedule_2026-09-09.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
