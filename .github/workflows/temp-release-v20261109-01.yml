name: Temporary Peptide Planner release v20261109.01
on:
  push:
    paths:
      - '.github/workflows/temp-release-v20261109-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify baseline and apply release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='dbe9c4601672d77a09fe010cc20e995ed5427fcc'
          RELEASE='Peptide_Planner_v20261109.01'
          if [ "$(git rev-parse HEAD^)" != "$EXPECTED_BASE" ]; then
            echo "Unexpected baseline: $(git rev-parse HEAD^)" >&2
            exit 1
          fi
          printf '%s' '' | base64 -d > /tmp/release.patch
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch
          rm -f '.github/workflows/temp-release-v20261109-01.yml'
          grep -q '<title>Peptide_Planner_v20261109.01</title>' index.html
          grep -q 'const APP_VERSION="Peptide_Planner_v20261109.01";' index.html
          grep -q "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261109.01';" peptide-planner-sw.js
          python - <<'PYJS'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          parts=[]
          for m in re.finditer(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I):
              tag=s[m.start():s.find('>',m.start())+1]
              if 'src=' not in tag.lower(): parts.append(m.group(1))
          Path('/tmp/inline-js-check.js').write_text('\\n'.join(parts))
          PYJS
          node --check /tmp/inline-js-check.js
          node --check peptide-planner-sw.js
          git add index.html peptide-planner-sw.js '.github/workflows/temp-release-v20261109-01.yml'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE"
          git push origin HEAD:main
