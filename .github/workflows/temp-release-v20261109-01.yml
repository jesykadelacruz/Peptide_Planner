name: Temporary Peptide Planner release v20261109.01
on:
  push:
    paths:
      - '.github/workflows/temp-release-v20261109-01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, apply, validate and release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='dbe9c4601672d77a09fe010cc20e995ed5427fcc'
          RELEASE='Peptide_Planner_v20261109.01'
          PATCH='.release-v20261109-01.patch'
          WORKFLOW='.github/workflows/temp-release-v20261109-01.yml'
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git diff --quiet "$EXPECTED_BASE" -- index.html peptide-planner-sw.js manifest.webmanifest _headers
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = 'aa970517fa363a1b55bd1b1978d909b63f9824171dcb186f7b179841bbcaeba8'
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm -f "$PATCH" "$WORKFLOW"
          grep -q '<title>Peptide_Planner_v20261109.01</title>' index.html
          grep -q 'const APP_VERSION="Peptide_Planner_v20261109.01";' index.html
          grep -q "const PEPTIDE_PLANNER_SW_VERSION='Peptide_Planner_v20261109.01';" peptide-planner-sw.js
          python - <<'PYJS'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          parts=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I):
              tag=s[m.start():s.find('>',m.start())+1]
              if 'src=' not in tag.lower(): parts.append(m.group(1))
          Path('/tmp/inline-js-check.js').write_text('\n'.join(parts))
          PYJS
          node --check /tmp/inline-js-check.js
          node --check peptide-planner-sw.js
          git add -A
          git diff --cached --check
          test "$(git diff --name-only "$EXPECTED_BASE" | sort)" = $'index.html\npeptide-planner-sw.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE"
          git push origin HEAD:main
