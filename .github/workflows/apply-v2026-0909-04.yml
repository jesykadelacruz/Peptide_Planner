name: Apply v2026.0909.04 production hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0909-04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited v04 patch and production files
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          
          INDEX = Path('index.html')
          EXPECTED_BEFORE = '2f88603a130e6c0dea7953ed89d76e4716fc5f25bb2c679205ac0bbdff7a5b77'
          EXPECTED_AFTER = '626109dd9fb1b2480158229f8c6e013976e24429aa69a4f2743cd5bf30b69152'
          html = INDEX.read_text()
          before_hash = hashlib.sha256(html.encode()).hexdigest()
          if before_hash != EXPECTED_BEFORE:
              raise SystemExit(f'Unexpected v03 source checksum: {before_hash}')
          
          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              html = html.replace(old, new, 1)
          
          replace_once(
              '<title>Peptide Planner v2026.0909.03</title>\n',
              '<title>Peptide Planner v2026.0909.04</title>\n'
              '<!-- v2026.0909.04: Production hardening only. Cloud writes are serialized so overlapping autosaves cannot race or clear a newer local edit; successful writes preserve the dirty state when another edit occurred in flight. Password-reset redirects resolve from the planner URL currently in use instead of a fixed Pages hostname. Treatment, dose, vial, schedule, role and layout behavior are unchanged. -->\n',
              'title/version marker'
          )
          replace_once(
          '''const APP_VERSION="v2026.0909.03";
          const CLOUD_SYNC_META_KEY="peptidePlannerCloudSync_v1";
          const CLOUD_KB_CACHE_KEY="peptidePlannerKbOverrides_v1";
          const SUPABASE_URL="https://srfuwxjwulvbalzoymcc.supabase.co";
          const SUPABASE_PUBLISHABLE_KEY="sb_publishable_1s9nuhOTRGhgjv_Q_4IOSA_LqFd3OdI";
          const PASSWORD_RESET_REDIRECT_URL="https://peptide-planner.pages.dev/?password=1";
          let cloudClient=null,cloudUser=null,cloudAccess=null,cloudSaveTimer=null,cloudApplying=false,cloudInitialised=false,cloudAuthMode="signin",cloudAccessChecking=false;
          ''',
          '''const APP_VERSION="v2026.0909.04";
          const CLOUD_SYNC_META_KEY="peptidePlannerCloudSync_v1";
          const CLOUD_KB_CACHE_KEY="peptidePlannerKbOverrides_v1";
          const SUPABASE_URL="https://srfuwxjwulvbalzoymcc.supabase.co";
          const SUPABASE_PUBLISHABLE_KEY="sb_publishable_1s9nuhOTRGhgjv_Q_4IOSA_LqFd3OdI";
          const PASSWORD_RESET_REDIRECT_URL=(()=>{
            try{const url=new URL(window.location.href);url.search="";url.hash="";url.searchParams.set("password","1");return url.toString()}
            catch{return "?password=1"}
          })();
          let cloudClient=null,cloudUser=null,cloudAccess=null,cloudSaveTimer=null,cloudPushInFlight=null,cloudChangeRevision=0,cloudApplying=false,cloudInitialised=false,cloudAuthMode="signin",cloudAccessChecking=false;
          ''',
              'version/auth constants'
          )
          replace_once(
          'function markLocalChanged(){if(!cloudApplying)setCloudSyncMeta({localModifiedAt:new Date().toISOString(),localDirty:true})}',
          'function markLocalChanged(){if(!cloudApplying){cloudChangeRevision+=1;setCloudSyncMeta({localModifiedAt:new Date().toISOString(),localDirty:true})}}',
              'local revision tracking'
          )
          replace_once(
          '''async function pushCloudState(reason="automatic"){
            if(!cloudClient||!cloudUser||cloudApplying||cloudAccess?.status!=="active")return false;
            clearTimeout(cloudSaveTimer);setCloudSyncStatus("Syncing…","syncing");
            const stamp=new Date().toISOString();
            const payload={user_id:cloudUser.id,state:state,app_version:APP_VERSION,client_updated_at:stamp};
            try{
              let data=null,error=null;
              if(reason==="first_user_upload"){
                ({data,error}=await cloudClient.from("planner_state").upsert(payload,{onConflict:"user_id"}).select("updated_at,client_updated_at").maybeSingle());
              }else{
                const meta=getCloudSyncMeta(cloudUser.id),baseline=meta.lastRemoteUpdatedAt||"";
                if(!baseline){
                  await pullLatestCloudAfterRejectedPush("sync_baseline_backup");
                  return false;
                }
                ({data,error}=await cloudClient.from("planner_state").update(payload).eq("user_id",cloudUser.id).eq("updated_at",baseline).select("updated_at,client_updated_at").maybeSingle());
                if(error)throw error;
                if(!data){
                  await pullLatestCloudAfterRejectedPush("cross_device_conflict_backup");
                  return false;
                }
              }
              if(error)throw error;
              const remoteStamp=data?.updated_at||data?.client_updated_at||stamp;
              setCloudSyncMeta({userId:cloudUser.id,lastSyncedAt:stamp,localModifiedAt:stamp,localDirty:false,lastRemoteUpdatedAt:remoteStamp});setCloudSyncStatus("Synced","synced");return true;
            }catch(error){console.error("Cloud sync failed",error);setCloudSyncStatus("Sync error","error");return false}
          }
          ''',
          '''async function pushCloudState(reason="automatic"){
            if(!cloudClient||!cloudUser||cloudApplying||cloudAccess?.status!=="active")return false;
            if(cloudPushInFlight){setCloudSyncStatus("Changes pending","syncing");return cloudPushInFlight}
            clearTimeout(cloudSaveTimer);setCloudSyncStatus("Syncing…","syncing");
            const userId=cloudUser.id,revisionAtStart=cloudChangeRevision,stamp=new Date().toISOString();
            const payload={user_id:userId,state:clone(state),app_version:APP_VERSION,client_updated_at:stamp};
            cloudPushInFlight=(async()=>{
              try{
                let data=null,error=null;
                if(reason==="first_user_upload"){
                  ({data,error}=await cloudClient.from("planner_state").upsert(payload,{onConflict:"user_id"}).select("updated_at,client_updated_at").maybeSingle());
                }else{
                  const meta=getCloudSyncMeta(userId),baseline=meta.lastRemoteUpdatedAt||"";
                  if(!baseline){
                    await pullLatestCloudAfterRejectedPush("sync_baseline_backup");
                    return false;
                  }
                  ({data,error}=await cloudClient.from("planner_state").update(payload).eq("user_id",userId).eq("updated_at",baseline).select("updated_at,client_updated_at").maybeSingle());
                  if(error)throw error;
                  if(!data){
                    await pullLatestCloudAfterRejectedPush("cross_device_conflict_backup");
                    return false;
                  }
                }
                if(error)throw error;
                const remoteStamp=data?.updated_at||data?.client_updated_at||stamp;
                const changedDuringPush=cloudChangeRevision!==revisionAtStart,currentMeta=getCloudSyncMeta(userId);
                setCloudSyncMeta({userId,lastSyncedAt:stamp,localModifiedAt:changedDuringPush?(currentMeta.localModifiedAt||stamp):stamp,localDirty:changedDuringPush,lastRemoteUpdatedAt:remoteStamp},userId);
                setCloudSyncStatus(changedDuringPush?"Changes pending":"Synced",changedDuringPush?"syncing":"synced");
                return true;
              }catch(error){console.error("Cloud sync failed",error);setCloudSyncStatus("Sync error","error");return false}
            })();
            try{return await cloudPushInFlight}
            finally{
              cloudPushInFlight=null;
              const currentUserId=cloudUser?.id||"";
              if(currentUserId&&getCloudSyncMeta(currentUserId).localDirty===true)scheduleCloudSave();
            }
          }
          ''',
              'serialized cloud push'
          )
          INDEX.write_text(html)
          after_hash = hashlib.sha256(html.encode()).hexdigest()
          if after_hash != EXPECTED_AFTER:
              raise SystemExit(f'Unexpected v04 output checksum: {after_hash}')
          
          Path('_headers').write_text('''/*\n  Cache-Control: no-store, no-cache, must-revalidate, max-age=0\n  Pragma: no-cache\n  Expires: 0\n''')
          Path('manifest.webmanifest').write_text('''{\n  "name": "Peptide Planner",\n  "short_name": "Peptide Planner",\n  "start_url": "./",\n  "scope": "./",\n  "display": "standalone",\n  "background_color": "#f3faf6",\n  "theme_color": "#216b5f"\n}\n''')
          Path('peptide-planner-sw.js').write_text('''const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.04';\nself.addEventListener('install',event=>{self.skipWaiting();});\nself.addEventListener('activate',event=>{\n  event.waitUntil((async()=>{\n    const keys=await caches.keys();\n    await Promise.all(keys.map(key=>caches.delete(key)));\n    await self.clients.claim();\n    const clients=await self.clients.matchAll({type:'window',includeUncontrolled:true});\n    await Promise.all(clients.map(client=>{\n      try{\n        const url=new URL(client.url);\n        url.searchParams.set('_ppv',PEPTIDE_PLANNER_SW_VERSION);\n        return client.navigate(url.href);\n      }catch{return Promise.resolve();}\n    }));\n  })());\n});\nself.addEventListener('fetch',event=>{\n  if(event.request.method!=="GET")return;\n  event.respondWith(fetch(event.request,{cache:"no-store"}).catch(()=>fetch(event.request)));\n});\n''')
          
          workflow = r'''name: Deploy Peptide Planner to Cloudflare Pages
          
          on:
            workflow_dispatch:
            push:
              branches: [main]
              paths:
                - '.deploy/cloudflare_release_trigger.txt'
          
          permissions:
            contents: read
            deployments: write
          
          concurrency:
            group: peptide-planner-production
            cancel-in-progress: true
          
          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
          
                - name: Validate production package
                  run: |
                    set -euo pipefail
                    python3 - <<'PY'
                    from pathlib import Path
                    import hashlib, json, re, shutil
          
                    required_files = ['index.html', '_headers', 'manifest.webmanifest', 'peptide-planner-sw.js']
                    missing_files = [p for p in required_files if not Path(p).is_file()]
                    if missing_files:
                        raise SystemExit('Missing production files: ' + ', '.join(missing_files))
          
                    html = Path('index.html').read_text()
                    title_match = re.search(r'<title>Peptide Planner ([^<]+)</title>', html)
                    app_match = re.search(r'const APP_VERSION="([^"]+)";', html)
                    sw = Path('peptide-planner-sw.js').read_text()
                    sw_match = re.search(r"PEPTIDE_PLANNER_SW_VERSION='([^']+)'", sw)
                    if not (title_match and app_match and sw_match):
                        raise SystemExit('Could not resolve application version markers')
                    version = app_match.group(1)
                    if title_match.group(1) != version or sw_match.group(1) != version:
                        raise SystemExit(f'Version mismatch: title={title_match.group(1)} app={version} sw={sw_match.group(1)}')
          
                    markers = [
                        'signInWithPassword', 'resetPasswordForEmail', 'PASSWORD_RECOVERY',
                        'from("planner_state")', 'from("planner_snapshots")',
                        'planVerificationCompleteness', 'planReadyForToday',
                        'doseSourceIndicatorHtml', 'doseEntryMode', 'splitUnits',
                        'cloudPushInFlight', 'administrationMatchesScheduledStructure',
                    ]
                    missing_markers = [m for m in markers if m not in html]
                    if missing_markers:
                        raise SystemExit('Production feature validation failed: ' + ', '.join(missing_markers))
                    if re.search(r'service_role|SUPABASE_SECRET_KEY', html, flags=re.I):
                        raise SystemExit('Secret key marker found in client')
          
                    headers = Path('_headers').read_text()
                    if 'Cache-Control: no-store, no-cache, must-revalidate, max-age=0' not in headers:
                        raise SystemExit('No-cache Cloudflare headers are missing')
          
                    manifest = json.loads(Path('manifest.webmanifest').read_text())
                    if manifest.get('start_url') != './' or manifest.get('scope') != './':
                        raise SystemExit('Manifest start_url/scope must remain relative')
          
                    scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I | re.S)
                    Path('/tmp/peptide-planner-inline.js').write_text('\n'.join(s for s in scripts if s.strip()))
                    dist = Path('dist')
                    if dist.exists(): shutil.rmtree(dist)
                    dist.mkdir()
                    for filename in required_files:
                        shutil.copy2(filename, dist / filename)
                    print('Version:', version)
                    print('index.html SHA256:', hashlib.sha256(Path('index.html').read_bytes()).hexdigest())
                    PY
                    node --check /tmp/peptide-planner-inline.js
                    node --check peptide-planner-sw.js
                    test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          
                - name: Deploy to Cloudflare Pages
                  uses: cloudflare/wrangler-action@v3
                  with:
                    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                    command: pages deploy dist --project-name=peptide-planner --branch=main
                    gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          '''
          Path('.github/workflows').mkdir(parents=True, exist_ok=True)
          Path('.github/workflows/deploy-cloudflare-pages.yml').write_text(workflow)
          
          print('Prepared v2026.0909.04', after_hash)
          PYCODE
          git diff --check

      - name: Validate JavaScript and package markers
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/planner-inline.js').write_text('\n'.join(s for s in scripts if s.strip()))
          required=['<title>Peptide Planner v2026.0909.04</title>','const APP_VERSION="v2026.0909.04";','cloudPushInFlight','PASSWORD_RESET_REDIRECT_URL=(()=>{']
          missing=[m for m in required if m not in html]
          if missing: raise SystemExit('Missing v04 markers: '+', '.join(missing))
          PYCODE
          node --check /tmp/planner-inline.js
          node --check peptide-planner-sw.js

      - name: Commit release
        run: |
          set -euo pipefail
          git config user.name 'jesykadelacruz'
          git config user.email '84807985+jesykadelacruz@users.noreply.github.com'
          git add index.html _headers manifest.webmanifest peptide-planner-sw.js .github/workflows/deploy-cloudflare-pages.yml
          if git diff --cached --quiet; then
            echo 'No release changes to commit.'
            exit 0
          fi
          git commit -m 'Release v2026.0909.04 production hardening'
          git push origin main
