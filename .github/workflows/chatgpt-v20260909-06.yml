name: Temporary v20260909.06 release
# full-dose correction trigger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20260909-06.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Full Dose correction
        run: |
          python .deploy/apply_full_dose_v20260909_06.py
          git checkout -- .deploy/apply_full_dose_v20260909_06.py
      - name: Validate exact correction
        run: |
          git diff --check
          test "$(git status --short | awk '{print $2}')" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('index.html').read_text()
          assert '<title>Peptide Planner v2026.0909.04</title>' in h
          assert 'const APP_VERSION="v2026.0909.04";' in h
          assert h.count('function cycleFullDoseCountForDisplay(')==1
          assert h.count('cycleFullDoseCountForDisplay(rowEvents,rowStartCursor,openDate,capacityUnits)')==1
          assert 'const cycleDoseCount=vialDoseCountForDisplay(rowEvents,rowStartCursor,openDate,capacityUnits,disposeDate||null);' in h
          assert 'const required=computed.required,rowCount=rows.length;' in h
          assert 'const total=Math.max(1,required,started);' in h
          a=h.index('/* v20260909.04 — compact treatment controls; UI dimensions only. */')
          b=h.index('@media(max-width:760px){',a)
          assert '36px' not in h[a:b]
          assert '<th>#</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Cycle Dose</th><th>Open</th><th>Finish</th><th>Status</th>' in h
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          for i,s in enumerate(scripts): Path(f'/tmp/fdose-{i}.js').write_text(s)
          diff=subprocess.check_output(['git','diff','--','index.html'],text=True)
          additions=[x for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++')]
          deletions=[x for x in diff.splitlines() if x.startswith('-') and not x.startswith('---')]
          assert len(deletions)==1,(len(deletions),deletions)
          assert len(additions)==24,(len(additions),additions)
          print(f'Validated Full Dose correction only: {len(additions)} additions, {len(deletions)} deletion')
          PY
          for f in /tmp/fdose-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js
      - name: Commit production correction
        run: |
          git config user.name jesykadelacruz
          git config user.email 84807985+jesykadelacruz@users.noreply.github.com
          git add index.html
          git commit -m "Correct cycled Full Dose calculation"
          git push origin HEAD:main
      - name: Package
        run: |
          rm -rf /tmp/pkg
          mkdir -p /tmp/pkg
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/pkg/
          cd /tmp/pkg
          zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.06.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd "$GITHUB_WORKSPACE"
          unzip -t Peptide_Planner_v20260909.06.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.06.zip') as z: assert sorted(z.namelist())==sorted(expected),z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.06
          path: Peptide_Planner_v20260909.06.zip
          if-no-files-found: error
