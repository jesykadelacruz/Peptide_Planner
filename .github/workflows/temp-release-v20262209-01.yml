name: Temporary Release Peptide_Planner_v20262209.01

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Retry temporary release workflow for Peptide_Planner_v20262209.01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify, patch, validate and release
        shell: bash
        run: |
          set -euo pipefail
          BASE='6c826801a12605c71d4e1b943b340212563d338c'
          RELEASE='Peptide_Planner_v20262209.01'
          WORKFLOW='.github/workflows/temp-release-v20262209-01.yml'
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git hash-object index.html)" = '0f4bcd9411c0823bac3c4bf175122b1d3f5cb313'
          test "$(git hash-object peptide-planner-sw.js)" = '950e2661cc2580234f37e2b77cad9ec9ec14b5d2'
          test "$(git hash-object _headers)" = '4523d690440b8ca021ca9b6f0a0460f8f34181cb'
          test "$(git hash-object manifest.webmanifest)" = 'a9032cf4d06a62cd7cadf2e30950c1411d0e3916'
          export OLD164='ICBjb25zdCByb3dzPVtdO2xldCBjdXJzb3I9MCxwcmV2aW91c0ZpbmlzaD1sb2NhbERhdGVJU08oZG9zZVBsYW4ucGVyaW9kLnN0YXJ0KSxyZXF1aXJlZD0wLGluZGV4PTEscHJldmlvdXNQcmVwPWN5Y2xlVmlhbFByZXBGb3JTZXF1ZW5jZShwbGFuLGN5Y2xlTnVtYmVyKTs='
          export NEW164='ICBjb25zdCByb3dzPVtdO2xldCBjdXJzb3I9MCxwcmV2aW91c0ZpbmlzaD1sb2NhbERhdGVJU08oZG9zZVBsYW4ucGVyaW9kLnN0YXJ0KSxwcmV2aW91c0ZpbmlzaFdhc01hbnVhbD1mYWxzZSxyZXF1aXJlZD0wLGluZGV4PTEscHJldmlvdXNQcmVwPWN5Y2xlVmlhbFByZXBGb3JTZXF1ZW5jZShwbGFuLGN5Y2xlTnVtYmVyKTs='
          export OLD264='ICAgIGNvbnN0IGNhbGN1bGF0ZWRPcGVuRGF0ZT1pbmRleD09PTE/bG9jYWxEYXRlSVNPKGRvc2VQbGFuLnBlcmlvZC5zdGFydCk6KHByZXZpb3VzRmluaXNoJiZuZXh0VW5hc3NpZ25lZERhdGU9PT1wcmV2aW91c0ZpbmlzaD9wcmV2aW91c0ZpbmlzaDpmYWxsYmFja09wZW5EYXRlKTs='
          export NEW264=''
          export OLD364='ICAgIGNvbnN0IGZpbmlzaERhdGU9ZWZmZWN0aXZlV2luZG93Lmxhc3RGdWxsRG9zZURhdGV8fGVmZmVjdGl2ZVdpbmRvdy5maW5pc2hEYXRlfHxhdXRvbWF0aWNGaW5pc2hEYXRlOw=='
          export NEW364='ICAgIGNvbnN0IGZpbmlzaERhdGU9bWFudWFsRmluaXNoP3JlcXVlc3RlZEZpbmlzaERhdGU6KGVmZmVjdGl2ZVdpbmRvdy5sYXN0RnVsbERvc2VEYXRlfHxlZmZlY3RpdmVXaW5kb3cuZmluaXNoRGF0ZXx8YXV0b21hdGljRmluaXNoRGF0ZSk7'
          export OLD464='ICAgIHByZXZpb3VzRmluaXNoPWZpbmlzaERhdGV8fGNhbGN1bGF0ZWRPcGVuRGF0ZXx8cHJldmlvdXNGaW5pc2g7CiAgICBjb25zdCByb3dSZXF1aXJlZD1jeWNsZURvc2VDb3VudD4wOw=='
          export NEW464='ICAgIHByZXZpb3VzRmluaXNoPWZpbmlzaERhdGV8fGNhbGN1bGF0ZWRPcGVuRGF0ZXx8cHJldmlvdXNGaW5pc2g7CiAgICBwcmV2aW91c0ZpbmlzaFdhc01hbnVhbD1tYW51YWxGaW5pc2g7CiAgICBjb25zdCByb3dSZXF1aXJlZD1jeWNsZURvc2VDb3VudD4wOw=='
          export OLD564=''
          export NEW564='ICAgICAgICByZWNvcmQuZmluaXNoRGF0ZT1jb250cm9sLnZhbHVlfHwiIjsKICAgICAgICByZWNvcmQuc2NoZWR1bGVGaW5pc2hBdXRvPSFyZWNvcmQuZmluaXNoRGF0ZTs='
          python - <<'PYCODE'
          from pathlib import Path
          import os, base64, re
          p=Path('index.html')
          s=p.read_text()
          old=base64.b64decode(os.environ['OLD164']).decode()
          new=base64.b64decode(os.environ['NEW164']).decode()
          if s.count(old)!=1: raise SystemExit('Replacement 1 expected once, found %s' % s.count(old))
          s=s.replace(old,new)
          old=base64.b64decode(os.environ['OLD264']).decode()
          new=base64.b64decode(os.environ['NEW264']).decode()
          if s.count(old)!=1: raise SystemExit('Replacement 2 expected once, found %s' % s.count(old))
          s=s.replace(old,new)
          old=base64.b64decode(os.environ['OLD364']).decode()
          new=base64.b64decode(os.environ['NEW364']).decode()
          if s.count(old)!=1: raise SystemExit('Replacement 3 expected once, found %s' % s.count(old))
          s=s.replace(old,new)
          old=base64.b64decode(os.environ['OLD464']).decode()
          new=base64.b64decode(os.environ['NEW464']).decode()
          if s.count(old)!=1: raise SystemExit('Replacement 4 expected once, found %s' % s.count(old))
          s=s.replace(old,new)
          old=base64.b64decode(os.environ['OLD564']).decode()
          new=base64.b64decode(os.environ['NEW564']).decode()
          if s.count(old)!=1: raise SystemExit('Replacement 5 expected once, found %s' % s.count(old))
          s=s.replace(old,new)
          if s.count('Peptide_Planner_v20261309.03')!=2:
              raise SystemExit('Unexpected index release-version occurrence count')
          s=s.replace('Peptide_Planner_v20261309.03','Peptide_Planner_v20262209.01')
          p.write_text(s)
          sw=Path('peptide-planner-sw.js')
          t=sw.read_text()
          if t.count('Peptide_Planner_v20261309.03')!=1:
              raise SystemExit('Unexpected SW release-version occurrence count')
          sw.write_text(t.replace('Peptide_Planner_v20261309.03','Peptide_Planner_v20262209.01'))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/planner-inline.js').write_text(inline)
          PYCODE
          node --check /tmp/planner-inline.js
          node --check peptide-planner-sw.js
          git diff --check
          test "$(git hash-object index.html)" = 'a3a6cf27706313e02d73a957ac18ca11d4b4781f'
          test "$(git hash-object peptide-planner-sw.js)" = '65dacde9dc7b3341eaa95334df9c34af0a948b23'
          test "$(git hash-object _headers)" = '4523d690440b8ca021ca9b6f0a0460f8f34181cb'
          test "$(git hash-object manifest.webmanifest)" = 'a9032cf4d06a62cd7cadf2e30950c1411d0e3916'
          git rm "$WORKFLOW"
          git add index.html peptide-planner-sw.js
          mapfile -t CHANGED < <(git diff --name-only "$BASE" -- | sort)
          printf '%s\n' 'Net changed files from Release 3 baseline:' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 2
          test "${CHANGED[0]}" = 'index.html'
          test "${CHANGED[1]}" = 'peptide-planner-sw.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE"
          git push origin HEAD:main
