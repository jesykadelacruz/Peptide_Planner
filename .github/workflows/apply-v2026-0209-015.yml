name: Apply Peptide Planner v2026.0209.015 vial schedule calculation patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "582c2a25c17e33b408086739c2eec44286b395eb621cf532a24a46142b374156  index.html" | sha256sum -c -
      - name: Apply exact v015 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_015.patch.xz.b64 | xz -d > /tmp/v015.patch
          patch --batch --forward index.html < /tmp/v015.patch
          echo "0bb14f0e32551637e8fe540dde570d8fef897400bd35ffe04b6b74bf2f8ce513  index.html" | sha256sum -c -
      - name: Validate requested and protected functions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'Peptide Planner v2026.0209.015',
            'const APP_VERSION="v2026.0209.015";',
            'function cycleVialDoseEvents(',
            'function cycleVialScheduleComputation(',
            'Actively Using',
            'class="cycle-vial-number">Vial #${row.index}',
            '<span>Date Open</span>',
            '<span>Date Finish</span>',
            'record.scheduleFinishAuto=true;',
            'data-cycle-phase-weekday',
            'data-simple-dispose-value',
            'data-simple-dispose-unit',
            'Forgot password',
            'Create account',
            'supabase'
          ]
          missing=[x for x in required if x not in s]
          forbidden=['cycle-vial-schedule-head', '<span>Date Finished</span><input']
          found=[x for x in forbidden if x in s]
          if missing or found:
              raise SystemExit(f'missing={missing} forbidden_present={found}')
          print('requested/protected markers validated')
          PY
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          inline=max(scripts,key=len)
          Path('/tmp/inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy Peptide Planner v2026.0209.015"
          git push
