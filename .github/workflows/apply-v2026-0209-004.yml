name: Apply Peptide Planner v2026.0209.004 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2026-0209-004.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "77f115075bd003b5f7de26957aa93b3e23ed6192a5a0876a10d198ce2de1269a"
      - name: Apply exact v2026.0209.004 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .deploy/v2026_0209_004.patch.xz.b64 | xz -d > /tmp/v2026_0209_004.patch
          git apply --check /tmp/v2026_0209_004.patch
          git apply /tmp/v2026_0209_004.patch
      - name: Validate exact target and protected functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "4364d9221fd266ce53f280351c16d3fb9818e70067dbfdf92e8d457131211f2a"
          grep -Fq '<title>Peptide Planner v2026.0209.004</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.0209.004"' index.html
          grep -Fq 'signInWithPassword' index.html
          grep -Fq 'resetPasswordForEmail' index.html
          grep -Fq 'PASSWORD_RECOVERY' index.html
          grep -Fq 'updateUser({password})' index.html
          grep -Fq 'planner-signup-public' index.html
          grep -Fq 'from("planner_state")' index.html
          grep -Fq 'from("planner_snapshots")' index.html
          grep -Fq 'from("knowledge_base_entries")' index.html
          grep -Fq 'srfuwxjwulvbalzoymcc.supabase.co' index.html
          grep -Fq '.filter(plan=>!!plan.confirmed)' index.html
          grep -Fq 'data-simple-field="confirmed"' index.html
          grep -Fq 'planner_notification_preferences' index.html
          grep -Fq 'planner_push_subscriptions' index.html
          grep -Fq 'planner_notification_queue' index.html
          grep -Fq '<span>Doses left</span>' index.html
          grep -Fq 'for(let offset=0;offset<=3650;offset++)' index.html
          grep -Fq 'const doseMg=num(administration.doseMg)' index.html
          grep -Fq 'data-admin-page-action="reactivate"' index.html
          grep -Fq 'adminAccessApi("restore",{user_id:userId})' index.html
          grep -Fq 'adminAccessApi("revoke",{user_id:userId})' index.html
          test "$(sha256sum peptide-planner-sw.js | awk '{print $1}')" = "262c48ce9f7dca5712227b773eda5d1ace500479ceca96b7ca351bbf6a0884cd"
          test "$(sha256sum manifest.webmanifest | awk '{print $1}')" = "24b489f55d2c8fe2b5cba08a21de8fe85793221201b65f63cbf4c066148f065e"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)))
          PY
          node --check /tmp/inline.js
      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote Peptide Planner v2026.0209.004 production index"
          git push origin HEAD:main
