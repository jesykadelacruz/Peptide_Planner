name: Temporary v20260909.11 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20260909-11.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_v20260909_11_kb_search_sync.py
          git checkout -- .deploy/apply_v20260909_11_kb_search_sync.py
      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short | awk '{print $2}')" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('index.html').read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          assert '<title>Peptide Planner v2026.0909.11</title>' in h
          assert 'const APP_VERSION="v2026.0909.11";' in h
          assert '<title>Peptide Planner v2026.0909.04</title>' not in h
          assert 'const APP_VERSION="v2026.0909.04";' not in h
          assert 'const searchInput=document.getElementById("protocolLibrarySearch");' in h
          assert 'const search=normalizeKbSearch(searchInput?searchInput.value:(state.ui.protocolLibrarySearch||""));' in h
          assert 'state.ui.protocolLibrarySearch=protocolSearch.value||"";' in h
          assert 'const visibleProtocolSearch=document.getElementById("protocolLibrarySearch")?.value;' in h
          assert 'if(visibleProtocolSearch!=null)state.ui.protocolLibrarySearch=visibleProtocolSearch;' in h
          # Styling/layout must be byte-identical.
          styles=lambda text: re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>',text,re.S)
          assert styles(h)==styles(base), 'CSS/style changed unexpectedly'
          # Current bundled Knowledge Base stays intact.
          assert 'const KB_DATA=' in h
          assert h.count('"name":"GHK-Cu"')>=1
          # No requested treatment/vial calculation functions changed.
          def fn(text,start,end):
              a=text.index(start);b=text.index(end,a);return text[a:b]
          for start,end in [
              ('function cycleFullDoseCountForDisplay(','function simulateCycleVialWindow('),
              ('function cycleVialPrepRecords(','function cycleVialPrepForRecord('),
              ('function scheduleForDate(','function calendarScheduleForDate(')
          ]:
              assert fn(h,start,end)==fn(base,start,end), f'Unexpected change in {start}'
          diff=subprocess.check_output(['git','diff','--','index.html'],text=True)
          allowed=['v2026.0909.11','protocolLibrarySearch','searchInput','visibleProtocolSearch']
          changed='\n'.join(line for line in diff.splitlines() if line.startswith(('+','-')) and not line.startswith(('+++','---')))
          for line in changed.splitlines():
              if 'v2026.0909.04' in line: continue
              assert any(token in line for token in allowed), f'Unexpected changed line: {line}'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          for i,s in enumerate(scripts): Path(f'/tmp/pp-{i}.js').write_text(s,encoding='utf-8')
          print('Validated v20260909.11 exact scope')
          PY
          for f in /tmp/pp-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js
      - name: Commit production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name jesykadelacruz
          git config user.email 84807985+jesykadelacruz@users.noreply.github.com
          git add index.html
          git commit -m "Peptide_Planner_v20260909.11"
          git push origin HEAD:main
      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/pkg/
          cd /tmp/pkg
          zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.11.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd "$GITHUB_WORKSPACE"
          unzip -t Peptide_Planner_v20260909.11.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.11.zip') as z:
              assert sorted(z.namelist())==sorted(expected),z.namelist()
              assert z.testzip() is None
          PY
          sha256sum Peptide_Planner_v20260909.11.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.11
          path: Peptide_Planner_v20260909.11.zip
          if-no-files-found: error
