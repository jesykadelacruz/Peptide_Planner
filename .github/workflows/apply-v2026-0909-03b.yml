name: Apply v2026.0909.03 vial transition retry

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0909-03b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify base
        run: |
          test "$(git hash-object index.html)" = "6e3cac1f09199f647e89bd1d0a5c5e5058711282"
          test "$(git hash-object peptide-planner-sw.js)" = "59cb717248ed7b12379f03d9498ea7d94536ff58"
      - name: Apply targeted vial patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              if s.count(old)!=1: raise SystemExit(f'{label}: {s.count(old)}')
              s=s.replace(old,new,1)
          one('<title>Peptide Planner v2026.0909.02</title>','<title>Peptide Planner v2026.0909.03</title>','title')
          one('const APP_VERSION="v2026.0909.02";','const APP_VERSION="v2026.0909.03";','app')
          anchor='<!-- v2026.0909.02: Cache/runtime synchronization release. Production treatment UI, vial logic, dose calculations, cross-device sync and role behavior are unchanged from v2026.0909.01; the service worker version is advanced to the same release so devices cannot remain on an older cached planner. -->\n'
          marker='<!-- v2026.0909.03: Continuous and cycled treatments now share the same pending replacement-vial transition. A replacement vial stays pending until its first scheduled administration date; after the prior vial can no longer supply another full scheduled dose, Dose left in vial shows Open Vial instead of 0, and the replacement vial becomes current on its first-use date. All unrelated treatment, sync, auth, role and UI behavior is unchanged. -->\n'
          one(anchor,marker+anchor,'comment')
          pattern=r'function currentActualOpenedVialRecord\(plan,at=new Date\(\)\)\{.*?\n\}'
          replacement='''function currentActualOpenedVialRecord(plan,at=new Date()){
            const today=localDateISO(at),closed=new Set(["Finished","Discarded","On hold"]);
            const scheduleRows=plan?.noCycle?currentContinuousVialScheduleRows(plan,at):currentCycleVialScheduleRows(plan,at);
            const scheduledByRecordId=new Map((scheduleRows||[]).filter(row=>row?.record?.id).map(row=>[row.record.id,row]));
            const opened=openedVialRecordsForPlan(plan,at).filter(item=>{
              const record=item.record||{};
              if(closed.has(String(record.status||"")))return false;
              const explicitFinish=String(record.finishDate||"").trim();
              if(explicitFinish&&today>=explicitFinish)return false;
              const scheduledFinish=String(scheduledByRecordId.get(record.id)?.finishDate||"").trim();
              if(!explicitFinish&&scheduledFinish&&today>scheduledFinish)return false;
              return true;
            });
            return opened.length?opened[opened.length-1]:null;
          }'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'actual vial function: {n}')
          one('if(!explicitCurrent)return {valid:false,reason:plan?.noCycle?"Add/open a vial in Vial Schedule":"Open vial"};','if(!explicitCurrent)return {valid:false,reason:"Open Vial"};','open state')
          result_line='return {valid:true,doses,fullScheduleDays,splitSchedule,remainingMg:round(remaining,3),currentRemainingMg,nextDoseMg,expired:false,openedAt,discardAt,limitedBy,vialRecordId:explicitCurrent.record?.id||null,inventorySource:explicitCurrent.inventorySource||""};'
          pending_line='if(limitedBy==="amount"&&doses===0&&foundPlanned)return {valid:false,reason:"Open Vial",pendingReplacement:true,currentRemainingMg,openedAt,discardAt,vialRecordId:explicitCurrent.record?.id||null,inventorySource:explicitCurrent.inventorySource||""};\n    '+result_line
          one(result_line,pending_line,'zero-dose state')
          helper='''function automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackDate=""){
            const cursor=Math.max(0,Math.floor(Number(rowStartCursor)||0));
            const event=Array.isArray(dosePlan?.events)?dosePlan.events[cursor]:null;
            return String(event?.dateISO||fallbackDate||"");
          }
          '''
          one('function cycleVialScheduleComputation(plan,cycleUsage,requestedTotal=null){\n',helper+'function cycleVialScheduleComputation(plan,cycleUsage,requestedTotal=null){\n','helper')
          cycle_old='const calculatedOpenDate=index===1?localDateISO(dosePlan.period.start):(previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||""));'
          cycle_new='const rowStartCursor=cursor;\n    const fallbackOpenDate=previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||"");\n    const calculatedOpenDate=index===1?localDateISO(dosePlan.period.start):automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackOpenDate);'
          one(cycle_old,cycle_new,'cycle open')
          one('const rowStartCursor=cursor;\n    const autoWindow=simulateCycleVialWindow','const autoWindow=simulateCycleVialWindow','cycle cursor')
          cont_old='const calculatedOpenDate=index===1?localDateISO(dosePlan.start):(previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||""));'
          cont_new='const rowStartCursor=cursor;\n    const fallbackOpenDate=previousFinishDate?localDateISO(addDays(previousFinishDate,1)):(previousFinish||"");\n    const calculatedOpenDate=index===1?localDateISO(dosePlan.start):automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackOpenDate);'
          one(cont_old,cont_new,'continuous open')
          one('const rowStartCursor=cursor,capacityMg=prep.vialMg;','const capacityMg=prep.vialMg;','continuous cursor')
          p.write_text(s,encoding='utf-8')
          sw=Path('peptide-planner-sw.js'); t=sw.read_text(encoding='utf-8')
          if t.count("const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.02';")!=1: raise SystemExit('sw base')
          sw.write_text(t.replace("const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.02';","const PEPTIDE_PLANNER_SW_VERSION='v2026.0909.03';",1),encoding='utf-8')
          PY
      - name: Validate target
        run: |
          test "$(git hash-object index.html)" = "4bf7775778278ec0776e66430df4273ec8ca128a"
          test "$(git hash-object peptide-planner-sw.js)" = "a7e39f6bc8ef8cac40636e752a10f3d9cc49c50e"
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'reason:"Open Vial"' in s and 'pendingReplacement:true' in s
          assert s.count('automaticVialOpenDateForCursor(dosePlan,rowStartCursor,fallbackOpenDate)')==2
          assert '.eq("updated_at",baseline)' in s
          start=s.index('<script>',s.index('<script src='))+len('<script>'); end=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit and export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html peptide-planner-sw.js
          git commit -m 'v2026.0909.03 align pending vial transition'
          git push origin main
          cp index.html Peptide_Planner_v2026.0909.03.html
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v2026.0909.03_index
          path: Peptide_Planner_v2026.0909.03.html
