name: Apply Peptide Planner v2026.1 patch

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v2026_1.patch.part*'
      - '.github/workflows/apply-v2026-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current production baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "9e9a2658fe618a46aff1246dd77d5d99a3be36a097255a7f0314b34e05610e96"

      - name: Apply exact v2026.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/v2026_1.patch.part* | base64 -d | xz -d > /tmp/v2026_1.patch
          git apply --check /tmp/v2026_1.patch
          git apply /tmp/v2026_1.patch

      - name: Validate exact target and protected functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum index.html | awk '{print $1}')" = "afc095309308a997598ff0bb8e2515bb71ae97dcfd56d78cad13d96f6946695e"
          grep -Fq '<title>Peptide Planner v2026.1</title>' index.html
          grep -Fq 'const APP_VERSION="v2026.1"' index.html
          grep -Fq 'signInWithPassword' index.html
          grep -Fq 'resetPasswordForEmail' index.html
          grep -Fq 'PASSWORD_RECOVERY' index.html
          grep -Fq 'planner-signup-public' index.html
          grep -Fq 'from("planner_state")' index.html
          grep -Fq 'from("planner_snapshots")' index.html
          grep -Fq 'from("knowledge_base_entries")' index.html
          grep -Fq 'srfuwxjwulvbalzoymcc.supabase.co' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)))
          PY
          node --check /tmp/inline.js

      - name: Commit production index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote Peptide Planner v2026.1 production index"
          git push origin HEAD:main
