name: Temporary cycled vial preparation inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-peptide-settings-compact-v20260909-03.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Print targeted treatment contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=[
            'continuousVialPrepForRecord',
            'continuousVialPrepForDate',
            'function calcUnits',
            'cycleVialDoseEvents',
            'function cycleVialUsage',
            'function cycleVialScheduleComputation',
            'missing.push("vial strength")',
            'card.querySelectorAll("[data-cycle-vial-field]")'
          ]
          for needle in needles:
              p=s.find(needle)
              print(f'\n===== {needle} @ {p} =====\n')
              if p>=0:
                  print(s[max(0,p-1500):min(len(s),p+7000)])
          PY
