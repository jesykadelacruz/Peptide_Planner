name: Temporary corrected cycled vial source release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-peptide-settings-compact-v20260909-03.yml'

permissions:
  contents: write

jobs:
  patch-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited correction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.deploy/apply_peptide_settings_compact_v20260909_03.py')
          s=p.read_text(encoding='utf-8')
          old="replace_once('const prep=continuousVialPrepForRecord(plan,record,previousPrep);previousPrep=prep;','const prep=cycleVialPrepForRecord(plan,record,previousPrep);previousPrep=prep;','cycle schedule row prep')"
          new="cycle_start=html.index('function cycleVialScheduleComputation');cycle_end=html.index('function ensureCycleVialScheduleRecord',cycle_start);cycle_segment=html[cycle_start:cycle_end];assert cycle_segment.count('const prep=continuousVialPrepForRecord(plan,record,previousPrep);previousPrep=prep;')==1,'cycled row prep scope mismatch';cycle_segment=cycle_segment.replace('const prep=continuousVialPrepForRecord(plan,record,previousPrep);previousPrep=prep;','const prep=cycleVialPrepForRecord(plan,record,previousPrep);previousPrep=prep;',1);html=html[:cycle_start]+cycle_segment+html[cycle_end:]"
          assert old in s
          s=s.replace(old,new,1)
          labels=['dose edit sequence','units edit sequence','split toggle sequence','split parts sequence','split unit values sequence','split unit sync sequence']
          lines=s.splitlines();kept=[];removed=[]
          for line in lines:
              match=next((label for label in labels if f"'{label}')" in line),None)
              if match: removed.append(match)
              else: kept.append(line)
          assert sorted(removed)==sorted(labels),removed
          s='\n'.join(kept)+'\n'
          marker='# A Vial/Water edit recalculates dose-authority or units-authority values for that cycle before rerendering.'
          scoped=r'''handler_start=html.index('card.querySelectorAll("[data-cycle-phase]")')
          handler_end=html.index('card.querySelector("[data-simple-dispose-value]")',handler_start)
          handler=html[handler_start:handler_end]
          def handler_replace(old,new,label):
              global handler
              count=handler.count(old);assert count==1,f'{label}: expected one cycled-handler match, found {count}'
              handler=handler.replace(old,new,1)
          handler_replace('if(field==="doseMg")syncPhaseFromDose(plan,phase);','if(field==="doseMg")syncPhaseFromDose(plan,phase,null,sequence);','dose edit sequence')
          handler_replace('phase.units=control.value;syncPhaseFromUnits(plan,phase);','phase.units=control.value;syncPhaseFromUnits(plan,phase,null,sequence);','units edit sequence')
          split_old='phase.splitUnits=distributeSplitUnits(phaseResolvedUnits(plan,phase),parts);'
          assert handler.count(split_old)==2,f'split recalculation scope: expected 2 matches, found {handler.count(split_old)}'
          handler=handler.replace(split_old,'phase.splitUnits=distributeSplitUnits(phaseResolvedUnits(plan,phase,null,Number(control.dataset.cyclePhaseSplit)),parts);',1)
          handler_replace('phase.splitUnits=distributeSplitUnits(phaseResolvedUnits(plan,phase),parts);syncLegacyPlanFromCycleConfigs','phase.splitUnits=distributeSplitUnits(phaseResolvedUnits(plan,phase,null,Number(control.dataset.cyclePhaseSplitParts)),parts);syncLegacyPlanFromCycleConfigs','split parts sequence')
          handler_replace('const phase=config.phases[index],parts=simplePhaseSplitParts(phase),values=phaseSplitUnitValues(plan,phase);','const phase=config.phases[index],parts=simplePhaseSplitParts(phase),sequence=Number(control.dataset.cyclePhaseSplitUnit),values=phaseSplitUnitValues(plan,phase,null,sequence);','split unit values sequence')
          handler_replace('syncPhaseFromSplitUnits(plan,phase);syncLegacyPlanFromCycleConfigs','syncPhaseFromSplitUnits(plan,phase,null,sequence);syncLegacyPlanFromCycleConfigs','split unit sync sequence')
          html=html[:handler_start]+handler+html[handler_end:]
          '''
          assert marker in s
          s=s.replace(marker,scoped+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          python .deploy/apply_peptide_settings_compact_v20260909_03.py

      - name: Validate corrected source of truth and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short | awk '{print $2}')" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          start=html.index('<details class="peptide-settings"');end=html.index('</details>',start);settings=html[start:end]
          for forbidden in ['<label>Vial (mg)</label>','<label>Water (mL)</label>','<label>Concentration (mg/mL)</label>','data-simple-field="vialMg"','data-simple-field="bacWaterMl"','data-simple-field="finalMl"']: assert forbidden not in settings,forbidden
          assert '<th>#</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Cycle Dose</th><th>Open</th><th>Finish</th><th>Status</th>' in html
          assert 'function cycleVialPrepForSequence(' in html and 'function cycleVialPrepForDate(' in html and 'function syncCyclePhaseCalculationsForSequence(' in html
          cycle_start=html.index('function cycleVialScheduleComputation');cycle_end=html.index('function ensureCycleVialScheduleRecord',cycle_start)
          assert 'const prep=cycleVialPrepForRecord(plan,record,previousPrep);previousPrep=prep;' in html[cycle_start:cycle_end]
          assert 'syncCyclePhaseCalculationsForSequence(plan,record.scheduleCycleNumber);' in html
          assert 'out.units=phaseResolvedUnits(plan,phase,date,position.sequence)' in html
          assert '/* v20260909.04 — compact treatment controls; UI dimensions only. */' in html
          assert '<title>Peptide Planner v2026.0909.04</title>' in html and 'const APP_VERSION="v2026.0909.04";' in html
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):Path(f'/tmp/peptide-inline-{i}.js').write_text(script,encoding='utf-8')
          print(f'Prepared {len(scripts)} inline scripts')
          PY
          for f in /tmp/peptide-inline-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js

      - name: Commit corrected planner behavior
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jesykadelacruz"
          git config user.email "84807985+jesykadelacruz@users.noreply.github.com"
          git add index.html
          git commit -m "Use cycled Vial Schedule preparation as source of truth"
          git push origin HEAD:main

      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/peptide-package;mkdir -p /tmp/peptide-package
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/peptide-package/
          python - <<'PY'
          from pathlib import Path
          expected={'_headers','index.html','manifest.webmanifest','peptide-planner-sw.js'};actual={p.name for p in Path('/tmp/peptide-package').iterdir() if p.is_file()};assert actual==expected,(actual,expected)
          PY
          (cd /tmp/peptide-package && zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.04.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js)
          unzip -t Peptide_Planner_v20260909.04.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.04.zip') as z: assert sorted(z.namelist())==sorted(expected),z.namelist()
          PY
          sha256sum Peptide_Planner_v20260909.04.zip

      - name: Upload Cloudflare ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.04
          path: Peptide_Planner_v20260909.04.zip
          if-no-files-found: error
