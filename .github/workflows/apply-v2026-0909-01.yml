name: Apply v2026.0909.01 safe cross-device sync

on:
  push:
    paths:
      - '.github/workflows/apply-v2026-0909-01.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch server-guarded sync only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html')
          out=src
          s=src.read_text(encoding='utf-8')
          
          def once(old,new):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'target count {c}: {old[:100]!r}')
              s=s.replace(old,new,1)
          
          once('<title>Peptide Planner v2026.0809.02</title>', '<title>Peptide Planner v2026.0909.01</title>')
          once('const APP_VERSION="v2026.0809.02";', 'const APP_VERSION="v2026.0909.01";')
          marker='<!-- v2026.0909.01: Cross-device writes now use optimistic concurrency against the server-maintained planner_state.updated_at value. Automatic and manual local saves can update the cloud only when the device baseline still matches the server row; stale or baseline-less devices preserve a local snapshot and pull the current cloud state instead of overwriting another device. Treatment, UI, auth and role behavior are unchanged. -->\n'
          anchor='<title>Peptide Planner v2026.0909.01</title>\n'
          if marker not in s:
              if anchor not in s: raise SystemExit('title anchor missing')
              s=s.replace(anchor,anchor+marker,1)
          
          helper='''async function pullLatestCloudAfterRejectedPush(reason="cross_device_conflict_backup"){
            const {data,error}=await cloudClient.from("planner_state").select("state,app_version,client_updated_at,updated_at").eq("user_id",cloudUser.id).maybeSingle();
            if(error)throw error;
            if(!data)return false;
            if(getCloudSyncMeta(cloudUser.id).localDirty===true&&hasMeaningfulPlannerData(state))await snapshotLocalState(reason);
            applyCloudPlannerState(data.state,data.updated_at||data.client_updated_at||"");
            setCloudSyncStatus("Synced","synced");
            return true;
          }
          '''
          new_push='''async function pushCloudState(reason="automatic"){
            if(!cloudClient||!cloudUser||cloudApplying||cloudAccess?.status!=="active")return false;
            clearTimeout(cloudSaveTimer);setCloudSyncStatus("Syncing…","syncing");
            const stamp=new Date().toISOString();
            const payload={user_id:cloudUser.id,state:state,app_version:APP_VERSION,client_updated_at:stamp};
            try{
              let data=null,error=null;
              if(reason==="first_user_upload"){
                ({data,error}=await cloudClient.from("planner_state").upsert(payload,{onConflict:"user_id"}).select("updated_at,client_updated_at").maybeSingle());
              }else{
                const meta=getCloudSyncMeta(cloudUser.id),baseline=meta.lastRemoteUpdatedAt||"";
                if(!baseline){
                  await pullLatestCloudAfterRejectedPush("sync_baseline_backup");
                  return false;
                }
                ({data,error}=await cloudClient.from("planner_state").update(payload).eq("user_id",cloudUser.id).eq("updated_at",baseline).select("updated_at,client_updated_at").maybeSingle());
                if(error)throw error;
                if(!data){
                  await pullLatestCloudAfterRejectedPush("cross_device_conflict_backup");
                  return false;
                }
              }
              if(error)throw error;
              const remoteStamp=data?.updated_at||data?.client_updated_at||stamp;
              setCloudSyncMeta({userId:cloudUser.id,lastSyncedAt:stamp,localModifiedAt:stamp,localDirty:false,lastRemoteUpdatedAt:remoteStamp});setCloudSyncStatus("Synced","synced");return true;
            }catch(error){console.error("Cloud sync failed",error);setCloudSyncStatus("Sync error","error");return false}
          }
          '''
          pattern=r'async function pushCloudState\(reason="automatic"\)\{.*?\n\}(?=\nasync function snapshotLocalState)'
          m=re.search(pattern,s,flags=re.S)
          if not m: raise SystemExit('push function not found')
          s=s[:m.start()]+helper+new_push+s[m.end():]
          
          new_reconcile='''async function reconcileCloudState({silent=false}={}){
            if(!cloudClient||!cloudUser||cloudAccess?.status!=="active")return;
            loadPlannerStateForUser(cloudUser.id);
            if(!silent)setCloudSyncStatus("Syncing…","syncing");
            try{
              const {data,error}=await cloudClient.from("planner_state").select("state,app_version,client_updated_at,updated_at").eq("user_id",cloudUser.id).maybeSingle();
              if(error)throw error;
              if(!data){
                if(hasMeaningfulPlannerData(state))await pushCloudState("first_user_upload");
                else setCloudSyncStatus("New planner","synced");
                return;
              }
              const remoteStamp=data.updated_at||data.client_updated_at||"";
              const meta=getCloudSyncMeta(cloudUser.id);
              const localDirty=meta.localDirty===true&&hasMeaningfulPlannerData(state);
              const baseline=meta.lastRemoteUpdatedAt||"";
              const baselineMatches=!!baseline&&!!remoteStamp&&Math.abs(isoMs(remoteStamp)-isoMs(baseline))<=1;
              if(localDirty){
                if(!baselineMatches){
                  await snapshotLocalState(baseline?"cross_device_conflict_backup":"sync_baseline_backup");
                  applyCloudPlannerState(data.state,remoteStamp);
                  setCloudSyncStatus("Synced","synced");
                  return;
                }
                await pushCloudState("local_pending");
                return;
              }
              applyCloudPlannerState(data.state,remoteStamp);
              setCloudSyncStatus("Synced","synced");
            }catch(error){console.error("Cloud restore failed",error);setCloudSyncStatus("Sync error","error")}
          }'''
          pattern2=r'async function reconcileCloudState\(\{silent=false\}=\{\}\)\{.*?\n\}(?=\nasync function fetchKnowledgeBaseOverrides)'
          m=re.search(pattern2,s,flags=re.S)
          if not m: raise SystemExit('reconcile function not found')
          s=s[:m.start()]+new_reconcile+s[m.end():]
          
          out.write_text(s,encoding='utf-8')
          print(out, out.stat().st_size)
          print('helper count',s.count('pullLatestCloudAfterRejectedPush'))
          print('CAS count',s.count('.eq("updated_at",baseline)'))
          print('old unsafe upsert automatic count',s.count('isoMs(localStamp)>isoMs(remoteStamp)+1000'))
          PY
      - name: Verify JavaScript and sync invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>',s.index('<script src='))+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/planner-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/planner-inline.js
          grep -F '<title>Peptide Planner v2026.0909.01</title>' index.html
          grep -F 'const APP_VERSION="v2026.0909.01";' index.html
          grep -F '.eq("updated_at",baseline)' index.html
          grep -F 'pullLatestCloudAfterRejectedPush("cross_device_conflict_backup")' index.html
          grep -F 'sync_baseline_backup' index.html
          if grep -F 'isoMs(localStamp)>isoMs(remoteStamp)+1000' index.html; then exit 1; fi
      - name: Commit index.html only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'v2026.0909.01 prevent stale cross-device overwrites'
          git push origin main
      - name: Export exact index
        run: cp index.html Peptide_Planner_v2026.0909.01.html
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v2026.0909.01_index
          path: Peptide_Planner_v2026.0909.01.html
