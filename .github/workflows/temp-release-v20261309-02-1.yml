name: Temporary Release Peptide_Planner_v20261309.02.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Temporary release workflow for Peptide_Planner_v20261309.02.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify, patch, validate and release
        shell: bash
        run: |
          set -euo pipefail
          BASE='82a40eff93b34d6a2e70c020ef47385bf20cde8f'
          RELEASE='Peptide_Planner_v20261309.02.1'
          WORKFLOW='.github/workflows/temp-release-v20261309-02-1.yml'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git hash-object index.html)" = '06650dbbc7eef1819ffa162f58f001f04baae811'
          test "$(git hash-object peptide-planner-sw.js)" = 'd28112a9a8374428ecc80bc7caae19a85987862d'
          export OLD64=''
          export NEW64=''
          python - <<'PYCODE'
          from pathlib import Path
          import os, base64, re
          p=Path('index.html')
          s=p.read_text()
          old=base64.b64decode(os.environ['OLD64']).decode()
          new=base64.b64decode(os.environ['NEW64']).decode()
          if s.count(old)!=1:
              raise SystemExit(f'Expected Full Dose helper once, found {s.count(old)}')
          s=s.replace(old,new)
          if s.count('Peptide_Planner_v20261309.02')!=2:
              raise SystemExit('Unexpected index release-version occurrence count')
          s=s.replace('Peptide_Planner_v20261309.02','Peptide_Planner_v20261309.02.1')
          p.write_text(s)
          sw=Path('peptide-planner-sw.js')
          t=sw.read_text()
          if t.count('Peptide_Planner_v20261309.02')!=1:
              raise SystemExit('Unexpected SW release-version occurrence count')
          sw.write_text(t.replace('Peptide_Planner_v20261309.02','Peptide_Planner_v20261309.02.1'))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/planner-inline.js').write_text(inline)
          PYCODE
          node --check /tmp/planner-inline.js
          node --check peptide-planner-sw.js
          git diff --check
          test "$(git hash-object index.html)" = 'd41eecfb2858926d411f4c543cbdc7e6aab204b8'
          test "$(git hash-object peptide-planner-sw.js)" = '54b20f77ced33136984ccd14dc7ac7018f3406cf'
          git rm "$WORKFLOW"
          git add index.html peptide-planner-sw.js
          mapfile -t CHANGED < <(git diff --name-only "$BASE" -- | sort)
          printf '%s\n' 'Net changed files from Release 2 baseline:' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 2
          test "${CHANGED[0]}" = 'index.html'
          test "${CHANGED[1]}" = 'peptide-planner-sw.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE"
          git push origin HEAD:main
