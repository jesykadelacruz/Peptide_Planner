name: Temporary v20260909.08 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chatgpt-v20260909-08.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          python .deploy/apply_v20260909_08_active_week_vial.py
          git checkout -- .deploy/apply_v20260909_08_active_week_vial.py
      - name: Validate exact scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --short | awk '{print $2}')" = "index.html"
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          h=Path('index.html').read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','HEAD:index.html'],text=True)
          assert '<title>Peptide Planner v2026.0909.04</title>' in h
          assert 'const APP_VERSION="v2026.0909.04";' in h
          # No style, sizing or formatting changes.
          styles=lambda text: re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>',text,re.S)
          assert styles(h)==styles(base), 'CSS/style blocks changed unexpectedly'
          # Requested active-week vial mapping is present in the cycled Dose Schedule path.
          for token in [
            'function cyclePhaseReferenceDate(plan,config,phase,sequence)',
            'function cyclePhaseDoseForDate(plan,phase,date,sequence,fallbackDose=null)',
            'referenceDate=sequence>0?cyclePhaseReferenceDate(plan,config,ph,sequence):null',
            'syncCyclePhaseCalculationsForSequence(plan,record.scheduleCycleNumber||cycleNumber)',
            'storedDose=cyclePhaseDose(config,week),dose=cyclePhaseDoseForDate(plan,phase,date,position.sequence,storedDose)'
          ]: assert token in h, token
          # Existing Vial Schedule display and Full/Cycle Dose logic remain untouched.
          assert '<th>#</th><th>Vial</th><th>Water</th><th>mg/mL</th><th>Full Dose</th><th>Cycle Dose</th><th>Open</th><th>Finish</th><th>Status</th>' in h
          assert 'const fullDoseCount=cycleFullDoseCountForDisplay(rowEvents,rowStartCursor,openDate,capacityUnits);' in h
          assert 'const cycleDoseCount=vialDoseCountForDisplay(rowEvents,rowStartCursor,openDate,capacityUnits,disposeDate||null);' in h
          # Continuous renderer markup remains byte-identical.
          def fn(text,start_marker,end_marker):
            a=text.index(start_marker);b=text.index(end_marker,a);return text[a:b]
          assert fn(h,'function renderContinuousDoseSchedule(plan){','function renderCycleDoseRows(plan,config,sequence){')==fn(base,'function renderContinuousDoseSchedule(plan){','function renderCycleDoseRows(plan,config,sequence){')
          # No Full Dose helper changes in this release.
          assert fn(h,'function cycleFullDoseCountForDisplay(','function simulateCycleVialWindow(')==fn(base,'function cycleFullDoseCountForDisplay(','function simulateCycleVialWindow(')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S)
          for i,s in enumerate(scripts): Path(f'/tmp/peptide-{i}.js').write_text(s,encoding='utf-8')
          print(f'Validated active-week vial reconciliation; {len(scripts)} inline scripts prepared')
          PY
          for f in /tmp/peptide-*.js; do node --check "$f"; done
          node --check peptide-planner-sw.js
      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name jesykadelacruz
          git config user.email 84807985+jesykadelacruz@users.noreply.github.com
          git add index.html
          git commit -m "Use active-week vial for cycled Dose Schedule"
          git push origin HEAD:main
      - name: Build exact Cloudflare package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          cp _headers index.html manifest.webmanifest peptide-planner-sw.js /tmp/pkg/
          cd /tmp/pkg
          zip -q "$GITHUB_WORKSPACE/Peptide_Planner_v20260909.08.zip" _headers index.html manifest.webmanifest peptide-planner-sw.js
          cd "$GITHUB_WORKSPACE"
          unzip -t Peptide_Planner_v20260909.08.zip
          python - <<'PY'
          import zipfile
          expected=['_headers','index.html','manifest.webmanifest','peptide-planner-sw.js']
          with zipfile.ZipFile('Peptide_Planner_v20260909.08.zip') as z: assert sorted(z.namelist())==sorted(expected),z.namelist()
          PY
          sha256sum Peptide_Planner_v20260909.08.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Peptide_Planner_v20260909.08
          path: Peptide_Planner_v20260909.08.zip
          if-no-files-found: error
