<script>
const V189_PARTS=[1,2,3,4].map(n=>`.deploy/v189_patch_part_${String(n).padStart(2,"0")}.b64`);
const V190_DELTA=[`.deploy/v190_delta_from_v189live.b64`];
const V191_DELTA=[`.deploy/v191_delta_from_v190live.b64`];
const V193_DELTA=[`.deploy/v193_delta_from_v191live.b64`];
const V194_DELTA=[`.deploy/v194_delta_from_v193live.b64`];
const V195_DELTA=[1,2,3,4].map(n=>`.deploy/v195_delta_part_${String(n).padStart(2,"0")}.b64`);
const V1_DELTA=[`.deploy/v1_delta_from_v195live.b64`];
const V2_DELTA=[`.deploy/v2_delta_from_v1live.b64`];
const V3_DELTA=[`.deploy/v3_delta_from_v2live.b64`];
const V4_DELTA=[`.deploy/v4_delta_from_v3live.b64`];
const V5_DELTA=[`.deploy/v5_delta_from_v4live.b64`];
const V6_DELTA=[`.deploy/v6_delta_from_v5live.b64`];
const V7_DELTA=[`.deploy/v7_delta_from_v6live.b64`];
const V8_DELTA=[`.deploy/v8_delta_from_v7live.b64`];
const V9_DELTA=[1,2,3,4].map(n=>`.deploy/v9_delta_part_${String(n).padStart(2,"0")}.b64`);
const V15_DELTA=[
  `.deploy/v15_patch_part_01.b64`,
  `.deploy/v15_patch_part_02.b64`,
  `.deploy/v15_patch_part_03a.b64`,
  `.deploy/v15_patch_part_03b.b64`,
  `.deploy/v15_patch_part_04.b64`,
  `.deploy/v15_patch_part_05.b64`,
  `.deploy/v15_patch_part_06.b64`
];
const V18_DELTA=[`.deploy/v18_delta_from_v15.b64`];
const V19_DELTA=[`.deploy/v19_delta_from_v18.b64`];
const V20_DELTA=[`.deploy/v20_delta_from_v19live.b64`];
const V21_DELTA=[`.deploy/v21_delta_from_v20.b64`];
const EXPECTED_V9_SHA256="bcebcd78b5a63a518e5114cea56e787800ab0d71fbd4b835b2e9b3ee5ee389d3";
const EXPECTED_V15_SHA256="59543b450c89db382c2be4da8a31df98528b9893d8bfb6f38c8077e9bce8a536";
const EXPECTED_V18_SHA256="50e2fd4c3902b935144adb58fad943cdb6fd886c28e4a56a42f414ed835987cb";
const EXPECTED_V19_SHA256="f544d8a6a345be415cc33ea7ddb922b9e40efac0d2865866fa90791d05a71eb6";
const EXPECTED_V20_SHA256="24b8bd159b1e14480299da11cbef6a71eccf125ccacccff8fca1febead2b3af3";
const EXPECTED_V21_SHA256="16189d4a94f44f0f36428b698a0bee19e03035be12c77954d104018f991fb7a0";

function splitLines(s){return s.match(/[^\n]*\n|[^\n]+$/g)||[]}
function applyUnifiedPatch(source,patch){
 const src=splitLines(source),pl=splitLines(patch),out=[];let si=0,i=0;
 while(i<pl.length&&!pl[i].startsWith("@@ "))i++;
 while(i<pl.length){
  const m=pl[i].replace(/\n$/,"" ).match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
  if(!m)throw new Error("Invalid deployment patch");
  const oldStart=Number(m[1]),oldCount=m[2]===undefined?1:Number(m[2]),target=oldCount===0?oldStart:oldStart-1;
  if(target<si)throw new Error("Overlapping deployment patch");
  while(si<target)out.push(src[si++]);
  i++;let consumed=0;
  while(i<pl.length&&!pl[i].startsWith("@@ ")){
   const line=pl[i],mark=line[0],body=line.slice(1);
   if(mark===" "){if(src[si]!==body)throw new Error("Deployment context mismatch");out.push(src[si++]);consumed++}
   else if(mark==="-"){if(src[si]!==body)throw new Error("Deployment source mismatch");si++;consumed++}
   else if(mark==="+")out.push(body);
   else if(mark!=="\\"&&line.trim()!=="")throw new Error("Invalid deployment patch line");
   i++;
  }
  if(consumed!==oldCount)throw new Error("Deployment patch count mismatch");
 }
 while(si<src.length)out.push(src[si++]);
 return out.join("");
}
async function getText(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok)throw new Error(`Unable to load ${url}`);
 return r.text();
}
async function inflateParts(paths){
 const chunks=await Promise.all(paths.map(getText));
 const bytes=Uint8Array.from(atob(chunks.join("")),c=>c.charCodeAt(0));
 return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
}
async function sha256Hex(text){
 const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
 return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");
}

(async()=>{
 const status=document.getElementById("loadStatus");
 status.textContent="Preparing v21…";
 const [base,v189Patch,v190Patch,v191Patch,v193Patch,v194Patch,v195Patch,v1Patch,v2Patch,v3Patch,v4Patch,v5Patch,v6Patch,v7Patch,v8Patch,v9Patch,v15Patch,v18Patch,v19Patch,v20Patch,v21Patch]=await Promise.all([
  getText("Peptide_Planner_KB_Mobile_v184.html"),
  inflateParts(V189_PARTS),inflateParts(V190_DELTA),inflateParts(V191_DELTA),inflateParts(V193_DELTA),inflateParts(V194_DELTA),inflateParts(V195_DELTA),inflateParts(V1_DELTA),inflateParts(V2_DELTA),inflateParts(V3_DELTA),inflateParts(V4_DELTA),inflateParts(V5_DELTA),inflateParts(V6_DELTA),inflateParts(V7_DELTA),inflateParts(V8_DELTA),inflateParts(V9_DELTA),inflateParts(V15_DELTA),inflateParts(V18_DELTA),inflateParts(V19_DELTA),inflateParts(V20_DELTA),inflateParts(V21_DELTA)
 ]);
 const v189=applyUnifiedPatch(base,v189Patch);
 const v190=applyUnifiedPatch(v189,v190Patch);
 const v191=applyUnifiedPatch(v190,v191Patch);
 const v193=applyUnifiedPatch(v191,v193Patch);
 const v194=applyUnifiedPatch(v193,v194Patch);
 const v195=applyUnifiedPatch(v194,v195Patch);
 const v1=applyUnifiedPatch(v195,v1Patch);
 const v2=applyUnifiedPatch(v1,v2Patch);
 const v3=applyUnifiedPatch(v2,v3Patch);
 const v4=applyUnifiedPatch(v3,v4Patch);
 const v5=applyUnifiedPatch(v4,v5Patch);
 const v6=applyUnifiedPatch(v5,v6Patch);
 const v7=applyUnifiedPatch(v6,v7Patch);
 const v8=applyUnifiedPatch(v7,v8Patch);
 const v9=applyUnifiedPatch(v8,v9Patch);
 const v9Hash=await sha256Hex(v9);
 if(v9Hash!==EXPECTED_V9_SHA256)throw new Error(`v9 base checksum mismatch: ${v9Hash}`);

 const v15=applyUnifiedPatch(v9,v15Patch);
 const v15Hash=await sha256Hex(v15);
 if(v15Hash!==EXPECTED_V15_SHA256)throw new Error(`v15 checksum mismatch: ${v15Hash}`);

 const v18=applyUnifiedPatch(v15,v18Patch);
 const v18Hash=await sha256Hex(v18);
 if(v18Hash!==EXPECTED_V18_SHA256)throw new Error(`v18 checksum mismatch: ${v18Hash}`);

 const v19=applyUnifiedPatch(v18,v19Patch);
 const v19Hash=await sha256Hex(v19);
 if(v19Hash!==EXPECTED_V19_SHA256)throw new Error(`v19 checksum mismatch: ${v19Hash}`);
 const v19live=v19.replace('</head>',`<style id="time-box-dimension-fix">@media(max-width:760px){body.mobile-app #planner .cycle-config-grid>div:nth-child(2){min-width:0!important;max-width:100%!important;overflow:hidden!important}body.mobile-app #planner .cycle-config-grid>div:nth-child(2)>input[type="time"][data-cycle-config-field="injectionTime"]{-webkit-appearance:none!important;appearance:none!important;display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;inline-size:100%!important;min-inline-size:0!important;max-inline-size:100%!important;height:46px!important;min-height:46px!important;max-height:46px!important;block-size:46px!important;padding:0 11px!important;line-height:1.2!important;box-sizing:border-box!important;overflow:hidden!important}body.mobile-app #planner .cycle-config-grid>div:nth-child(2)>input[type="time"][data-cycle-config-field="injectionTime"]::-webkit-date-and-time-value{width:100%!important;min-width:0!important;max-width:100%!important;padding:0!important;margin:0!important}}</style></head>`);

 const v20=applyUnifiedPatch(v19live,v20Patch);
 const required=[
  '<title>Peptide Planner v20</title>',
  'const APP_VERSION="v20";',
  'id="plannerAccessGate"',
  'planner_access_members',
  'signInWithPassword',
  'signUp',
  'resetPasswordForEmail',
  'PASSWORD_RECOVERY',
  'updateUser({password})',
  'https://srfuwxjwulvbalzoymcc.supabase.co',
  'from("planner_state")',
  'from("planner_snapshots")',
  'from("knowledge_base_entries")'
 ];
 const missing=required.filter(x=>!v20.includes(x));
 if(missing.length)throw new Error("Official v20 failed feature validation: "+missing.join(", "));
 const v20Hash=await sha256Hex(v20);
 if(v20Hash!==EXPECTED_V20_SHA256)throw new Error(`v20 checksum mismatch: ${v20Hash}`);

 const v21=applyUnifiedPatch(v20,v21Patch);
 const requiredV21=[
  '<title>Peptide Planner v21</title>',
  'const APP_VERSION="v21";',
  'id="v21-time-field-dimension-fix"',
  'data-cycle-config-field="injectionTime"',
  'id="plannerAccessGate"',
  'planner_access_members',
  'signInWithPassword',
  'signUp',
  'resetPasswordForEmail',
  'PASSWORD_RECOVERY',
  'updateUser({password})',
  'https://srfuwxjwulvbalzoymcc.supabase.co',
  'from("planner_state")',
  'from("planner_snapshots")',
  'from("knowledge_base_entries")'
 ];
 const missingV21=requiredV21.filter(x=>!v21.includes(x));
 if(missingV21.length)throw new Error("Official v21 failed feature validation: "+missingV21.join(", "));
 const v21Hash=await sha256Hex(v21);
 if(v21Hash!==EXPECTED_V21_SHA256)throw new Error(`v21 checksum mismatch: ${v21Hash}`);
 document.open();document.write(v21);document.close();
})().catch(err=>{
 console.error(err);
 const s=document.getElementById("loadStatus");
 if(s)s.textContent="Unable to load Peptide Planner v21. Refresh and try again.";
});
</script>
