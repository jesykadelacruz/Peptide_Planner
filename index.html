<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#216b5f">
<title>Peptide Planner</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3faf6;color:#17382f}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading strong{display:block;font-size:1.1rem}.loading small{display:block;margin-top:8px;color:#667a72}</style>
</head>
<body>
<div class="loading"><div><strong>Peptide Planner</strong><small id="loadStatus">Loading…</small></div></div>
<script>
const P1=[1,2,3,4].map(n=>`.deploy/live_v186_p1_${n}.txt`);
const P2=[1,2].map(n=>`.deploy/live_v186_p2_${n}.txt`);
function splitLines(s){return s.match(/[^\n]*\n|[^\n]+$/g)||[]}
function applyUnifiedPatch(source,patch){
 const src=splitLines(source),pl=splitLines(patch),out=[];let si=0,i=0;
 while(i<pl.length&&!pl[i].startsWith("@@ "))i++;
 while(i<pl.length){
  const m=pl[i].replace(/\n$/,"").match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
  if(!m)throw new Error("Invalid deployment patch");
  const oldStart=Number(m[1]),oldCount=m[2]===undefined?1:Number(m[2]),target=oldCount===0?oldStart:oldStart-1;
  if(target<si)throw new Error("Overlapping deployment patch");
  while(si<target)out.push(src[si++]);
  i++;let consumed=0;
  while(i<pl.length&&!pl[i].startsWith("@@ ")){
   const line=pl[i],mark=line[0],body=line.slice(1);
   if(mark===" "){if(src[si]!==body)throw new Error("Deployment context mismatch");out.push(src[si++]);consumed++}
   else if(mark==="-"){if(src[si]!==body)throw new Error("Deployment source mismatch");si++;consumed++}
   else if(mark==="+")out.push(body);
   else if(mark!=="\\"&&line.trim()!=="")throw new Error("Invalid deployment patch line");
   i++;
  }
  if(consumed!==oldCount)throw new Error("Deployment patch count mismatch");
 }
 while(si<src.length)out.push(src[si++]);
 return out.join("");
}
async function getText(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(`Unable to load ${url}`);return r.text()}
async function inflateParts(paths){
 const chunks=await Promise.all(paths.map(getText));
 const bytes=Uint8Array.from(atob(chunks.join("")),c=>c.charCodeAt(0));
 return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
}
(async()=>{
 document.getElementById("loadStatus").textContent="Preparing v186…";
 const [base,p1,p2]=await Promise.all([getText("Peptide_Planner_KB_Mobile_v184.html"),inflateParts(P1),inflateParts(P2)]);
 const v186=applyUnifiedPatch(applyUnifiedPatch(base,p1),p2);
 document.open();document.write(v186);document.close();
})().catch(err=>{console.error(err);const s=document.getElementById("loadStatus");if(s)s.textContent="Unable to load the planner. Refresh and try again."});
</script>
</body>
</html>
