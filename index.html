<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#216b5f">
<title>Peptide Planner v193</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3faf6;color:#17382f}
.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.loading strong{display:block;font-size:1.1rem}
.loading small{display:block;margin-top:8px;color:#667a72;max-width:560px}
</style>
</head>
<body>
<div class="loading"><div><strong>Peptide Planner v193</strong><small id="loadStatus">Loading the latest planner…</small></div></div>
<script>
const V189_PARTS=[1,2,3,4].map(n=>`.deploy/v189_patch_part_${String(n).padStart(2,"0")}.b64`);
const V190_DELTA=[`.deploy/v190_delta_from_v189live.b64`];
const V191_DELTA=[`.deploy/v191_delta_from_v190live.b64`];
const V193_DELTA=[`.deploy/v193_delta_from_v191live.b64`];
const EXPECTED_V193_SHA256="7acb20db54fad09b4cc85e1b5c64b6a545ed3381e1ae8707c3fa615d18ba6623";
function splitLines(s){return s.match(/[^\n]*\n|[^\n]+$/g)||[]}
function applyUnifiedPatch(source,patch){
 const src=splitLines(source),pl=splitLines(patch),out=[];let si=0,i=0;
 while(i<pl.length&&!pl[i].startsWith("@@ "))i++;
 while(i<pl.length){
  const m=pl[i].replace(/\n$/,"").match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
  if(!m)throw new Error("Invalid deployment patch");
  const oldStart=Number(m[1]),oldCount=m[2]===undefined?1:Number(m[2]),target=oldCount===0?oldStart:oldStart-1;
  if(target<si)throw new Error("Overlapping deployment patch");
  while(si<target)out.push(src[si++]);
  i++;let consumed=0;
  while(i<pl.length&&!pl[i].startsWith("@@ ")){
   const line=pl[i],mark=line[0],body=line.slice(1);
   if(mark===" "){if(src[si]!==body)throw new Error("Deployment context mismatch");out.push(src[si++]);consumed++}
   else if(mark==="-"){if(src[si]!==body)throw new Error("Deployment source mismatch");si++;consumed++}
   else if(mark==="+")out.push(body);
   else if(mark!=="\\"&&line.trim()!=="")throw new Error("Invalid deployment patch line");
   i++;
  }
  if(consumed!==oldCount)throw new Error("Deployment patch count mismatch");
 }
 while(si<src.length)out.push(src[si++]);
 return out.join("");
}
async function getText(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok)throw new Error(`Unable to load ${url}`);
 return r.text();
}
async function inflateParts(paths){
 const chunks=await Promise.all(paths.map(getText));
 const bytes=Uint8Array.from(atob(chunks.join("")),c=>c.charCodeAt(0));
 return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
}
async function sha256Hex(text){
 const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
 return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");
}
(async()=>{
 const status=document.getElementById("loadStatus");
 status.textContent="Preparing v193…";
 const [base,v189Patch,v190Patch,v191Patch,v193Patch]=await Promise.all([
  getText("Peptide_Planner_KB_Mobile_v184.html"),
  inflateParts(V189_PARTS),
  inflateParts(V190_DELTA),
  inflateParts(V191_DELTA),
  inflateParts(V193_DELTA)
 ]);
 const v189=applyUnifiedPatch(base,v189Patch);
 const v190=applyUnifiedPatch(v189,v190Patch);
 const v191=applyUnifiedPatch(v190,v191Patch);
 const v193=applyUnifiedPatch(v191,v193Patch);
 const required=[
  "Peptide Treatment Planner Mobile v193",
  'APP_VERSION="v193"',
  'id="v192-vials-buy-two-line-lock"',
  'id="v193-phase-layout-fix"',
  'id="cloudAccountBar"',
  'id="cloudSignIn"',
  'id="cloudSignUp"',
  'id="cloudSyncNow"',
  'id="cloudSignOut"',
  'id="cloudAuthOverlay"',
  'signInWithPassword',
  'from("planner_state")',
  'from("planner_snapshots")',
  'from("knowledge_base_entries")',
  'showCloudAuth("signin")',
  'initCloudServices();'
 ];
 const missing=required.filter(x=>!v193.includes(x));
 if(missing.length)throw new Error("Latest planner failed feature validation: "+missing.join(", "));
 const actualHash=await sha256Hex(v193);
 if(actualHash!==EXPECTED_V193_SHA256)throw new Error(`Latest planner checksum mismatch: ${actualHash}`);
 document.open();document.write(v193);document.close();
})().catch(err=>{
 console.error(err);
 const s=document.getElementById("loadStatus");
 if(s)s.textContent="Unable to load the latest planner. Refresh and try again.";
});
</script>
<!-- production-loader: v193 account-sync verified -->
</body>
</html>
